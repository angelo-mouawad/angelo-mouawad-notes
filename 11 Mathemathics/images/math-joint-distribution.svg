<text x="125" y="287.55" font-family="'Segoe UI', 'Segoe UI Symbol', 'DejaVu Sans', 'Cambria Math', sans-serif" font-size="13" font-weight="normal" fill="#334155" text-anchor="start">■ margins (row and column sums): the distribution of X alone and of Y alone</text>
<text x="125" y="305.1" font-family="'Segoe UI', 'Segoe UI Symbol', 'DejaVu Sans', 'Cambria Math', sans-serif" font-size="13" font-weight="normal" fill="#334155" text-anchor="start">■ conditional: P(smoker | housing) = (5/51) / (21/51) = 5/21 ≈ 24%</text>
