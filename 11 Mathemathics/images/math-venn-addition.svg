<rect x="20" y="30" width="520" height="300" rx="10" fill="#f8fafc" fill-opacity="1" stroke="#64748b" stroke-width="1.5"/>
<text x="40" y="58" font-family="'Segoe UI', 'Segoe UI Symbol', 'DejaVu Sans', 'Cambria Math', sans-serif" font-size="14" font-weight="bold" fill="#334155" text-anchor="start">Ω = {1, 2, 3, 4, 5, 6}</text>
<circle cx="220" cy="190" r="110" fill="#dbeafe" fill-opacity="0.75" stroke="#1d4ed8" stroke-width="2"/>
<circle cx="350" cy="190" r="110" fill="#d1fae5" fill-opacity="0.75" stroke="#0f766e" stroke-width="2"/>
<path d="M285,101 A110,110 0 0,1 285,279 A110,110 0 0,1 285,101 z" fill="#fef3c7" stroke="none"/>
<circle cx="220" cy="190" r="110" fill="none" fill-opacity="1" stroke="#1d4ed8" stroke-width="2"/>
<circle cx="350" cy="190" r="110" fill="none" fill-opacity="1" stroke="#0f766e" stroke-width="2"/>
<text x="150" y="318" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1d4ed8" text-anchor="middle">A: odd</text>
<text x="420" y="318" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f766e" text-anchor="middle">B: at least 4</text>
<circle cx="170" cy="170" r="15" fill="#ffffff" fill-opacity="1" stroke="#334155" stroke-width="1.3"/>
<text x="170" y="175" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">1</text>
<circle cx="190" cy="230" r="15" fill="#ffffff" fill-opacity="1" stroke="#334155" stroke-width="1.3"/>
<text x="190" y="235" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">3</text>
<circle cx="380" cy="165" r="15" fill="#ffffff" fill-opacity="1" stroke="#334155" stroke-width="1.3"/>
<text x="380" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">4</text>
<circle cx="400" cy="225" r="15" fill="#ffffff" fill-opacity="1" stroke="#334155" stroke-width="1.3"/>
<text x="400" y="230" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">6</text>
<circle cx="285" cy="190" r="15" fill="#ffffff" fill-opacity="1" stroke="#be123c" stroke-width="1.3"/>
<text x="285" y="195" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#be123c" text-anchor="middle">5</text>
<circle cx="505" cy="70" r="15" fill="#ffffff" fill-opacity="1" stroke="#334155" stroke-width="1.3"/>
<text x="505" y="75" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">2</text>
<text x="285" y="228" font-family="'Segoe UI', 'Segoe UI Symbol', 'DejaVu Sans', 'Cambria Math', sans-serif" font-size="12" font-weight="bold" fill="#be123c" text-anchor="middle">A ∩ B</text>
<text x="720" y="80.0" font-family="'Segoe UI', 'Segoe UI Symbol', 'DejaVu Sans', 'Cambria Math', sans-serif" font-size="14" font-weight="normal" fill="#334155" text-anchor="middle">P(A) = 3/6,  P(B) = 3/6</text>
<text x="720" y="98.9" font-family="'Segoe UI', 'Segoe UI Symbol', 'DejaVu Sans', 'Cambria Math', sans-serif" font-size="14" font-weight="normal" fill="#334155" text-anchor="middle"></text>
<text x="720" y="117.80000000000001" font-family="'Segoe UI', 'Segoe UI Symbol', 'DejaVu Sans', 'Cambria Math', sans-serif" font-size="14" font-weight="normal" fill="#334155" text-anchor="middle">adding them counts 5 twice</text>
<text x="720" y="136.7" font-family="'Segoe UI', 'Segoe UI Symbol', 'DejaVu Sans', 'Cambria Math', sans-serif" font-size="14" font-weight="normal" fill="#334155" text-anchor="middle"></text>
<text x="720" y="155.60000000000002" font-family="'Segoe UI', 'Segoe UI Symbol', 'DejaVu Sans', 'Cambria Math', sans-serif" font-size="14" font-weight="normal" fill="#334155" text-anchor="middle">P(A ∪ B) = P(A) + P(B) − P(A ∩ B)</text>
<text x="720" y="174.5" font-family="'Segoe UI', 'Segoe UI Symbol', 'DejaVu Sans', 'Cambria Math', sans-serif" font-size="14" font-weight="normal" fill="#334155" text-anchor="middle">= 3/6 + 3/6 − 1/6</text>
<text x="720" y="193.4" font-family="'Segoe UI', 'Segoe UI Symbol', 'DejaVu Sans', 'Cambria Math', sans-serif" font-size="14" font-weight="normal" fill="#334155" text-anchor="middle">= 5/6</text>
<rect x="580" y="260" width="280" height="64" rx="8" fill="#d1fae5" fill-opacity="1" stroke="#0f766e" stroke-width="1.5"/>
<text x="720" y="284.0" font-family="'Segoe UI', 'Segoe UI Symbol', 'DejaVu Sans', 'Cambria Math', sans-serif" font-size="13" font-weight="bold" fill="#0f766e" text-anchor="middle">mutually exclusive (A ∩ B = ∅):</text>
<text x="720" y="301.55" font-family="'Segoe UI', 'Segoe UI Symbol', 'DejaVu Sans', 'Cambria Math', sans-serif" font-size="13" font-weight="bold" fill="#0f766e" text-anchor="middle">P(A ∪ B) = P(A) + P(B)</text>
</svg>