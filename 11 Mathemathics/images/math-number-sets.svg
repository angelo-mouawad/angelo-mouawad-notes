<svg xmlns="http://www.w3.org/2000/svg" width="940" height="430" viewBox="0 0 940 430">
<rect x="0" y="0" width="940" height="430" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be123c"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect x="20" y="20" width="900" height="340" rx="14" fill="#ffe4e6" fill-opacity="1" stroke="#64748b" stroke-width="1.6"/>
<text x="34" y="46" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#334155" text-anchor="start">C  Complex</text>
<rect x="40" y="62" width="710" height="288" rx="14" fill="#fef3c7" fill-opacity="1" stroke="#64748b" stroke-width="1.6"/>
<text x="54" y="88" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#334155" text-anchor="start">R  Real</text>
<rect x="60" y="104" width="520" height="236" rx="14" fill="#dbeafe" fill-opacity="1" stroke="#64748b" stroke-width="1.6"/>
<text x="74" y="130" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#334155" text-anchor="start">Q  Rational</text>
<rect x="80" y="146" width="330" height="184" rx="14" fill="#d1fae5" fill-opacity="1" stroke="#64748b" stroke-width="1.6"/>
<text x="94" y="172" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#334155" text-anchor="start">Z  Integers</text>
<rect x="100" y="188" width="140" height="132" rx="14" fill="#ffffff" fill-opacity="1" stroke="#0f766e" stroke-width="1.6"/>
<text x="114" y="214" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#0f766e" text-anchor="start">N  Natural</text>
<text x="835.0" y="238.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#334155" text-anchor="middle">3 + 2i,  −i</text>
<text x="835.0" y="255.55" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#334155" text-anchor="middle">i = √−1</text>
<text x="835.0" y="273.1" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#334155" text-anchor="middle">signals, graphics</text>
<text x="665.0" y="238.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#334155" text-anchor="middle">√2,  π,  e</text>
<text x="665.0" y="255.55" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#334155" text-anchor="middle">irrational: no</text>
<text x="665.0" y="273.1" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#334155" text-anchor="middle">fraction exists</text>
<text x="495.0" y="238.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#334155" text-anchor="middle">1/2,  −3/4,  5/1</text>
<text x="495.0" y="255.55" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#334155" text-anchor="middle">decimals stop</text>
<text x="495.0" y="273.1" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#334155" text-anchor="middle">or repeat</text>
<text x="325.0" y="238.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#334155" text-anchor="middle">…, −2, −1, 0, 1</text>
<text x="325.0" y="255.55" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#334155" text-anchor="middle">signs: gains,</text>
<text x="325.0" y="273.1" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#334155" text-anchor="middle">losses, coords</text>
<text x="170.0" y="250.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#334155" text-anchor="middle">0, 1, 2, 3, …</text>
<text x="170.0" y="267.55" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#334155" text-anchor="middle">counting,</text>
<text x="170.0" y="285.1" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#334155" text-anchor="middle">array indexes</text>
<text x="470" y="400" font-family="'Segoe UI', 'Segoe UI Symbol', 'DejaVu Sans', 'Cambria Math', sans-serif" font-size="20" font-weight="bold" fill="#0f766e" text-anchor="middle">N  ⊂  Z  ⊂  Q  ⊂  R  ⊂  C</text>
<text x="470" y="422" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#64748b" text-anchor="middle">every set contains the whole set inside it, plus numbers the smaller one cannot express</text>
</svg>