<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" width="900" height="390" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be123c"/></marker>
</defs>
<rect x="0" y="0" width="900" height="390" fill="#ffffff"/>
<text x="24" y="38" font-size="20" text-anchor="start" font-weight="700" fill="#0f766e">Processes and Threads</text>
<rect x="24" y="62" width="560" height="300" rx="12" fill="#f1f5f9" stroke="#0f766e" stroke-width="2"/>
<text x="44" y="90" font-size="15" text-anchor="start" font-weight="700" fill="#0f766e">Process A  (e.g. your Spring Boot server)</text>
<rect x="44" y="104" width="520" height="62" rx="10" fill="#d1fae5" stroke="#475569" stroke-width="1.5"/>
<text x="304.0" y="130.1" font-size="14" text-anchor="middle" font-weight="700" fill="#0f172a">Shared by all threads</text>
<text x="304.0" y="149.7" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">code, heap, global variables, open files and sockets</text>
<rect x="44" y="190" width="160" height="150" rx="10" fill="#dbeafe" stroke="#475569" stroke-width="1.5"/>
<text x="124.0" y="230.9" font-size="14" text-anchor="middle" font-weight="700" fill="#0f172a">Thread 1</text>
<text x="124.0" y="256.9" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">own stack</text>
<text x="124.0" y="282.9" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">own registers</text>
<text x="124.0" y="308.9" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">own program counter</text>
<rect x="224" y="190" width="160" height="150" rx="10" fill="#dbeafe" stroke="#475569" stroke-width="1.5"/>
<text x="304.0" y="230.9" font-size="14" text-anchor="middle" font-weight="700" fill="#0f172a">Thread 2</text>
<text x="304.0" y="256.9" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">own stack</text>
<text x="304.0" y="282.9" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">own registers</text>
<text x="304.0" y="308.9" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">own program counter</text>
<rect x="404" y="190" width="160" height="150" rx="10" fill="#dbeafe" stroke="#475569" stroke-width="1.5"/>
<text x="484.0" y="230.9" font-size="14" text-anchor="middle" font-weight="700" fill="#0f172a">Thread 3</text>
<text x="484.0" y="256.9" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">own stack</text>
<text x="484.0" y="282.9" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">own registers</text>
<text x="484.0" y="308.9" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">own program counter</text>
<rect x="610" y="62" width="266" height="300" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
<text x="630" y="90" font-size="15" text-anchor="start" font-weight="700" fill="#0f172a">Process B</text>
<rect x="630" y="104" width="226" height="62" rx="10" fill="#fef3c7" stroke="#475569" stroke-width="1.5"/>
<text x="743.0" y="130.1" font-size="14" text-anchor="middle" font-weight="700" fill="#0f172a">Own memory space</text>
<text x="743.0" y="149.7" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">nothing shared with A</text>
<rect x="630" y="190" width="226" height="70" rx="10" fill="#dbeafe" stroke="#475569" stroke-width="1.5"/>
<text x="743.0" y="220.1" font-size="14" text-anchor="middle" font-weight="700" fill="#0f172a">Thread 1</text>
<text x="743.0" y="239.7" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">single threaded</text>
<text x="743" y="296" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">Processes are isolated.</text>
<text x="743" y="316" font-size="13" text-anchor="middle" font-weight="400" fill="#64748b">They talk through IPC:</text>
<text x="743" y="336" font-size="13" text-anchor="middle" font-weight="400" fill="#64748b">pipes, sockets, files.</text>
</svg>
