<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be123c"/></marker>
</defs>
<rect x="0" y="0" width="900" height="450" fill="#ffffff"/>
<text x="24" y="38" font-size="20" text-anchor="start" font-weight="700" fill="#0f766e">Stack vs Heap</text>
<rect x="24" y="64" width="280" height="270" rx="10" fill="#0f172a" stroke="#0f172a" stroke-width="1.5"/>
<text x="42" y="100" font-size="14" text-anchor="start" font-weight="400" fill="#e2e8f0" font-family="Consolas, Menlo, Courier New, monospace">def greet(name):</text>
<text x="42" y="126" font-size="14" text-anchor="start" font-weight="400" fill="#e2e8f0" font-family="Consolas, Menlo, Courier New, monospace">    msg = &#x27;Hi &#x27; + name</text>
<text x="42" y="152" font-size="14" text-anchor="start" font-weight="400" fill="#e2e8f0" font-family="Consolas, Menlo, Courier New, monospace">    return msg</text>
<text x="42" y="178" font-size="14" text-anchor="start" font-weight="400" fill="#e2e8f0" font-family="Consolas, Menlo, Courier New, monospace"></text>
<text x="42" y="204" font-size="14" text-anchor="start" font-weight="400" fill="#e2e8f0" font-family="Consolas, Menlo, Courier New, monospace">user = User(&#x27;Angelo&#x27;)</text>
<text x="42" y="230" font-size="14" text-anchor="start" font-weight="400" fill="#e2e8f0" font-family="Consolas, Menlo, Courier New, monospace">greet(user.name)</text>
<text x="42" y="312" font-size="13" text-anchor="start" font-weight="400" fill="#94a3b8" font-family="Consolas, Menlo, Courier New, monospace"># Python example</text>
<rect x="330" y="64" width="270" height="270" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
<text x="465" y="90" font-size="15" text-anchor="middle" font-weight="700" fill="#0f766e">STACK</text>
<text x="465" y="112" font-size="12" text-anchor="middle" font-weight="400" fill="#64748b">push on call, pop on return</text>
<rect x="350" y="140" width="230" height="92" rx="10" fill="#dbeafe" stroke="#475569" stroke-width="1.5"/>
<text x="362" y="160" font-size="13" text-anchor="start" font-weight="700" fill="#0f172a">greet()  (top, running now)</text>
<text x="362" y="186" font-size="13" text-anchor="start" font-weight="400" fill="#0f172a" font-family="Consolas, Menlo, Courier New, monospace">name  -&gt;</text>
<text x="362" y="212" font-size="13" text-anchor="start" font-weight="400" fill="#0f172a" font-family="Consolas, Menlo, Courier New, monospace">msg   -&gt;</text>
<rect x="350" y="244" width="230" height="70" rx="10" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<text x="362" y="266" font-size="13" text-anchor="start" font-weight="700" fill="#0f172a">module / main</text>
<text x="362" y="294" font-size="13" text-anchor="start" font-weight="400" fill="#0f172a" font-family="Consolas, Menlo, Courier New, monospace">user  -&gt;</text>
<rect x="626" y="64" width="250" height="270" rx="10" fill="#fef3c7" stroke="#475569" stroke-width="1.5"/>
<text x="751" y="90" font-size="15" text-anchor="middle" font-weight="700" fill="#b45309">HEAP</text>
<rect x="656" y="110" width="190" height="56" rx="10" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<text x="751.0" y="133.45000000000002" font-size="13" text-anchor="middle" font-weight="700" fill="#0f172a">User object</text>
<text x="751.0" y="151.65" font-size="12" text-anchor="middle" font-weight="400" fill="#0f172a">name -&gt; ref</text>
<rect x="656" y="196" width="190" height="40" rx="10" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<text x="751.0" y="220.55" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">&#x27;Angelo&#x27;  (str)</text>
<rect x="656" y="266" width="190" height="40" rx="10" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<text x="751.0" y="290.55" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">&#x27;Hi Angelo&#x27;  (str)</text>
<line x1="430" y1="290" x2="654" y2="140" stroke="#0f766e" stroke-width="1.8" marker-end="url(#aht)"/>
<line x1="430" y1="182" x2="654" y2="214" stroke="#0f766e" stroke-width="1.8" marker-end="url(#aht)"/>
<line x1="430" y1="208" x2="654" y2="284" stroke="#0f766e" stroke-width="1.8" marker-end="url(#aht)"/>
<line x1="751" y1="166" x2="751" y2="194" stroke="#0f766e" stroke-width="1.8" marker-end="url(#aht)"/>
<text x="465" y="362" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">Stack: fast, automatic, LIFO, small.</text>
<text x="465" y="384" font-size="13" text-anchor="middle" font-weight="400" fill="#64748b">Freed the moment a function returns.</text>
<text x="751" y="362" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">Heap: flexible size, shared.</text>
<text x="751" y="384" font-size="13" text-anchor="middle" font-weight="400" fill="#64748b">Garbage collected (freed by hand in C).</text>
<text x="450" y="426" font-size="13" text-anchor="middle" font-weight="400" fill="#64748b" font-style="italic">Variables on the stack hold references. The actual objects live on the heap.</text>
</svg>
