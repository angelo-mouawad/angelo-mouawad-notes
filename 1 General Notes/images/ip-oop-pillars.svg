<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 340" width="980" height="340" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be123c"/></marker>
</defs>
<rect x="0" y="0" width="980" height="340" fill="#ffffff"/>
<text x="24" y="38" font-size="20" text-anchor="start" font-weight="700" fill="#0f766e">The Four Pillars of OOP</text>
<rect x="24" y="62" width="218" height="256" rx="10" fill="#d1fae5" stroke="#475569" stroke-width="1.5"/>
<rect x="24" y="62" width="218" height="8" rx="4" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/>
<text x="133" y="100" font-size="17" text-anchor="middle" font-weight="700" fill="#0f766e">Encapsulation</text>
<text x="133" y="122" font-size="13" text-anchor="middle" font-weight="400" fill="#64748b" font-style="italic">bundle and protect</text>
<text x="133" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">Data and methods live</text>
<text x="133" y="180" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">together in a class.</text>
<text x="133" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">Fields stay private,</text>
<text x="133" y="224" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">access goes via methods.</text>
<rect x="36" y="260" width="194" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="133" y="285" font-size="12" text-anchor="middle" font-weight="400" fill="#0f172a" font-family="Consolas, Menlo, Courier New, monospace">account.deposit(50)</text>
<rect x="260" y="62" width="218" height="256" rx="10" fill="#dbeafe" stroke="#475569" stroke-width="1.5"/>
<rect x="260" y="62" width="218" height="8" rx="4" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/>
<text x="369" y="100" font-size="17" text-anchor="middle" font-weight="700" fill="#0f766e">Abstraction</text>
<text x="369" y="122" font-size="13" text-anchor="middle" font-weight="400" fill="#64748b" font-style="italic">show what, hide how</text>
<text x="369" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">Expose a simple</text>
<text x="369" y="180" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">interface, keep the</text>
<text x="369" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">complex details</text>
<text x="369" y="224" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">hidden inside.</text>
<rect x="272" y="260" width="194" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="369" y="285" font-size="12" text-anchor="middle" font-weight="400" fill="#0f172a" font-family="Consolas, Menlo, Courier New, monospace">car.start()</text>
<rect x="496" y="62" width="218" height="256" rx="10" fill="#fef3c7" stroke="#475569" stroke-width="1.5"/>
<rect x="496" y="62" width="218" height="8" rx="4" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/>
<text x="605" y="100" font-size="17" text-anchor="middle" font-weight="700" fill="#0f766e">Inheritance</text>
<text x="605" y="122" font-size="13" text-anchor="middle" font-weight="400" fill="#64748b" font-style="italic">reuse a parent</text>
<text x="605" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">A child class gets the</text>
<text x="605" y="180" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">parent&#x27;s fields and</text>
<text x="605" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">methods (&quot;is a&quot;).</text>
<text x="605" y="224" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">It can override them.</text>
<rect x="508" y="260" width="194" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="605" y="285" font-size="12" text-anchor="middle" font-weight="400" fill="#0f172a" font-family="Consolas, Menlo, Courier New, monospace">class Dog extends Animal</text>
<rect x="732" y="62" width="218" height="256" rx="10" fill="#ede9fe" stroke="#475569" stroke-width="1.5"/>
<rect x="732" y="62" width="218" height="8" rx="4" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/>
<text x="841" y="100" font-size="17" text-anchor="middle" font-weight="700" fill="#0f766e">Polymorphism</text>
<text x="841" y="122" font-size="13" text-anchor="middle" font-weight="400" fill="#64748b" font-style="italic">one call, many forms</text>
<text x="841" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">Same method name,</text>
<text x="841" y="180" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">different behaviour</text>
<text x="841" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">depending on the</text>
<text x="841" y="224" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">object&#x27;s real type.</text>
<rect x="744" y="260" width="194" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="841" y="285" font-size="12" text-anchor="middle" font-weight="400" fill="#0f172a" font-family="Consolas, Menlo, Courier New, monospace">shape.area()</text>
</svg>
