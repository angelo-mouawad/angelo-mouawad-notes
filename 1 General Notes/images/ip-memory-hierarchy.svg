<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be123c"/></marker>
</defs>
<rect x="0" y="0" width="880" height="480" fill="#ffffff"/>
<text x="24" y="38" font-size="20" text-anchor="start" font-weight="700" fill="#0f766e">The Memory Hierarchy</text>
<text x="640" y="76" font-size="14" text-anchor="start" font-weight="700" fill="#0f766e">Access time</text>
<text x="780" y="76" font-size="14" text-anchor="start" font-weight="700" fill="#0f766e">Size</text>
<polygon points="322.0,70.0 338.0,70.0 392.6,140.0 267.4,140.0" fill="#0f766e" stroke="#475569" stroke-width="1.5"/>
<text x="330" y="124" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff">Registers</text>
<line x1="371.3" y1="105.0" x2="630" y2="105.0" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="6 5"/>
<text x="640" y="110.0" font-size="13" text-anchor="start" font-weight="400" fill="#0f172a">~0.3 ns</text>
<text x="780" y="110.0" font-size="13" text-anchor="start" font-weight="400" fill="#64748b">bytes</text>
<polygon points="267.4,140.0 392.6,140.0 447.2,210.0 212.8,210.0" fill="#5eead4" stroke="#475569" stroke-width="1.5"/>
<text x="330" y="180.0" font-size="14" text-anchor="middle" font-weight="700" fill="#0f172a">Cache (L1, L2, L3)</text>
<line x1="425.9" y1="175.0" x2="630" y2="175.0" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="6 5"/>
<text x="640" y="180.0" font-size="13" text-anchor="start" font-weight="400" fill="#0f172a">~1 to 40 ns</text>
<text x="780" y="180.0" font-size="13" text-anchor="start" font-weight="400" fill="#64748b">KB to MB</text>
<polygon points="212.8,210.0 447.2,210.0 501.8,280.0 158.2,280.0" fill="#a7f3d0" stroke="#475569" stroke-width="1.5"/>
<text x="330" y="250.0" font-size="14" text-anchor="middle" font-weight="700" fill="#0f172a">RAM (main memory)</text>
<line x1="480.5" y1="245.0" x2="630" y2="245.0" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="6 5"/>
<text x="640" y="250.0" font-size="13" text-anchor="start" font-weight="400" fill="#0f172a">~100 ns</text>
<text x="780" y="250.0" font-size="13" text-anchor="start" font-weight="400" fill="#64748b">GB</text>
<polygon points="158.2,280.0 501.8,280.0 556.4,350.0 103.6,350.0" fill="#d1fae5" stroke="#475569" stroke-width="1.5"/>
<text x="330" y="320.0" font-size="14" text-anchor="middle" font-weight="700" fill="#0f172a">Storage (SSD / HDD)</text>
<line x1="535.1" y1="315.0" x2="630" y2="315.0" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="6 5"/>
<text x="640" y="320.0" font-size="13" text-anchor="start" font-weight="400" fill="#0f172a">~0.1 to 5 ms</text>
<text x="780" y="320.0" font-size="13" text-anchor="start" font-weight="400" fill="#64748b">GB to TB</text>
<polygon points="103.6,350.0 556.4,350.0 611.0,420.0 49.0,420.0" fill="#f0fdf4" stroke="#475569" stroke-width="1.5"/>
<text x="330" y="390.0" font-size="14" text-anchor="middle" font-weight="700" fill="#0f172a">Network / Cloud</text>
<line x1="589.7" y1="385.0" x2="630" y2="385.0" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="6 5"/>
<text x="640" y="390.0" font-size="13" text-anchor="start" font-weight="400" fill="#0f172a">~10 to 100 ms</text>
<text x="780" y="390.0" font-size="13" text-anchor="start" font-weight="400" fill="#64748b">unlimited</text>
<line x1="34" y1="420" x2="34" y2="84" stroke="#0f766e" stroke-width="2.2" marker-end="url(#aht)"/>
<text x="24" y="260" font-size="13" text-anchor="middle" font-weight="600" fill="#0f766e" transform="rotate(-90 24 260)">faster, smaller, more expensive per GB</text>
<text x="440" y="455" font-size="13" text-anchor="middle" font-weight="400" fill="#64748b" font-style="italic">The CPU constantly moves data up this pyramid. Caching is the art of keeping hot data near the top.</text>
</svg>
