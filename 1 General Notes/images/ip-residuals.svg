<text x="269.6" y="234.5061198371146" font-size="12" text-anchor="end" font-weight="400" fill="#be123c" font-style="italic">residual</text>
<text x="546.4" y="98.05945317044791" font-size="12" text-anchor="end" font-weight="400" fill="#0f766e" font-style="italic">model prediction</text>
<rect x="588" y="70" width="238" height="300" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="602" y="96" font-size="12" text-anchor="start" font-weight="400" fill="#be123c" font-family="Consolas, Menlo, Courier New, monospace">residual = actual - predicted</text>
<text x="602" y="132" font-size="14" text-anchor="start" font-weight="700" fill="#0f766e">MAE</text>
<text x="658" y="132" font-size="12" text-anchor="start" font-weight="400" fill="#0f172a" font-family="Consolas, Menlo, Courier New, monospace">mean of |residual|</text>
<text x="658" y="152" font-size="12" text-anchor="start" font-weight="400" fill="#64748b">average miss, in units</text>
<text x="602" y="192" font-size="14" text-anchor="start" font-weight="700" fill="#0f766e">MSE</text>
<text x="658" y="192" font-size="12" text-anchor="start" font-weight="400" fill="#0f172a" font-family="Consolas, Menlo, Courier New, monospace">mean of residual²</text>
<text x="658" y="212" font-size="12" text-anchor="start" font-weight="400" fill="#64748b">punishes big misses</text>
<text x="602" y="252" font-size="14" text-anchor="start" font-weight="700" fill="#0f766e">RMSE</text>
<text x="658" y="252" font-size="12" text-anchor="start" font-weight="400" fill="#0f172a" font-family="Consolas, Menlo, Courier New, monospace">square root of MSE</text>
<text x="658" y="272" font-size="12" text-anchor="start" font-weight="400" fill="#64748b">back in target units</text>
<text x="602" y="312" font-size="14" text-anchor="start" font-weight="700" fill="#0f766e">R²</text>
<text x="658" y="312" font-size="12" text-anchor="start" font-weight="400" fill="#0f172a" font-family="Consolas, Menlo, Courier New, monospace">1 - SS_res / SS_tot</text>
<text x="658" y="332" font-size="12" text-anchor="start" font-weight="400" fill="#64748b">% of variance explained</text>
<text x="420" y="420" font-size="13" text-anchor="middle" font-weight="400" fill="#64748b" font-style="italic">A good model has small residuals with no visible pattern left in them.</text>
</svg>
