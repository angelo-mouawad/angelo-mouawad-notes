<text x="544" y="174" font-size="14" text-anchor="start" font-weight="700" fill="#0f766e">good model</text>
<text x="544" y="192" font-size="13" text-anchor="start" font-weight="400" fill="#64748b" font-family="Consolas, Menlo, Courier New, monospace">AUC ≈ 0.89</text>
<line x1="500" y1="223" x2="534" y2="223" stroke="#475569" stroke-width="3" stroke-dasharray="6 5"/>
<text x="544" y="228" font-size="14" text-anchor="start" font-weight="700" fill="#475569">random guessing</text>
<text x="544" y="246" font-size="13" text-anchor="start" font-weight="400" fill="#64748b" font-family="Consolas, Menlo, Courier New, monospace">AUC = 0.5</text>
<text x="500" y="300" font-size="13" text-anchor="start" font-weight="400" fill="#0f172a">Up and to the left is better.</text>
<text x="500" y="320" font-size="13" text-anchor="start" font-weight="400" fill="#64748b">AUC = chance the model ranks</text>
<text x="500" y="338" font-size="13" text-anchor="start" font-weight="400" fill="#64748b">a random positive above a</text>
<text x="500" y="356" font-size="13" text-anchor="start" font-weight="400" fill="#64748b">random negative.</text>
