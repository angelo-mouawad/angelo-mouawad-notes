<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 370" width="980" height="370" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be123c"/></marker>
</defs>
<rect x="0" y="0" width="980" height="370" fill="#ffffff"/>
<text x="24" y="38" font-size="20" text-anchor="start" font-weight="700" fill="#0f766e">What Happens When You Type a URL</text>
<rect x="24" y="72" width="212" height="96" rx="10" fill="#dbeafe" stroke="#475569" stroke-width="1.5"/>
<text x="130.0" y="103.25" font-size="15" text-anchor="middle" font-weight="700" fill="#0f172a">Browser cache</text>
<text x="130.0" y="125.25" font-size="14" text-anchor="middle" font-weight="400" fill="#0f172a">already knows the</text>
<text x="130.0" y="147.25" font-size="14" text-anchor="middle" font-weight="400" fill="#0f172a">page or the IP?</text>
<circle cx="28" cy="76" r="14" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/>
<text x="28" y="81" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff">1</text>
<line x1="236" y1="120" x2="262" y2="120" stroke="#475569" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="264" y="72" width="212" height="96" rx="10" fill="#dbeafe" stroke="#475569" stroke-width="1.5"/>
<text x="370.0" y="103.25" font-size="15" text-anchor="middle" font-weight="700" fill="#0f172a">DNS lookup</text>
<text x="370.0" y="125.25" font-size="14" text-anchor="middle" font-weight="400" fill="#0f172a">example.com</text>
<text x="370.0" y="147.25" font-size="14" text-anchor="middle" font-weight="400" fill="#0f172a">-&gt; an IP address</text>
<circle cx="268" cy="76" r="14" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/>
<text x="268" y="81" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff">2</text>
<line x1="476" y1="120" x2="502" y2="120" stroke="#475569" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="504" y="72" width="212" height="96" rx="10" fill="#fef3c7" stroke="#475569" stroke-width="1.5"/>
<text x="610.0" y="103.25" font-size="15" text-anchor="middle" font-weight="700" fill="#0f172a">TCP handshake</text>
<text x="610.0" y="125.25" font-size="14" text-anchor="middle" font-weight="400" fill="#0f172a">SYN, SYN-ACK, ACK</text>
<text x="610.0" y="147.25" font-size="14" text-anchor="middle" font-weight="400" fill="#0f172a">opens a connection</text>
<circle cx="508" cy="76" r="14" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/>
<text x="508" y="81" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff">3</text>
<line x1="716" y1="120" x2="742" y2="120" stroke="#475569" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="744" y="72" width="212" height="96" rx="10" fill="#fef3c7" stroke="#475569" stroke-width="1.5"/>
<text x="850.0" y="103.25" font-size="15" text-anchor="middle" font-weight="700" fill="#0f172a">TLS handshake</text>
<text x="850.0" y="125.25" font-size="14" text-anchor="middle" font-weight="400" fill="#0f172a">check certificate,</text>
<text x="850.0" y="147.25" font-size="14" text-anchor="middle" font-weight="400" fill="#0f172a">agree on a key</text>
<circle cx="748" cy="76" r="14" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/>
<text x="748" y="81" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff">4</text>
<rect x="744" y="222" width="212" height="96" rx="10" fill="#d1fae5" stroke="#475569" stroke-width="1.5"/>
<text x="850.0" y="253.25" font-size="15" text-anchor="middle" font-weight="700" fill="#0f172a">HTTP request</text>
<text x="850.0" y="275.25" font-size="14" text-anchor="middle" font-weight="400" fill="#0f172a">GET / with headers</text>
<text x="850.0" y="297.25" font-size="14" text-anchor="middle" font-weight="400" fill="#0f172a">and cookies</text>
<circle cx="748" cy="226" r="14" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/>
<text x="748" y="231" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff">5</text>
<line x1="744" y1="270" x2="718" y2="270" stroke="#475569" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="504" y="222" width="212" height="96" rx="10" fill="#ede9fe" stroke="#475569" stroke-width="1.5"/>
<text x="610.0" y="253.25" font-size="15" text-anchor="middle" font-weight="700" fill="#0f172a">Server side</text>
<text x="610.0" y="275.25" font-size="14" text-anchor="middle" font-weight="400" fill="#0f172a">load balancer -&gt; app</text>
<text x="610.0" y="297.25" font-size="14" text-anchor="middle" font-weight="400" fill="#0f172a">-&gt; database</text>
<circle cx="508" cy="226" r="14" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/>
<text x="508" y="231" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff">6</text>
<line x1="504" y1="270" x2="478" y2="270" stroke="#475569" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="264" y="222" width="212" height="96" rx="10" fill="#d1fae5" stroke="#475569" stroke-width="1.5"/>
<text x="370.0" y="253.25" font-size="15" text-anchor="middle" font-weight="700" fill="#0f172a">HTTP response</text>
<text x="370.0" y="275.25" font-size="14" text-anchor="middle" font-weight="400" fill="#0f172a">200 OK</text>
<text x="370.0" y="297.25" font-size="14" text-anchor="middle" font-weight="400" fill="#0f172a">+ HTML body</text>
<circle cx="268" cy="226" r="14" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/>
<text x="268" y="231" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff">7</text>
<line x1="264" y1="270" x2="238" y2="270" stroke="#475569" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="24" y="222" width="212" height="96" rx="10" fill="#ffe4e6" stroke="#475569" stroke-width="1.5"/>
<text x="130.0" y="253.25" font-size="15" text-anchor="middle" font-weight="700" fill="#0f172a">Render</text>
<text x="130.0" y="275.25" font-size="14" text-anchor="middle" font-weight="400" fill="#0f172a">parse HTML, load CSS</text>
<text x="130.0" y="297.25" font-size="14" text-anchor="middle" font-weight="400" fill="#0f172a">and JS, paint pixels</text>
<circle cx="28" cy="226" r="14" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/>
<text x="28" y="231" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff">8</text>
<line x1="850" y1="168" x2="850" y2="220" stroke="#475569" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="490" y="350" font-size="13" text-anchor="middle" font-weight="400" fill="#64748b" font-style="italic">Steps 2 to 4 are skipped when the IP is already cached and an open connection can be reused.</text>
</svg>
