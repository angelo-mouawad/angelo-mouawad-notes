<rect x="0" y="0" width="980" height="440" fill="#ffffff"/>
<text x="24" y="38" font-size="20" text-anchor="start" font-weight="700" fill="#0f766e">A Typical Scalable Web Architecture</text>
<rect x="24" y="186" width="140" height="76" rx="10" fill="#dbeafe" stroke="#475569" stroke-width="1.5"/>
<text x="94.0" y="219.1" font-size="14" text-anchor="middle" font-weight="700" fill="#0f172a">Clients</text>
<text x="94.0" y="238.7" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">browser, mobile</text>
<rect x="210" y="62" width="160" height="64" rx="10" fill="#ede9fe" stroke="#475569" stroke-width="1.5"/>
<text x="290.0" y="89.10000000000001" font-size="14" text-anchor="middle" font-weight="700" fill="#0f172a">CDN</text>
<text x="290.0" y="108.7" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">static files, images</text>
<rect x="210" y="186" width="160" height="76" rx="10" fill="#fef3c7" stroke="#475569" stroke-width="1.5"/>
<text x="290.0" y="219.1" font-size="14" text-anchor="middle" font-weight="700" fill="#0f172a">Load balancer</text>
<text x="290.0" y="238.7" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">spreads traffic</text>
<rect x="420" y="96" width="160" height="64" rx="10" fill="#d1fae5" stroke="#475569" stroke-width="1.5"/>
<text x="500.0" y="123.10000000000001" font-size="14" text-anchor="middle" font-weight="700" fill="#0f172a">App server 1</text>
<text x="500.0" y="142.70000000000002" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">stateless</text>
<line x1="370" y1="224" x2="418" y2="128" stroke="#475569" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="580" y1="128" x2="612" y2="128" stroke="#475569" stroke-width="1.5"/>
<rect x="420" y="188" width="160" height="64" rx="10" fill="#d1fae5" stroke="#475569" stroke-width="1.5"/>
<text x="500.0" y="215.1" font-size="14" text-anchor="middle" font-weight="700" fill="#0f172a">App server 2</text>
<text x="500.0" y="234.7" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">stateless</text>
<line x1="370" y1="224" x2="418" y2="220" stroke="#475569" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="580" y1="220" x2="612" y2="220" stroke="#475569" stroke-width="1.5"/>
<rect x="420" y="280" width="160" height="64" rx="10" fill="#d1fae5" stroke="#475569" stroke-width="1.5"/>
<text x="500.0" y="307.09999999999997" font-size="14" text-anchor="middle" font-weight="700" fill="#0f172a">App server 3</text>
<text x="500.0" y="326.7" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">stateless</text>
<line x1="370" y1="224" x2="418" y2="312" stroke="#475569" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="580" y1="312" x2="612" y2="312" stroke="#475569" stroke-width="1.5"/>
<line x1="612" y1="128" x2="612" y2="312" stroke="#475569" stroke-width="1.5"/>
<rect x="652" y="96" width="160" height="70" rx="10" fill="#ffe4e6" stroke="#475569" stroke-width="1.5"/>
<text x="732.0" y="126.10000000000001" font-size="14" text-anchor="middle" font-weight="700" fill="#0f172a">Cache (Redis)</text>
<text x="732.0" y="145.70000000000002" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">hot data in RAM</text>
<rect x="652" y="262" width="160" height="70" rx="10" fill="#fef3c7" stroke="#475569" stroke-width="1.5"/>
<text x="732.0" y="292.09999999999997" font-size="14" text-anchor="middle" font-weight="700" fill="#0f172a">Database</text>
<text x="732.0" y="311.7" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">primary: writes</text>
<rect x="846" y="262" width="112" height="70" rx="10" fill="#fef3c7" stroke="#475569" stroke-width="1.5"/>
<text x="902.0" y="292.09999999999997" font-size="14" text-anchor="middle" font-weight="700" fill="#0f172a">Replica</text>
<text x="902.0" y="311.7" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">reads</text>
<line x1="612" y1="131" x2="650" y2="131" stroke="#475569" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="612" y1="297" x2="650" y2="297" stroke="#475569" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="812" y1="297" x2="844" y2="297" stroke="#475569" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="828" y="352" font-size="12" text-anchor="middle" font-weight="400" fill="#64748b">replication</text>
<line x1="164" y1="224" x2="208" y2="224" stroke="#475569" stroke-width="1.8" marker-end="url(#ah)"/>
<path d="M94,186 C94,120 150,94 208,94" stroke="#475569" fill="none" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="490" y="392" font-size="13" text-anchor="middle" font-weight="400" fill="#64748b" font-style="italic">Vertical scaling = a bigger machine. Horizontal scaling = more machines behind a load balancer.</text>
<text x="490" y="414" font-size="13" text-anchor="middle" font-weight="400" fill="#64748b" font-style="italic">Stateless app servers are what make horizontal scaling easy: any server can answer any request.</text>
</svg>
