<text x="814.0" y="264.55" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">Libs / deps</text>
<text x="676" y="130" font-size="13" text-anchor="middle" font-weight="400" fill="#64748b" font-style="italic">no guest OS: containers share</text>
<text x="676" y="150" font-size="13" text-anchor="middle" font-weight="400" fill="#64748b" font-style="italic">the host kernel, so they are</text>
<text x="676" y="170" font-size="13" text-anchor="middle" font-weight="400" fill="#64748b" font-style="italic">MBs in size and start in seconds</text>
<text x="450" y="450" font-size="13" text-anchor="middle" font-weight="400" fill="#64748b" font-style="italic">VMs isolate whole machines. Containers isolate processes. Both make &quot;works on my machine&quot; go away.</text>
