<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" width="840" height="420" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be123c"/></marker>
</defs>
<rect x="0" y="0" width="840" height="420" fill="#ffffff"/>
<text x="24" y="38" font-size="20" text-anchor="start" font-weight="700" fill="#0f766e">The Testing Pyramid</text>
<polygon points="334.0,70.0 346.0,70.0 428.0,170.0 252.0,170.0" fill="#ffe4e6" stroke="#475569" stroke-width="1.5"/>
<text x="340" y="138.0" font-size="15" text-anchor="middle" font-weight="700" fill="#0f172a">E2E / UI tests</text>
<text x="340" y="158.0" font-size="13" text-anchor="middle" font-weight="400" fill="#64748b" font-style="italic">few</text>
<line x1="393.0" y1="120.0" x2="616" y2="120.0" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="6 5"/>
<text x="626" y="106.0" font-size="13" text-anchor="start" font-weight="400" fill="#0f172a">Full user flows in</text>
<text x="626" y="125.0" font-size="13" text-anchor="start" font-weight="400" fill="#0f172a">a real browser.</text>
<text x="626" y="144.0" font-size="13" text-anchor="start" font-weight="400" fill="#0f172a">Slow and brittle.</text>
<polygon points="252.0,170.0 428.0,170.0 510.0,270.0 170.0,270.0" fill="#fef3c7" stroke="#475569" stroke-width="1.5"/>
<text x="340" y="220.0" font-size="15" text-anchor="middle" font-weight="700" fill="#0f172a">Integration tests</text>
<text x="340" y="240.0" font-size="13" text-anchor="middle" font-weight="400" fill="#64748b" font-style="italic">some</text>
<line x1="475.0" y1="220.0" x2="616" y2="220.0" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="6 5"/>
<text x="626" y="206.0" font-size="13" text-anchor="start" font-weight="400" fill="#0f172a">Parts working together,</text>
<text x="626" y="225.0" font-size="13" text-anchor="start" font-weight="400" fill="#0f172a">e.g. API + database.</text>
<text x="626" y="244.0" font-size="13" text-anchor="start" font-weight="400" fill="#0f172a">Medium speed.</text>
<polygon points="170.0,270.0 510.0,270.0 600.2,380.0 79.8,380.0" fill="#d1fae5" stroke="#475569" stroke-width="1.5"/>
<text x="340" y="325.0" font-size="15" text-anchor="middle" font-weight="700" fill="#0f172a">Unit tests</text>
<text x="340" y="345.0" font-size="13" text-anchor="middle" font-weight="400" fill="#64748b" font-style="italic">many</text>
<line x1="561.1" y1="325.0" x2="616" y2="325.0" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="6 5"/>
<text x="626" y="311.0" font-size="13" text-anchor="start" font-weight="400" fill="#0f172a">One function or class</text>
<text x="626" y="330.0" font-size="13" text-anchor="start" font-weight="400" fill="#0f172a">in isolation.</text>
<text x="626" y="349.0" font-size="13" text-anchor="start" font-weight="400" fill="#0f172a">Fast, cheap, run often.</text>
<line x1="34" y1="380" x2="34" y2="84" stroke="#0f766e" stroke-width="2.2" marker-end="url(#aht)"/>
<text x="24" y="232" font-size="13" text-anchor="middle" font-weight="600" fill="#0f766e" transform="rotate(-90 24 232)">slower, costlier, more realistic</text>
<text x="420" y="405" font-size="13" text-anchor="middle" font-weight="400" fill="#64748b" font-style="italic">Lots of fast unit tests at the base, a few slow end to end tests on top.</text>
</svg>
