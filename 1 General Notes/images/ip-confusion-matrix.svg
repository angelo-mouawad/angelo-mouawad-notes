<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be123c"/></marker>
</defs>
<rect x="0" y="0" width="900" height="450" fill="#ffffff"/>
<text x="24" y="38" font-size="20" text-anchor="start" font-weight="700" fill="#0f766e">Confusion Matrix (spam filter, 1,000 emails)</text>
<text x="290.0" y="98" font-size="14" text-anchor="middle" font-weight="700" fill="#0f172a">Predicted: spam</text>
<text x="470.0" y="98" font-size="14" text-anchor="middle" font-weight="700" fill="#0f172a">Predicted: not spam</text>
<text x="186" y="177.0" font-size="14" text-anchor="end" font-weight="700" fill="#0f172a">Actual: spam</text>
<text x="186" y="297.0" font-size="14" text-anchor="end" font-weight="700" fill="#0f172a">Actual: not spam</text>
<rect x="200" y="112" width="180" height="120" rx="0" fill="#d1fae5" stroke="#475569" stroke-width="2"/>
<text x="290.0" y="156" font-size="20" text-anchor="middle" font-weight="700" fill="#0f766e" font-family="Consolas, Menlo, Courier New, monospace">TP = 80</text>
<text x="290.0" y="182" font-size="13" text-anchor="middle" font-weight="600" fill="#0f172a">True Positive</text>
<text x="290.0" y="204" font-size="12" text-anchor="middle" font-weight="400" fill="#64748b">spam caught</text>
<rect x="380" y="112" width="180" height="120" rx="0" fill="#ffe4e6" stroke="#475569" stroke-width="2"/>
<text x="470.0" y="156" font-size="20" text-anchor="middle" font-weight="700" fill="#be123c" font-family="Consolas, Menlo, Courier New, monospace">FN = 20</text>
<text x="470.0" y="182" font-size="13" text-anchor="middle" font-weight="600" fill="#0f172a">False Negative</text>
<text x="470.0" y="204" font-size="12" text-anchor="middle" font-weight="400" fill="#64748b">spam slipped through</text>
<rect x="200" y="232" width="180" height="120" rx="0" fill="#ffe4e6" stroke="#475569" stroke-width="2"/>
<text x="290.0" y="276" font-size="20" text-anchor="middle" font-weight="700" fill="#be123c" font-family="Consolas, Menlo, Courier New, monospace">FP = 10</text>
<text x="290.0" y="302" font-size="13" text-anchor="middle" font-weight="600" fill="#0f172a">False Positive</text>
<text x="290.0" y="324" font-size="12" text-anchor="middle" font-weight="400" fill="#64748b">real email blocked</text>
<rect x="380" y="232" width="180" height="120" rx="0" fill="#d1fae5" stroke="#475569" stroke-width="2"/>
<text x="470.0" y="276" font-size="20" text-anchor="middle" font-weight="700" fill="#0f766e" font-family="Consolas, Menlo, Courier New, monospace">TN = 890</text>
<text x="470.0" y="302" font-size="13" text-anchor="middle" font-weight="600" fill="#0f172a">True Negative</text>
<text x="470.0" y="324" font-size="12" text-anchor="middle" font-weight="400" fill="#64748b">real email delivered</text>
<text x="470.0" y="224" font-size="11" text-anchor="middle" font-weight="400" fill="#be123c" font-style="italic">Type II error</text>
<text x="290.0" y="344" font-size="11" text-anchor="middle" font-weight="400" fill="#be123c" font-style="italic">Type I error</text>
<rect x="600" y="70" width="276" height="312" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="616" y="100" font-size="14" text-anchor="start" font-weight="700" fill="#0f766e">Accuracy</text>
<text x="616" y="122" font-size="13" text-anchor="start" font-weight="400" fill="#0f172a" font-family="Consolas, Menlo, Courier New, monospace">(TP+TN) / all</text>
<text x="860" y="122" font-size="13" text-anchor="end" font-weight="400" fill="#64748b" font-family="Consolas, Menlo, Courier New, monospace">970/1000 = 97%</text>
<text x="616" y="158" font-size="14" text-anchor="start" font-weight="700" fill="#0f766e">Precision</text>
<text x="616" y="180" font-size="13" text-anchor="start" font-weight="400" fill="#0f172a" font-family="Consolas, Menlo, Courier New, monospace">TP / (TP+FP)</text>
<text x="860" y="180" font-size="13" text-anchor="end" font-weight="400" fill="#64748b" font-family="Consolas, Menlo, Courier New, monospace">80 / 90 = 89%</text>
<text x="616" y="216" font-size="14" text-anchor="start" font-weight="700" fill="#0f766e">Recall</text>
<text x="616" y="238" font-size="13" text-anchor="start" font-weight="400" fill="#0f172a" font-family="Consolas, Menlo, Courier New, monospace">TP / (TP+FN)</text>
<text x="860" y="238" font-size="13" text-anchor="end" font-weight="400" fill="#64748b" font-family="Consolas, Menlo, Courier New, monospace">80 / 100 = 80%</text>
<text x="616" y="274" font-size="14" text-anchor="start" font-weight="700" fill="#0f766e">F1 score</text>
<text x="616" y="296" font-size="13" text-anchor="start" font-weight="400" fill="#0f172a" font-family="Consolas, Menlo, Courier New, monospace">2PR / (P+R)</text>
<text x="860" y="296" font-size="13" text-anchor="end" font-weight="400" fill="#64748b" font-family="Consolas, Menlo, Courier New, monospace">= 0.84</text>
<text x="616" y="332" font-size="14" text-anchor="start" font-weight="700" fill="#0f766e">Specificity</text>
<text x="616" y="354" font-size="13" text-anchor="start" font-weight="400" fill="#0f172a" font-family="Consolas, Menlo, Courier New, monospace">TN / (TN+FP)</text>
<text x="860" y="354" font-size="13" text-anchor="end" font-weight="400" fill="#64748b" font-family="Consolas, Menlo, Courier New, monospace">890 / 900 = 99%</text>
<text x="450" y="412" font-size="13" text-anchor="middle" font-weight="400" fill="#64748b" font-style="italic">Diagonal = correct predictions. Off diagonal = mistakes.</text>
<text x="450" y="432" font-size="13" text-anchor="middle" font-weight="400" fill="#64748b" font-style="italic">Which mistake is worse depends on the problem, and that decides which metric you optimise.</text>
</svg>
