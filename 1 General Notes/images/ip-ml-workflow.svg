<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 310" width="980" height="310" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be123c"/></marker>
</defs>
<rect x="0" y="0" width="980" height="310" fill="#ffffff"/>
<text x="24" y="38" font-size="20" text-anchor="start" font-weight="700" fill="#0f766e">The Data Science and ML Workflow</text>
<rect x="24" y="70" width="120" height="92" rx="10" fill="#dbeafe" stroke="#475569" stroke-width="1.5"/>
<text x="84.0" y="100.9" font-size="14" text-anchor="middle" font-weight="700" fill="#0f172a">1. Question</text>
<text x="84.0" y="120.9" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">define the goal</text>
<text x="84.0" y="140.9" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">and the metric</text>
<line x1="144" y1="116" x2="157" y2="116" stroke="#475569" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="159" y="70" width="120" height="92" rx="10" fill="#dbeafe" stroke="#475569" stroke-width="1.5"/>
<text x="219.0" y="100.9" font-size="14" text-anchor="middle" font-weight="700" fill="#0f172a">2. Collect</text>
<text x="219.0" y="120.9" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">gather raw</text>
<text x="219.0" y="140.9" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">data</text>
<line x1="279" y1="116" x2="292" y2="116" stroke="#475569" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="294" y="70" width="120" height="92" rx="10" fill="#fef3c7" stroke="#475569" stroke-width="1.5"/>
<text x="354.0" y="100.9" font-size="14" text-anchor="middle" font-weight="700" fill="#0f172a">3. Clean</text>
<text x="354.0" y="120.9" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">fix problems,</text>
<text x="354.0" y="140.9" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">explore (EDA)</text>
<line x1="414" y1="116" x2="427" y2="116" stroke="#475569" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="429" y="70" width="120" height="92" rx="10" fill="#fef3c7" stroke="#475569" stroke-width="1.5"/>
<text x="489.0" y="100.9" font-size="14" text-anchor="middle" font-weight="700" fill="#0f172a">4. Features</text>
<text x="489.0" y="120.9" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">engineer</text>
<text x="489.0" y="140.9" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">and scale</text>
<line x1="549" y1="116" x2="562" y2="116" stroke="#475569" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="564" y="70" width="120" height="92" rx="10" fill="#d1fae5" stroke="#475569" stroke-width="1.5"/>
<text x="624.0" y="100.9" font-size="14" text-anchor="middle" font-weight="700" fill="#0f172a">5. Train</text>
<text x="624.0" y="120.9" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">fit several</text>
<text x="624.0" y="140.9" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">models</text>
<line x1="684" y1="116" x2="697" y2="116" stroke="#475569" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="699" y="70" width="120" height="92" rx="10" fill="#d1fae5" stroke="#475569" stroke-width="1.5"/>
<text x="759.0" y="100.9" font-size="14" text-anchor="middle" font-weight="700" fill="#0f172a">6. Evaluate</text>
<text x="759.0" y="120.9" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">metrics on</text>
<text x="759.0" y="140.9" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">the test set</text>
<line x1="819" y1="116" x2="832" y2="116" stroke="#475569" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="834" y="70" width="120" height="92" rx="10" fill="#ede9fe" stroke="#475569" stroke-width="1.5"/>
<text x="894.0" y="100.9" font-size="14" text-anchor="middle" font-weight="700" fill="#0f172a">7. Deploy</text>
<text x="894.0" y="120.9" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">serve and</text>
<text x="894.0" y="140.9" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">monitor</text>
<path d="M754,162 C754,198 484,198 484,166" stroke="#0f766e" fill="none" stroke-width="2" marker-end="url(#aht)"/>
<text x="619" y="214" font-size="13" text-anchor="middle" font-weight="600" fill="#0f766e">not good enough? go back and iterate</text>
<path d="M889,162 C889,292 214,292 214,166" stroke="#be123c" fill="none" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ahr)"/>
<text x="552" y="294" font-size="13" text-anchor="middle" font-weight="600" fill="#be123c">new data or data drift in production: collect again and retrain</text>
</svg>
