<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be123c"/></marker>
</defs>
<rect x="0" y="0" width="900" height="480" fill="#ffffff"/>
<text x="24" y="38" font-size="20" text-anchor="start" font-weight="700" fill="#0f766e">OSI Model vs TCP/IP Model</text>
<text x="139" y="72" font-size="13" text-anchor="middle" font-weight="700" fill="#0f766e">OSI (7 layers, theory)</text>
<text x="405" y="72" font-size="13" text-anchor="middle" font-weight="700" fill="#0f766e">TCP/IP (4 layers, real)</text>
<text x="716" y="72" font-size="13" text-anchor="middle" font-weight="700" fill="#0f766e">Examples and data unit</text>
<rect x="24" y="84" width="230" height="46" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
<text x="44" y="113" font-size="14" text-anchor="start" font-weight="400" fill="#0f172a">7  Application</text>
<rect x="24" y="134" width="230" height="46" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
<text x="44" y="163" font-size="14" text-anchor="start" font-weight="400" fill="#0f172a">6  Presentation</text>
<rect x="24" y="184" width="230" height="46" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
<text x="44" y="213" font-size="14" text-anchor="start" font-weight="400" fill="#0f172a">5  Session</text>
<rect x="24" y="234" width="230" height="46" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
<text x="44" y="263" font-size="14" text-anchor="start" font-weight="400" fill="#0f172a">4  Transport</text>
<rect x="24" y="284" width="230" height="46" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
<text x="44" y="313" font-size="14" text-anchor="start" font-weight="400" fill="#0f172a">3  Network</text>
<rect x="24" y="334" width="230" height="46" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
<text x="44" y="363" font-size="14" text-anchor="start" font-weight="400" fill="#0f172a">2  Data Link</text>
<rect x="24" y="384" width="230" height="46" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
<text x="44" y="413" font-size="14" text-anchor="start" font-weight="400" fill="#0f172a">1  Physical</text>
<rect x="290" y="84" width="230" height="146" rx="10" fill="#d1fae5" stroke="#475569" stroke-width="1.5"/>
<text x="405.0" y="162.25" font-size="15" text-anchor="middle" font-weight="700" fill="#0f172a">Application</text>
<rect x="556" y="84" width="320" height="146" rx="6" fill="#d1fae5" stroke="#475569" stroke-width="1" fill-opacity="0.5"/>
<text x="572" y="144.0" font-size="13" text-anchor="start" font-weight="400" fill="#0f172a">HTTP, HTTPS, DNS, SSH, SMTP</text>
<text x="572" y="162.0" font-size="13" text-anchor="start" font-weight="400" fill="#0f172a">TLS encryption lives here too</text>
<text x="572" y="180.0" font-size="12" text-anchor="start" font-weight="400" fill="#64748b" font-style="italic">unit: data / message</text>
<rect x="290" y="234" width="230" height="46" rx="10" fill="#dbeafe" stroke="#475569" stroke-width="1.5"/>
<text x="405.0" y="262.25" font-size="15" text-anchor="middle" font-weight="700" fill="#0f172a">Transport</text>
<rect x="556" y="234" width="320" height="46" rx="6" fill="#dbeafe" stroke="#475569" stroke-width="1" fill-opacity="0.5"/>
<text x="572" y="253.0" font-size="13" text-anchor="start" font-weight="400" fill="#0f172a">TCP (reliable), UDP (fast)</text>
<text x="572" y="271.0" font-size="12" text-anchor="start" font-weight="400" fill="#64748b" font-style="italic">unit: segment / datagram</text>
<rect x="290" y="284" width="230" height="46" rx="10" fill="#fef3c7" stroke="#475569" stroke-width="1.5"/>
<text x="405.0" y="312.25" font-size="15" text-anchor="middle" font-weight="700" fill="#0f172a">Internet</text>
<rect x="556" y="284" width="320" height="46" rx="6" fill="#fef3c7" stroke="#475569" stroke-width="1" fill-opacity="0.5"/>
<text x="572" y="303.0" font-size="13" text-anchor="start" font-weight="400" fill="#0f172a">IP addresses, routing, ICMP</text>
<text x="572" y="321.0" font-size="12" text-anchor="start" font-weight="400" fill="#64748b" font-style="italic">unit: packet</text>
<rect x="290" y="334" width="230" height="96" rx="10" fill="#ede9fe" stroke="#475569" stroke-width="1.5"/>
<text x="405.0" y="387.25" font-size="15" text-anchor="middle" font-weight="700" fill="#0f172a">Link</text>
<rect x="556" y="334" width="320" height="96" rx="6" fill="#ede9fe" stroke="#475569" stroke-width="1" fill-opacity="0.5"/>
<text x="572" y="369.0" font-size="13" text-anchor="start" font-weight="400" fill="#0f172a">Ethernet, Wi-Fi, MAC addresses,</text>
<text x="572" y="387.0" font-size="13" text-anchor="start" font-weight="400" fill="#0f172a">cables and radio signals</text>
<text x="572" y="405.0" font-size="12" text-anchor="start" font-weight="400" fill="#64748b" font-style="italic">unit: frame / bits</text>
<text x="450" y="460" font-size="13" text-anchor="middle" font-weight="400" fill="#64748b" font-style="italic">Mnemonic from layer 7 down: All People Seem To Need Data Processing</text>
</svg>
