<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="860" height="330" fill="#ffffff"/>
<text x="430" y="34" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">Data goes down, events come back up</text>
<rect x="320" y="66" width="220" height="70" rx="6" fill="#fde68a" stroke="#334155" stroke-width="2"/>
<text x="430.0" y="98.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#1f2933" text-anchor="middle" font-weight="normal">Parent</text>
<text x="430.0" y="117.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">owns the data</text>
<rect x="320" y="234" width="220" height="70" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="430.0" y="266.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#1f2933" text-anchor="middle" font-weight="normal">Child</text>
<text x="430.0" y="285.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">displays it</text>
<path d="M 380,138 L 380,228" fill="none" stroke="#0f766e" stroke-width="2.5"/>
<polygon points="375.0,218.0 385.0,218.0 380,228" fill="#0f766e"/>
<text x="268" y="186" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#0f766e" text-anchor="middle" font-weight="bold">props</text>
<text x="268" y="204" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">text={message}</text>
<path d="M 482,232 L 482,142" fill="none" stroke="#1d4ed8" stroke-width="2.5"/>
<polygon points="477.0,152.0 487.0,152.0 482,142" fill="#1d4ed8"/>
<text x="596" y="186" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1d4ed8" text-anchor="middle" font-weight="bold">callback</text>
<text x="596" y="204" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">onClick={handleClick}</text>
<text x="430" y="322" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">the child never changes the data itself, it asks the parent to</text>
</svg>
