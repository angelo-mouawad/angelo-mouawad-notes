<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="860" height="330" fill="#ffffff"/>
<text x="430" y="34" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">em looks at its parent, rem looks at the root</text>
<rect x="50" y="58" width="360" height="230" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<text x="230" y="84" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" fill="#1d4ed8" text-anchor="middle" font-weight="bold">em</text>
<rect x="76" y="96" width="308" height="176" rx="6" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
<text x="230" y="118" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">html  16px</text>
<rect x="100" y="130" width="260" height="130" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="230" y="152" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">section  font-size: 2em  = 32px</text>
<rect x="124" y="164" width="212" height="84" rx="6" fill="#fde68a" stroke="#334155" stroke-width="2"/>
<text x="230" y="190" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">p  font-size: 2em</text>
<text x="230" y="212" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" fill="#b91c1c" text-anchor="middle" font-weight="bold">= 64px</text>
<text x="230" y="234" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="normal">it compounds</text>
<rect x="450" y="58" width="360" height="230" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<text x="630" y="84" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" fill="#0f766e" text-anchor="middle" font-weight="bold">rem</text>
<rect x="476" y="96" width="308" height="176" rx="6" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
<text x="630" y="118" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">html  16px</text>
<rect x="500" y="130" width="260" height="130" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="630" y="152" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">section  font-size: 2rem  = 32px</text>
<rect x="524" y="164" width="212" height="84" rx="6" fill="#fde68a" stroke="#334155" stroke-width="2"/>
<text x="630" y="190" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">p  font-size: 2rem</text>
<text x="630" y="212" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" fill="#0f766e" text-anchor="middle" font-weight="bold">= 32px</text>
<text x="630" y="234" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#0f766e" text-anchor="middle" font-weight="normal">always the root</text>
<text x="430" y="314" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">use rem for font sizes, em for padding and margin that should scale with the text</text>
</svg>
