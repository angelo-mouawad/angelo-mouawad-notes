<text x="478" y="150" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#b91c1c" text-anchor="start" font-weight="normal">&lt;input id="name" type="text"&gt;</text>
<line x1="414" y1="210" x2="470" y2="210" stroke="#b91c1c" stroke-width="1.5"/>
<circle cx="414" cy="210" r="4" fill="#b91c1c" stroke="#b91c1c" stroke-width="0"/>
<text x="478" y="214" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#b91c1c" text-anchor="start" font-weight="normal">type="email"</text>
<line x1="414" y1="274" x2="470" y2="274" stroke="#b91c1c" stroke-width="1.5"/>
<circle cx="414" cy="274" r="4" fill="#b91c1c" stroke="#b91c1c" stroke-width="0"/>
<text x="478" y="278" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#b91c1c" text-anchor="start" font-weight="normal">type="number"&gt;</text>
<line x1="414" y1="356" x2="470" y2="356" stroke="#b91c1c" stroke-width="1.5"/>
