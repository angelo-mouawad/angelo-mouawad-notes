<text x="478" y="406" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#b91c1c" text-anchor="start" font-weight="normal">&lt;input type="submit"&gt;</text>
<text x="440" y="456" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">the for of the label must match the id of the input, that is what links them</text>
