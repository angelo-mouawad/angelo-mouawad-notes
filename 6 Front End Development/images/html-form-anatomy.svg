<text x="88" y="246" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">Age:</text>
<rect x="88" y="256" width="320" height="34" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<text x="88" y="320" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">Reason:</text>
