<polygon points="384.5,346.0 391.5,346.0 388,353" fill="#1f2933"/>
<rect x="88" y="384" width="130" height="36" rx="6" fill="#0f766e" stroke="#0f766e" stroke-width="2"/>
<text x="153.0" y="407.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="normal">Submit</text>
<line x1="414" y1="118" x2="470" y2="118" stroke="#b91c1c" stroke-width="1.5"/>
<circle cx="414" cy="118" r="4" fill="#b91c1c" stroke="#b91c1c" stroke-width="0"/>
<text x="478" y="122" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#b91c1c" text-anchor="start" font-weight="normal">&lt;label for="name"&gt;</text>
