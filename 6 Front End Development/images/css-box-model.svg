<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="860" height="400" fill="#ffffff"/>
<text x="430" y="34" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">Every element is four boxes inside each other</text>
<rect x="60" y="60" width="460" height="310" rx="6" fill="#fee2e2" stroke="#334155" stroke-width="2"/>
<text x="290" y="82" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#b91c1c" text-anchor="middle" font-weight="bold">margin</text>
<rect x="110" y="96" width="360" height="240" rx="6" fill="#fde68a" stroke="#334155" stroke-width="2"/>
<text x="290" y="118" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#92400e" text-anchor="middle" font-weight="bold">border</text>
<rect x="160" y="132" width="260" height="170" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="290" y="154" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#0f766e" text-anchor="middle" font-weight="bold">padding</text>
<rect x="200" y="168" width="180" height="100" rx="6" fill="#bfdbfe" stroke="#334155" stroke-width="2"/>
<text x="290" y="224" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1d4ed8" text-anchor="middle" font-weight="bold">content</text>
<rect x="560" y="100" width="270" height="54" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<text x="578" y="124" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1d4ed8" text-anchor="start" font-weight="bold">content</text>
<text x="578" y="144" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#1f2933" text-anchor="start" font-weight="normal">width and height</text>
<rect x="560" y="170" width="270" height="54" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<text x="578" y="194" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#0f766e" text-anchor="start" font-weight="bold">padding</text>
<text x="578" y="214" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#1f2933" text-anchor="start" font-weight="normal">padding: top right bottom left;</text>
<rect x="560" y="240" width="270" height="54" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<text x="578" y="264" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#92400e" text-anchor="start" font-weight="bold">border</text>
<text x="578" y="284" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#1f2933" text-anchor="start" font-weight="normal">border: 2px solid color;</text>
<rect x="560" y="310" width="270" height="54" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<text x="578" y="334" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#b91c1c" text-anchor="start" font-weight="bold">margin</text>
<text x="578" y="354" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#1f2933" text-anchor="start" font-weight="normal">margin: 0px;  margin: auto centers</text>
<text x="430" y="388" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">padding is inside the border, margin is outside it</text>
