<text x="795.0" y="126.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">browser or Node</text>
<rect x="140" y="178" width="600" height="76" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<text x="440" y="206" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">the types are checked, then thrown away</text>
<text x="440" y="232" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">a type error stops you at compile time, which is the entire point</text>
