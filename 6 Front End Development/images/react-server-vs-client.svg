<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="880" height="400" fill="#ffffff"/>
<text x="440" y="34" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">Where the component actually runs</text>
<rect x="40" y="58" width="390" height="300" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<text x="235" y="86" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#0f766e" text-anchor="middle" font-weight="bold">Server component</text>
<text x="235" y="108" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">the default, no annotation</text>
<circle cx="70" cy="142" r="5" fill="#0f766e" stroke="#0f766e" stroke-width="0"/>
<text x="88" y="147" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">renders to HTML before it is sent</text>
<circle cx="70" cy="176" r="5" fill="#0f766e" stroke="#0f766e" stroke-width="0"/>
<text x="88" y="181" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">can fetch straight from a database or API</text>
<circle cx="70" cy="210" r="5" fill="#0f766e" stroke="#0f766e" stroke-width="0"/>
<text x="88" y="215" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">keeps secrets off the browser</text>
<circle cx="70" cy="244" r="5" fill="#0f766e" stroke="#0f766e" stroke-width="0"/>
<text x="88" y="249" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">adds nothing to the bundle the user downloads</text>
<circle cx="70" cy="278" r="5" fill="#0f766e" stroke="#0f766e" stroke-width="0"/>
<text x="88" y="283" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">cannot use useState or useEffect</text>
<rect x="64" y="306" width="340" height="36" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="234" y="330" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="bold">if it just fetches and displays, use this</text>
<rect x="450" y="58" width="390" height="300" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<text x="645" y="86" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1d4ed8" text-anchor="middle" font-weight="bold">Client component</text>
<text x="645" y="108" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">"use client" at the top of the file</text>
<circle cx="480" cy="142" r="5" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="0"/>
<text x="498" y="147" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">runs in the browser</text>
<circle cx="480" cy="176" r="5" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="0"/>
<text x="498" y="181" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">can use hooks, useState and useEffect</text>
<circle cx="480" cy="210" r="5" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="0"/>
<text x="498" y="215" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">handles clicks, forms and animation</text>
<circle cx="480" cy="244" r="5" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="0"/>
<text x="498" y="249" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">can reach session storage and cookies</text>
<circle cx="480" cy="278" r="5" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="0"/>
<text x="498" y="283" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">ships its JavaScript to the user</text>
<rect x="474" y="306" width="340" height="36" rx="6" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
<text x="644" y="330" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="bold">if it needs user interaction, use this</text>
</svg>
