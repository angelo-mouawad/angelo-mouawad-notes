<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="880" height="340" fill="#ffffff"/>
<text x="440" y="34" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">When two rules fight, the more specific one wins</text>
<rect x="60" y="216" width="170" height="84" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
