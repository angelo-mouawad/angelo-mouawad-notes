<text x="145" y="270" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">p { }</text>
<path d="M 232,280 L 256,280" fill="none" stroke="#334155" stroke-width="2"/>
<polygon points="246.0,275.0 246.0,285.0 256,280" fill="#334155"/>
