<text x="345" y="236" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">.name { }</text>
<path d="M 432,280 L 456,280" fill="none" stroke="#334155" stroke-width="2"/>
<polygon points="446.0,275.0 446.0,285.0 456,280" fill="#334155"/>
<rect x="460" y="148" width="170" height="152" rx="6" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
