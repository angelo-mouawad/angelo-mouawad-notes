<text x="545" y="202" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">#name { }</text>
<path d="M 632,280 L 656,280" fill="none" stroke="#334155" stroke-width="2"/>
<polygon points="646.0,275.0 646.0,285.0 656,280" fill="#334155"/>
<rect x="660" y="114" width="170" height="186" rx="6" fill="#fde68a" stroke="#334155" stroke-width="2"/>
<text x="745" y="144" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">Inline style</text>
<text x="745" y="168" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">style="..."</text>
<line x1="50" y1="300" x2="830" y2="300" stroke="#334155" stroke-width="2"/>
<text x="440" y="326" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="normal">same specificity means the last one written wins, and !important overrides all of it</text>
</svg>
