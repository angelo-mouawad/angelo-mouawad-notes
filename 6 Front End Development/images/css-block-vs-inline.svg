<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="880" height="330" fill="#ffffff"/>
<text x="440" y="34" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">Block takes the whole line, inline takes only what it needs</text>
<rect x="50" y="58" width="380" height="230" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<text x="240" y="84" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#0f766e" text-anchor="middle" font-weight="bold">Block</text>
<rect x="72" y="100" width="336" height="46" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="240" y="129" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">&lt;div&gt;</text>
<rect x="72" y="158" width="336" height="46" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="240" y="187" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">&lt;p&gt;</text>
<rect x="72" y="216" width="336" height="46" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="240" y="245" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">&lt;h1&gt;, &lt;li&gt;</text>
<text x="240" y="306" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">starts on a new line, full width</text>
<rect x="450" y="58" width="380" height="230" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<text x="640" y="84" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1d4ed8" text-anchor="middle" font-weight="bold">Inline</text>
<rect x="472" y="104" width="336" height="100" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<rect x="486" y="122" width="58" height="30" rx="3" fill="#ffffff" stroke="#ffffff" stroke-width="1"/>
<text x="515" y="142" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">some</text>
<rect x="552" y="122" width="58" height="30" rx="3" fill="#ffffff" stroke="#ffffff" stroke-width="1"/>
<text x="581" y="142" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">text</text>
<rect x="610" y="122" width="66" height="30" rx="3" fill="#dbeafe" stroke="#94a3b8" stroke-width="1"/>
<text x="643" y="142" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">&lt;a&gt;</text>
<rect x="668" y="122" width="58" height="30" rx="3" fill="#ffffff" stroke="#ffffff" stroke-width="1"/>
<text x="697" y="142" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">more</text>
<rect x="730" y="122" width="66" height="30" rx="3" fill="#dbeafe" stroke="#94a3b8" stroke-width="1"/>
<text x="763" y="142" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">&lt;span&gt;</text>
<text x="640" y="186" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">sits in the flow of the sentence</text>
<rect x="472" y="216" width="336" height="58" rx="6" fill="#fde68a" stroke="#334155" stroke-width="2"/>
<text x="640" y="240" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">display: block;  or  display: inline-block;</text>
<text x="640" y="262" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">to make an inline element sizeable with CSS</text>
<text x="640" y="306" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">only as wide as its content</text>
</svg>
