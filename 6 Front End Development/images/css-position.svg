<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="880" height="340" fill="#ffffff"/>
<text x="440" y="34" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">The four positioning modes</text>
<rect x="30" y="58" width="190" height="130" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<rect x="50" y="78" width="70" height="44" rx="6" fill="#e2e8f0" stroke="#334155" stroke-width="1"/>
<rect x="130" y="78" width="70" height="44" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="1"/>
<text x="125" y="212" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" fill="#0f766e" text-anchor="middle" font-weight="bold">static</text>
<text x="125" y="234" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">where it would normally sit</text>
<text x="125" y="252" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">the default, top and left do nothing</text>
<rect x="245" y="58" width="190" height="130" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<rect x="265" y="78" width="70" height="44" rx="6" fill="#e2e8f0" stroke="#334155" stroke-width="1"/>
<rect x="345" y="78" width="70" height="44" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 3"/>
<rect x="357" y="96" width="70" height="44" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="1"/>
<text x="340" y="212" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" fill="#0f766e" text-anchor="middle" font-weight="bold">relative</text>
<text x="340" y="234" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">nudged from its normal spot</text>
<text x="340" y="252" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">the space it left is kept</text>
<rect x="460" y="58" width="190" height="130" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<rect x="480" y="78" width="70" height="44" rx="6" fill="#e2e8f0" stroke="#334155" stroke-width="1"/>
<rect x="578" y="128" width="60" height="44" rx="6" fill="#dbeafe" stroke="#334155" stroke-width="1"/>
<text x="555" y="212" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" fill="#0f766e" text-anchor="middle" font-weight="bold">absolute</text>
<text x="555" y="234" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">placed against its positioned parent</text>
<text x="555" y="252" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">taken out of the flow</text>
<rect x="675" y="58" width="190" height="130" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<rect x="695" y="78" width="70" height="44" rx="6" fill="#e2e8f0" stroke="#334155" stroke-width="1"/>
<rect x="695" y="134" width="150" height="40" rx="6" fill="#fde68a" stroke="#334155" stroke-width="1"/>
<text x="770" y="159" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">always here</text>
<text x="770" y="212" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" fill="#0f766e" text-anchor="middle" font-weight="bold">fixed</text>
<text x="770" y="234" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">placed against the window</text>
<text x="770" y="252" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">stays put while the page scrolls</text>
<rect x="220" y="282" width="440" height="40" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<text x="440" y="307" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">top, right, bottom and left only do something once position is set</text>
</svg>
