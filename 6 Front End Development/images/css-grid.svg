<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="880" height="380" fill="#ffffff"/>
<text x="440" y="34" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">display: grid, for two dimensions instead of one</text>
<rect x="50" y="60" width="380" height="220" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<text x="240" y="86" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#0f766e" text-anchor="middle" font-weight="bold">even columns</text>
<rect x="76" y="104" width="100" height="70" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<rect x="194" y="104" width="100" height="70" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<rect x="312" y="104" width="100" height="70" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<rect x="76" y="192" width="100" height="70" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<rect x="194" y="192" width="100" height="70" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<rect x="312" y="192" width="100" height="70" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="240" y="300" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">grid-template-columns: repeat(3, 1fr);</text>
<text x="240" y="320" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">three columns of equal width</text>
<rect x="470" y="60" width="380" height="220" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<text x="660" y="86" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1d4ed8" text-anchor="middle" font-weight="bold">uneven columns</text>
<rect x="496" y="104" width="70" height="70" rx="6" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
<rect x="586" y="104" width="172" height="70" rx="6" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
<rect x="778" y="104" width="56" height="70" rx="6" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
<rect x="496" y="192" width="70" height="70" rx="6" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
<rect x="586" y="192" width="172" height="70" rx="6" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
<rect x="778" y="192" width="56" height="70" rx="6" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
<text x="660" y="300" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">grid-template-columns: 90px 2fr 1fr;</text>
<text x="660" y="320" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">each column gets its own width</text>
<rect x="180" y="340" width="520" height="32" rx="6" fill="#fde68a" stroke="#334155" stroke-width="2"/>
<text x="440" y="361" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">gap: 1rem;   sets the space between every cell</text>
</svg>
