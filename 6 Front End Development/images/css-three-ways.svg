<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="900" height="330" fill="#ffffff"/>
<text x="450" y="34" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">Three places CSS can live</text>
<rect x="30" y="58" width="260" height="236" rx="6" fill="#fde68a" stroke="#334155" stroke-width="2"/>
<text x="160" y="88" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#1f2933" text-anchor="middle" font-weight="bold">Inline</text>
<text x="160" y="110" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">in the tag itself</text>
<rect x="46" y="124" width="228" height="46" rx="6" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="60" y="151" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#1f2933" text-anchor="start" font-weight="normal">&lt;p style="color:blue"&gt;</text>
<text x="160" y="262" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="bold">one tag only</text>
<rect x="320" y="58" width="260" height="236" rx="6" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
<text x="450" y="88" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#1f2933" text-anchor="middle" font-weight="bold">Embedded</text>
<text x="450" y="110" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">in a &lt;style&gt; tag in the head</text>
<rect x="336" y="124" width="228" height="82" rx="6" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="350" y="151" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#1f2933" text-anchor="start" font-weight="normal">&lt;style&gt;</text>
<text x="350" y="169" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#1f2933" text-anchor="start" font-weight="normal">  p { color: blue; }</text>
<text x="350" y="187" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#1f2933" text-anchor="start" font-weight="normal">&lt;/style&gt;</text>
<text x="450" y="262" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="bold">one page only</text>
<rect x="610" y="58" width="260" height="236" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="740" y="88" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#1f2933" text-anchor="middle" font-weight="bold">External</text>
<text x="740" y="110" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">in its own .css file</text>
<rect x="626" y="124" width="228" height="64" rx="6" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="640" y="151" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#1f2933" text-anchor="start" font-weight="normal">&lt;link rel="stylesheet"</text>
<text x="640" y="169" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#1f2933" text-anchor="start" font-weight="normal">      href="style.css"/&gt;</text>
<text x="740" y="262" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="bold">every page that links it</text>
<text x="450" y="318" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">external is the one to use, the other two are for quick tests</text>
</svg>
