<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="900" height="470" fill="#ffffff"/>
<text x="450" y="34" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">display: flex, and the two axes it gives you</text>
<rect x="40" y="58" width="380" height="84" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<rect x="60" y="82" width="56" height="36" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="1"/>
<rect x="130" y="82" width="56" height="36" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="1"/>
<rect x="200" y="82" width="56" height="36" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="1"/>
<text x="230" y="158" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">flex-direction: row;</text>
<text x="230" y="176" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">the default, items sit next to each other</text>
<rect x="470" y="58" width="380" height="84" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<rect x="630" y="66" width="60" height="20" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="1"/>
<rect x="630" y="90" width="60" height="20" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="1"/>
<rect x="630" y="114" width="60" height="20" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="1"/>
<text x="660" y="158" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">flex-direction: column;</text>
<text x="660" y="176" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">items stack above each other</text>
<rect x="40" y="200" width="380" height="84" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<rect x="64" y="224" width="56" height="36" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="1"/>
<rect x="190" y="224" width="56" height="36" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="1"/>
<rect x="316" y="224" width="56" height="36" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="1"/>
<text x="230" y="300" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">justify-content: space-around;</text>
<text x="230" y="318" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">spreads them evenly on the main axis</text>
<rect x="470" y="200" width="380" height="84" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<rect x="730" y="224" width="56" height="36" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="1"/>
<rect x="660" y="224" width="56" height="36" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="1"/>
<rect x="590" y="224" width="56" height="36" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="1"/>
<text x="660" y="300" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">flex-direction: row-reverse;</text>
<text x="660" y="318" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">same row, order flipped</text>
<rect x="40" y="342" width="380" height="84" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<rect x="70" y="357.0" width="56" height="54" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="1"/>
<rect x="160" y="370.0" width="56" height="28" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="1"/>
<rect x="250" y="364.0" width="56" height="40" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="1"/>
<line x1="40" y1="384" x2="420" y2="384" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="230" y="442" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">align-items: center;</text>
<text x="230" y="460" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">centres on the cross axis</text>
<rect x="470" y="342" width="380" height="84" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<rect x="486" y="350" width="76" height="28" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="1"/>
<rect x="576" y="350" width="76" height="28" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="1"/>
<rect x="666" y="350" width="76" height="28" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="1"/>
<rect x="756" y="350" width="76" height="28" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="1"/>
<rect x="486" y="386" width="76" height="28" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="1"/>
<rect x="576" y="386" width="76" height="28" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="1"/>
<text x="660" y="442" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">flex-wrap: wrap;</text>
<text x="660" y="460" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">items that do not fit drop to the line below</text>
</svg>
