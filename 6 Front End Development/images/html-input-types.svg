<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="880" height="300" fill="#ffffff"/>
<text x="440" y="34" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">The attributes an &lt;input&gt; can carry</text>
<rect x="40" y="62" width="190" height="86" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="135" y="96" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">id</text>
<text x="135" y="124" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">names it for the label</text>
<rect x="250" y="62" width="190" height="86" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="345" y="96" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">type</text>
<text x="345" y="124" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">text, email, tel, number, date</text>
<rect x="460" y="62" width="190" height="86" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="555" y="96" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">required</text>
<text x="555" y="124" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">cannot be left empty</text>
<rect x="670" y="62" width="190" height="86" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="765" y="96" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">placeholder</text>
<text x="765" y="124" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">grey hint text inside</text>
<rect x="40" y="168" width="190" height="86" rx="6" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
<text x="135" y="202" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">min / max</text>
<text x="135" y="230" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">limits the accepted value</text>
<rect x="250" y="168" width="190" height="86" rx="6" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
<text x="345" y="202" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">value</text>
<text x="345" y="230" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">the text on a submit button</text>
<rect x="460" y="168" width="190" height="86" rx="6" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
<text x="555" y="202" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">checkbox</text>
<text x="555" y="230" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">several can be ticked</text>
<rect x="670" y="168" width="190" height="86" rx="6" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
<text x="765" y="202" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">radio</text>
<text x="765" y="230" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">same name means one of the set</text>
<text x="440" y="288" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">radio buttons only behave as a group when they share the same name</text>
</svg>
