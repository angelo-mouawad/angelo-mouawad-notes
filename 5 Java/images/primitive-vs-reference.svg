<text x="645" y="228" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">String object</text>
<text x="645" y="254" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="normal">"Angelo"</text>
<path d="M 402,230 L 514,230" fill="none" stroke="#1d4ed8" stroke-width="2"/>
<polygon points="504.0,225.0 504.0,235.0 514,230" fill="#1d4ed8"/>
<text x="645" y="316" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">the object sits here, and the</text>
<text x="645" y="338" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">variable only points at it</text>
