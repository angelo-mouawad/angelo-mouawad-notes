<text x="315" y="236" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#1d4ed8" text-anchor="middle" font-weight="normal">0x4a1f</text>
<text x="92" y="250" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#1d4ed8" text-anchor="start" font-weight="normal">reference</text>
