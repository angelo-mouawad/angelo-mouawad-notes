<text x="315" y="158" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">21</text>
<text x="92" y="172" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#0f766e" text-anchor="start" font-weight="normal">primitive</text>
