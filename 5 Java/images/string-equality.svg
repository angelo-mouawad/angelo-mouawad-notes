<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="880" height="380" fill="#ffffff"/>
<text x="440" y="34" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">Why == fails on objects</text>
<rect x="40" y="58" width="390" height="240" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<rect x="70" y="80" width="150" height="46" rx="6" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
<text x="145.0" y="108.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="normal">a</text>
<rect x="250" y="80" width="150" height="46" rx="6" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
<text x="325.0" y="108.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="normal">b</text>
<text x="145" y="146" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="normal">0x4a1f</text>
<text x="325" y="146" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="normal">0x7c30</text>
<path d="M 145,152 L 145,186" fill="none" stroke="#1d4ed8" stroke-width="2"/>
<polygon points="140.0,176.0 150.0,176.0 145,186" fill="#1d4ed8"/>
<path d="M 325,152 L 325,186" fill="none" stroke="#1d4ed8" stroke-width="2"/>
<polygon points="320.0,176.0 330.0,176.0 325,186" fill="#1d4ed8"/>
<rect x="70" y="188" width="150" height="56" rx="6" fill="#fde68a" stroke="#334155" stroke-width="2"/>
<text x="145" y="220" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="normal">"hello"</text>
<rect x="250" y="188" width="150" height="56" rx="6" fill="#fde68a" stroke="#334155" stroke-width="2"/>
<text x="325" y="220" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="normal">"hello"</text>
<text x="235" y="272" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">two objects, same contents, different addresses</text>
<rect x="450" y="58" width="390" height="240" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<rect x="474" y="84" width="340" height="90" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
<text x="644" y="112" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" fill="#b91c1c" text-anchor="middle" font-weight="bold">a == b</text>
<text x="644" y="138" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">compares the addresses</text>
<text x="644" y="160" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" fill="#b91c1c" text-anchor="middle" font-weight="bold">false</text>
<rect x="474" y="190" width="340" height="90" rx="6" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
<text x="644" y="218" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" fill="#0f766e" text-anchor="middle" font-weight="bold">a.equals(b)</text>
<text x="644" y="244" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">compares the contents</text>
<text x="644" y="266" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" fill="#0f766e" text-anchor="middle" font-weight="bold">true</text>
<rect x="40" y="312" width="800" height="56" rx="8" fill="#fde68a" stroke="#334155" stroke-width="2"/>
<text x="440" y="336" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">use == for primitives, equals() for everything else</text>
<text x="440" y="358" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">if you override equals, override hashCode too, or hash based collections break</text>
</svg>
