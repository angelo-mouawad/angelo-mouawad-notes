<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="880" height="340" fill="#ffffff"/>
<text x="440" y="34" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">A box that may or may not have something in it</text>
<rect x="40" y="58" width="390" height="200" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
<text x="235" y="84" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#b91c1c" text-anchor="middle" font-weight="bold">returning null</text>
<rect x="64" y="96" width="342" height="68" rx="6" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="78" y="125" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">User u = findUser(id);</text>
<text x="78" y="145" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">return u.getName();</text>
<rect x="64" y="178" width="342" height="62" rx="6" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/>
<text x="235" y="202" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" fill="#b91c1c" text-anchor="middle" font-weight="bold">NullPointerException</text>
<text x="235" y="224" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">nothing in the signature warned you</text>
<rect x="450" y="58" width="390" height="200" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
<text x="645" y="84" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#0f766e" text-anchor="middle" font-weight="bold">returning Optional</text>
<rect x="474" y="96" width="342" height="88" rx="6" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="488" y="125" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">Optional&lt;User&gt; u = findUser(id);</text>
<text x="488" y="145" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">return u.map(User::getName)</text>
<text x="488" y="165" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">        .orElse("unknown");</text>
<rect x="474" y="198" width="342" height="42" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="645" y="224" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="bold">the empty case is impossible to forget</text>
<rect x="40" y="272" width="800" height="56" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<text x="440" y="296" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">isPresent, get, orElse, orElseThrow, map, ifPresent</text>
<text x="440" y="318" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">use it as a return type, not as a field or a parameter</text>
</svg>
