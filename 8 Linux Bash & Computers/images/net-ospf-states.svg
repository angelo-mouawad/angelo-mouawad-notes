<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 520" width="790" height="520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="790" height="520" fill="#ffffff"/>
<text x="395.0" y="32" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#1f2933" text-anchor="middle" font-weight="bold">The OSPF neighbour states in order</text>
<rect x="60" y="62" width="190" height="46" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="155.0" y="90.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">Down</text>
<text x="272" y="91" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="start" font-weight="normal">nothing heard yet, so the router starts sending Hello packets</text>
<path d="M 155,108 L 155,124" fill="none" stroke="#64748b" stroke-width="2"/>
<polygon points="149,113.8 161,113.8 155,124" fill="#64748b"/>
<rect x="60" y="126" width="190" height="46" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="155.0" y="154.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">Init</text>
<text x="272" y="155" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="start" font-weight="normal">a Hello came in, and it carries the sender's router ID</text>
<path d="M 155,172 L 155,188" fill="none" stroke="#64748b" stroke-width="2"/>
<polygon points="149,177.8 161,177.8 155,188" fill="#64748b"/>
<rect x="60" y="190" width="190" height="46" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="155.0" y="218.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">Two way</text>
<text x="272" y="219" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="start" font-weight="normal">both sides can hear each other, a DR and BDR get elected here</text>
<path d="M 155,236 L 155,252" fill="none" stroke="#64748b" stroke-width="2"/>
<polygon points="149,241.8 161,241.8 155,252" fill="#64748b"/>
<rect x="60" y="254" width="190" height="46" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="155.0" y="282.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">Ex start</text>
<text x="272" y="283" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="start" font-weight="normal">the two routers agree who sends the first DBD packet</text>
<path d="M 155,300 L 155,316" fill="none" stroke="#64748b" stroke-width="2"/>
<polygon points="149,305.8 161,305.8 155,316" fill="#64748b"/>
<rect x="60" y="318" width="190" height="46" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="155.0" y="346.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">Exchange</text>
<text x="272" y="347" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="start" font-weight="normal">DBD packets get swapped so each side sees what the other has</text>
<path d="M 155,364 L 155,380" fill="none" stroke="#64748b" stroke-width="2"/>
<polygon points="149,369.8 161,369.8 155,380" fill="#64748b"/>
<rect x="60" y="382" width="190" height="46" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="155.0" y="410.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">Loading</text>
<text x="272" y="411" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="start" font-weight="normal">LSR and LSU packets fetch whatever was missing</text>
<path d="M 155,428 L 155,444" fill="none" stroke="#64748b" stroke-width="2"/>
<polygon points="149,433.8 161,433.8 155,444" fill="#64748b"/>
<rect x="60" y="446" width="190" height="46" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="155.0" y="474.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">Full</text>
<text x="272" y="475" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="start" font-weight="normal">both link state databases match, the adjacency is done</text>
</svg>
