<polygon points="304.8,250 304.8,262 315,256" fill="#0f766e"/>
<text x="210" y="248" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="normal">data 2</text>
