<rect x="30" y="52" width="360" height="262" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="210" y="82" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#0f766e" text-anchor="middle" font-weight="bold">TCP</text>
<text x="210" y="104" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="normal">stateful</text>
<rect x="55" y="122" width="100" height="42" rx="6" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
<text x="105.0" y="148.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">Sender</text>
