<polygon points="115.2,280 115.2,292 105,286" fill="#1d4ed8"/>
<text x="210" y="278" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="normal">ack 2</text>
<rect x="430" y="52" width="360" height="262" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="610" y="82" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#b91c1c" text-anchor="middle" font-weight="bold">UDP</text>
<text x="610" y="104" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="normal">stateless</text>
<rect x="455" y="122" width="100" height="42" rx="6" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
<text x="505.0" y="148.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">Sender</text>
<rect x="665" y="122" width="100" height="42" rx="6" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
<text x="715.0" y="148.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">Receiver</text>
<path d="M 505,196 L 715,196" fill="none" stroke="#0f766e" stroke-width="2"/>
<polygon points="704.8,190 704.8,202 715,196" fill="#0f766e"/>
<text x="610" y="188" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="normal">data 1</text>
<path d="M 505,226 L 715,226" fill="none" stroke="#b91c1c" stroke-width="2"/>
<polygon points="704.8,220 704.8,232 715,226" fill="#b91c1c"/>
<text x="610" y="218" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="normal">data 2, lost</text>
