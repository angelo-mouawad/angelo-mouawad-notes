<polygon points="304.8,190 304.8,202 315,196" fill="#0f766e"/>
<text x="210" y="188" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="normal">data 1</text>
