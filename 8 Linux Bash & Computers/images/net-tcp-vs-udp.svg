<polygon points="115.2,220 115.2,232 105,226" fill="#1d4ed8"/>
<text x="210" y="218" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="normal">ack 1</text>
