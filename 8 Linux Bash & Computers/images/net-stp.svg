<text x="185.0" y="296.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">S3</text>
<rect x="560" y="262" width="170" height="58" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="645.0" y="296.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">S1</text>
<line x1="330" y1="132" x2="270" y2="268" stroke="#334155" stroke-width="2"/>
<line x1="500" y1="132" x2="560" y2="268" stroke="#334155" stroke-width="2"/>
<line x1="270" y1="296" x2="560" y2="296" stroke="#b91c1c" stroke-width="2" stroke-dasharray="7 5"/>
<text x="340" y="174" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="normal">DP</text>
<text x="492" y="174" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="normal">DP</text>
<text x="268" y="236" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1d4ed8" text-anchor="middle" font-weight="normal">RP</text>
<text x="560" y="236" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1d4ed8" text-anchor="middle" font-weight="normal">RP</text>
<text x="298" y="320" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#b91c1c" text-anchor="middle" font-weight="normal">AP</text>
<text x="536" y="320" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="normal">DP</text>
<circle cx="415" cy="296" r="16" fill="#ffffff" stroke="#b91c1c" stroke-width="3"/>
<line x1="405" y1="286" x2="425" y2="306" stroke="#b91c1c" stroke-width="3"/>
<line x1="425" y1="286" x2="405" y2="306" stroke="#b91c1c" stroke-width="3"/>
<text x="415" y="344" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#b91c1c" text-anchor="middle" font-weight="normal">blocked, so no loop</text>
<text x="60" y="372" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#0f766e" text-anchor="start" font-weight="normal">DP  designated port, forwards</text>
<text x="60" y="394" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1d4ed8" text-anchor="start" font-weight="normal">RP  root port, the way back to the root bridge</text>
<text x="470" y="372" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#b91c1c" text-anchor="start" font-weight="normal">AP  alternate port, blocked on purpose</text>
<text x="470" y="394" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="start" font-weight="normal">if a working link dies, STP reopens the blocked port</text>
