<text x="360.0" y="248" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="normal">(1 x 8) + (0 x 4) + (1 x 2) + (0 x 1)  =  10</text>
<text x="360.0" y="278" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#64748b" text-anchor="middle" font-weight="normal">so (1010) in base 2 is 10 in base 10</text>
