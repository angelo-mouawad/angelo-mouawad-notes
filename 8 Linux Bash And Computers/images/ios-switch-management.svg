<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" width="820" height="360" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="820" height="360" fill="#ffffff"/>
<text x="410" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">A switch needs an IP only so you can manage it</text>
<rect x="60" y="60" width="320" height="240" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="220" y="88" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold">The switch itself</text>
<rect x="90" y="104" width="260" height="40" rx="6" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="220.0" y="129.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">no IP on the physical ports</text>
<text x="220" y="168" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal">ports forward frames at layer 2</text>
<text x="220" y="188" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal">and need no address to do it</text>
<rect x="90" y="208" width="260" height="46" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="220.0" y="236.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">interface vlan 99</text>
<text x="220" y="274" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="normal">the SVI is the management address</text>
<polyline points="392,180 452,180" fill="none" stroke="#334155" stroke-width="2" stroke-linejoin="round"/>
<polygon points="452,180 444,173 444,187" fill="#334155"/>
<rect x="470" y="60" width="300" height="240" rx="10" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
<text x="620" y="88" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold">What you configure</text>
<text x="492" y="122" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">interface vlan 99</text>
<text x="492" y="148" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#0f766e" text-anchor="start" font-weight="normal">  ip address 10.0.0.2 255.255.255.0</text>
<text x="492" y="174" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#0f766e" text-anchor="start" font-weight="normal">  no shutdown</text>
<text x="492" y="200" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">exit</text>
<text x="492" y="226" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">ip default-gateway 10.0.0.1</text>
<text x="620" y="274" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal">the gateway is a global command,</text>
<text x="620" y="290" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal">not an interface one</text>
<text x="410" y="336" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">a layer 2 switch has one usable SVI at a time, a layer 3 switch has one per VLAN</text>
</svg>
