<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 330" width="740" height="330" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="740" height="330" fill="#ffffff"/>
<text x="370.0" y="32" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#1f2933" text-anchor="middle" font-weight="bold">The two triangles worth memorising</text>
<text x="200" y="64" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#0f766e" text-anchor="middle" font-weight="bold">Ohm's law</text>
<polygon points="200,86 100,236 300,236" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<line x1="140" y1="176" x2="260" y2="176" stroke="#334155" stroke-width="2"/>
<line x1="200" y1="176" x2="200" y2="236" stroke="#334155" stroke-width="2"/>
<text x="200" y="152" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#1f2933" text-anchor="middle" font-weight="normal">U</text>
<text x="168" y="216" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#1f2933" text-anchor="middle" font-weight="normal">I</text>
<text x="232" y="216" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#1f2933" text-anchor="middle" font-weight="normal">R</text>
<text x="540" y="64" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#0f766e" text-anchor="middle" font-weight="bold">Power</text>
<polygon points="540,86 440,236 640,236" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<line x1="480" y1="176" x2="600" y2="176" stroke="#334155" stroke-width="2"/>
<line x1="540" y1="176" x2="540" y2="236" stroke="#334155" stroke-width="2"/>
<text x="540" y="152" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#1f2933" text-anchor="middle" font-weight="normal">P</text>
<text x="508" y="216" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#1f2933" text-anchor="middle" font-weight="normal">U</text>
<text x="572" y="216" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#1f2933" text-anchor="middle" font-weight="normal">I</text>
<text x="200" y="272" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">U = I x R</text>
<text x="200" y="296" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">I = U / R</text>
<text x="200" y="320" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">R = U / I</text>
<text x="540" y="272" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">P = U x I</text>
<text x="540" y="296" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">U = P / I</text>
<text x="540" y="320" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">I = P / U</text>
</svg>
