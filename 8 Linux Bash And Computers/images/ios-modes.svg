<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="860" height="420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="860" height="420" fill="#ffffff"/>
<text x="430" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">The mode hierarchy, and the prompt that tells you where you are</text>
<rect x="180" y="60" width="500" height="56" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="300" y="84" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">User EXEC</text>
<text x="300" y="104" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal">look, do not touch</text>
<rect x="470" y="74" width="190" height="28" rx="14.0" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="565.0" y="92.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="normal">Switch&gt;</text>
<rect x="180" y="140" width="500" height="56" rx="8" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
<text x="300" y="164" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">Privileged EXEC</text>
<text x="300" y="184" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal">every show and debug command</text>
<rect x="470" y="154" width="190" height="28" rx="14.0" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="565.0" y="172.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="normal">Switch#</text>
<rect x="180" y="220" width="500" height="56" rx="8" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="300" y="244" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">Global Config</text>
<text x="300" y="264" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal">changes affecting the whole device</text>
<rect x="470" y="234" width="190" height="28" rx="14.0" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="565.0" y="252.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="normal">Switch(config)#</text>
<polyline points="430,116 430,138" fill="none" stroke="#334155" stroke-width="2" stroke-linejoin="round"/>
<polygon points="430,138 423,130 437,130" fill="#334155"/>
<text x="560" y="132" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="normal">enable</text>
<polyline points="430,196 430,218" fill="none" stroke="#334155" stroke-width="2" stroke-linejoin="round"/>
<polygon points="430,218 423,210 437,210" fill="#334155"/>
<text x="600" y="212" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="normal">configure terminal</text>
<polyline points="430,276 430,296 160,296 160,316" fill="none" stroke="#334155" stroke-width="2" stroke-linejoin="round"/>
<polygon points="160,316 153,308 167,308" fill="#334155"/>
<rect x="30" y="320" width="260" height="54" rx="8" fill="#fde68a" stroke="#334155" stroke-width="2"/>
<text x="160" y="342" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold">Switch(config-if)#</text>
<text x="160" y="362" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal">interface g0/1</text>
<polyline points="430,276 430,296 430,296 430,316" fill="none" stroke="#334155" stroke-width="2" stroke-linejoin="round"/>
<polygon points="430,316 423,308 437,308" fill="#334155"/>
<rect x="300" y="320" width="260" height="54" rx="8" fill="#fde68a" stroke="#334155" stroke-width="2"/>
<text x="430" y="342" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold">Switch(config-line)#</text>
<text x="430" y="362" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal">line vty 0 15</text>
<polyline points="430,276 430,296 700,296 700,316" fill="none" stroke="#334155" stroke-width="2" stroke-linejoin="round"/>
<polygon points="700,316 693,308 707,308" fill="#334155"/>
<rect x="570" y="320" width="260" height="54" rx="8" fill="#fde68a" stroke="#334155" stroke-width="2"/>
<text x="700" y="342" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold">Switch(config-router)#</text>
<text x="700" y="362" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal">router ospf 10</text>
<text x="430" y="400" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">exit goes up one level, end jumps straight back to privileged EXEC</text>
</svg>
