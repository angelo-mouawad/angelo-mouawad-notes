<text x="267" y="182" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">sector</text>
<path d="M 215,328 L 195,292" fill="none" stroke="#64748b" stroke-width="2"/>
<polygon points="189,302.2 201,302.2 195,292" fill="#64748b"/>
<text x="227" y="344" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="start" font-weight="normal">track</text>
<text x="175" y="378" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="normal">a cluster is just a group of sectors</text>
<text x="600" y="96" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="normal">the 512 bytes of data carry a header and a tail</text>
