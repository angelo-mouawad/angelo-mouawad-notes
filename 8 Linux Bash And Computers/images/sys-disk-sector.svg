<text x="472.5" y="190" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="normal">Sync</text>
<rect x="500" y="150" width="100" height="66" rx="0" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
<text x="550.0" y="182" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">Address</text>
<text x="550.0" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">mark</text>
