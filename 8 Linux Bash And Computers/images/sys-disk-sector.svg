<text x="495" y="124" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="normal">15 bytes</text>
<line x1="600" y1="232" x2="740" y2="232" stroke="#0f766e" stroke-width="2"/>
<line x1="600" y1="232" x2="600" y2="220" stroke="#0f766e" stroke-width="2"/>
