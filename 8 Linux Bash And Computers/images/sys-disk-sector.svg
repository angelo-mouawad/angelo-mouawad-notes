<text x="770.0" y="190" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="normal">ECC</text>
<line x1="390" y1="132" x2="600" y2="132" stroke="#0f766e" stroke-width="2"/>
<line x1="390" y1="132" x2="390" y2="144" stroke="#0f766e" stroke-width="2"/>
