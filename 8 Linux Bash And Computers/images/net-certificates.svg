<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="860" height="400" fill="#ffffff"/>
<text x="430.0" y="32" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#1f2933" text-anchor="middle" font-weight="bold">Self signed against signed by a CA</text>
<text x="40" y="76" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#b91c1c" text-anchor="start" font-weight="bold">Self signed</text>
<rect x="40" y="92" width="160" height="54" rx="6" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
<text x="120.0" y="124.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="normal">private.pem</text>
<path d="M 200,119 L 272,119" fill="none" stroke="#64748b" stroke-width="2"/>
<polygon points="261.8,113 261.8,125 272,119" fill="#64748b"/>
<rect x="240" y="92" width="160" height="54" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="320.0" y="124.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="normal">cert.csr</text>
<path d="M 400,119 L 472,119" fill="none" stroke="#64748b" stroke-width="2"/>
<polygon points="461.8,113 461.8,125 472,119" fill="#64748b"/>
<rect x="440" y="92" width="160" height="54" rx="6" fill="#fee2e2" stroke="#334155" stroke-width="2"/>
<text x="520.0" y="124.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="normal">cert.crt</text>
<text x="660" y="108" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#b91c1c" text-anchor="start" font-weight="normal">issuer equals subject</text>
<text x="660" y="130" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#b91c1c" text-anchor="start" font-weight="normal">openssl verify fails</text>
<line x1="40" y1="178" x2="820" y2="178" stroke="#e2e8f0" stroke-width="2"/>
<text x="40" y="210" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#0f766e" text-anchor="start" font-weight="bold">Signed by a certificate authority</text>
<rect x="40" y="226" width="160" height="54" rx="6" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
<text x="120.0" y="258.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">server.key</text>
<path d="M 200,253 L 272,253" fill="none" stroke="#64748b" stroke-width="2"/>
<polygon points="261.8,247 261.8,259 272,253" fill="#64748b"/>
<rect x="240" y="226" width="160" height="54" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="320.0" y="258.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">server.csr</text>
<path d="M 400,253 L 472,253" fill="none" stroke="#64748b" stroke-width="2"/>
<polygon points="461.8,247 461.8,259 472,253" fill="#64748b"/>
<rect x="440" y="226" width="160" height="54" rx="6" fill="#fde68a" stroke="#334155" stroke-width="2"/>
<text x="520.0" y="258.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">ca.crt + ca.key</text>
<path d="M 600,253 L 672,253" fill="none" stroke="#64748b" stroke-width="2"/>
<polygon points="661.8,247 661.8,259 672,253" fill="#64748b"/>
<rect x="640" y="226" width="160" height="54" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="720.0" y="258.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">server.crt</text>
<text x="490" y="306" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="normal">the CA signs the request</text>
<text x="430.0" y="348" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="normal">now the issuer is the CA and the subject is the server, so they differ,</text>
<text x="430.0" y="372" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="normal">and openssl verify against ca.crt succeeds</text>
</svg>
