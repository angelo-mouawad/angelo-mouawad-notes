<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="860" height="300" fill="#ffffff"/>
<text x="430" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">The anatomy of a static route</text>
<rect x="40" y="70" width="130" height="46" rx="6" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
<text x="105.0" y="98.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="normal">ip route</text>
<polyline points="105.0,116 105.0,140" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linejoin="round"/>
<polygon points="105.0,140 98.0,132 112.0,132" fill="#64748b"/>
<text x="105.0" y="158" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal">the command</text>
<rect x="180" y="70" width="190" height="46" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="275.0" y="98.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="normal">192.168.2.0</text>
<polyline points="275.0,116 275.0,140" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linejoin="round"/>
<polygon points="275.0,140 268.0,132 282.0,132" fill="#64748b"/>
<text x="275.0" y="158" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal">destination network</text>
<rect x="380" y="70" width="200" height="46" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="480.0" y="98.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="normal">255.255.255.0</text>
<polyline points="480.0,116 480.0,140" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linejoin="round"/>
<polygon points="480.0,140 473.0,132 487.0,132" fill="#64748b"/>
<text x="480.0" y="158" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal">its subnet mask</text>
<rect x="590" y="70" width="210" height="46" rx="6" fill="#fde68a" stroke="#334155" stroke-width="2"/>
<text x="695.0" y="98.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="normal">10.0.0.2</text>
<polyline points="695.0,116 695.0,140" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linejoin="round"/>
<polygon points="695.0,140 688.0,132 702.0,132" fill="#64748b"/>
<text x="695.0" y="158" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal">next hop, or exit interface</text>
<rect x="40" y="180" width="780" height="96" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="60" y="206" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" fill="#0f766e" text-anchor="start" font-weight="bold">ip route 0.0.0.0 0.0.0.0 10.0.0.2</text>
<text x="60" y="232" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">all zeroes in both fields means the default route, the gateway of last resort</text>
<text x="60" y="258" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal">it matches anything the routing table has no better answer for</text>
</svg>
