<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" width="840" height="360" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="840" height="360" fill="#ffffff"/>
<text x="420" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">A router can hand out addresses, or forward the request to something that does</text>
<rect x="50" y="62" width="370" height="190" rx="10" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="235" y="88" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold">Router as the DHCP server</text>
<text x="68" y="116" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#1f2933" text-anchor="start" font-weight="normal">ip dhcp excluded-address 192.168.1.1 192.168.1.9</text>
<text x="68" y="140" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#1f2933" text-anchor="start" font-weight="normal">ip dhcp pool LAN</text>
<text x="68" y="164" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#0f766e" text-anchor="start" font-weight="normal">  network 192.168.1.0 255.255.255.0</text>
<text x="68" y="188" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#0f766e" text-anchor="start" font-weight="normal">  default-router 192.168.1.1</text>
<text x="68" y="212" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#0f766e" text-anchor="start" font-weight="normal">  dns-server 8.8.8.8</text>
<text x="235" y="240" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal">exclude the static addresses first</text>
<rect x="450" y="62" width="340" height="190" rx="10" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
<text x="620" y="88" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold">Router as a relay</text>
<text x="620" y="122" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">the server sits on another network,</text>
<text x="620" y="142" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">and broadcasts do not cross a router</text>
<text x="468" y="178" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">interface g0/0</text>
<text x="468" y="202" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#1d4ed8" text-anchor="start" font-weight="normal">  ip helper-address 10.0.0.50</text>
<text x="620" y="236" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal">turns the broadcast into a unicast</text>
<rect x="50" y="276" width="740" height="60" rx="8" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
<text x="420" y="300" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">the helper address goes on the interface the clients are on, not the server side</text>
<text x="420" y="322" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="normal">a client interface set to ip address dhcp makes the router a DHCP client instead</text>
</svg>
