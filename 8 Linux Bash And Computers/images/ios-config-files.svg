<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 390" width="820" height="390" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="820" height="390" fill="#ffffff"/>
<text x="410" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">Two configuration files, and only one survives a reload</text>
<rect x="50" y="60" width="320" height="180" rx="10" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="210" y="88" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">running-config</text>
<rect x="120" y="100" width="180" height="26" rx="13.0" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="210.0" y="117.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="normal">lives in RAM</text>
<text x="210" y="156" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">what the device is doing</text>
<text x="210" y="178" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">right now</text>
<text x="210" y="210" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="normal">every command takes effect</text>
<text x="210" y="228" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="normal">the moment you press enter</text>
<rect x="450" y="60" width="320" height="180" rx="10" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
<text x="610" y="88" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">startup-config</text>
<rect x="520" y="100" width="180" height="26" rx="13.0" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="610.0" y="117.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="normal">lives in NVRAM</text>
<text x="610" y="156" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">what the device will load</text>
<text x="610" y="178" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">after a reload</text>
<text x="610" y="210" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="normal">unchanged until you</text>
<text x="610" y="228" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="normal">explicitly copy to it</text>
<polyline points="376,130 444,130" fill="none" stroke="#0f766e" stroke-width="2.2" stroke-linejoin="round"/>
<polygon points="444,130 436,123 436,137" fill="#0f766e"/>
<polyline points="444,190 376,190" fill="none" stroke="#64748b" stroke-width="2.2" stroke-linejoin="round"/>
<polygon points="376,190 384,183 384,197" fill="#64748b"/>
<rect x="50" y="260" width="720" height="108" rx="8" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
<text x="70" y="286" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#0f766e" text-anchor="start" font-weight="normal">copy running-config startup-config</text>
<text x="390" y="286" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">saves RAM into NVRAM</text>
<text x="70" y="310" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal">reload</text>
<text x="390" y="310" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">loads NVRAM back into RAM</text>
<text x="70" y="340" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#b91c1c" text-anchor="start" font-weight="normal">forgetting to save is the classic mistake, the device works until it reboots</text>
<text x="70" y="360" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal">write memory is the older spelling of the same thing</text>
</svg>
