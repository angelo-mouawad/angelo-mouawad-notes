<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 450" width="830" height="450" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="830" height="450" fill="#ffffff"/>
<text x="415.0" y="34" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#1f2933" text-anchor="middle" font-weight="bold">What sits inside the case</text>
<rect x="30" y="180" width="140" height="80" rx="6" fill="#fee2e2" stroke="#334155" stroke-width="2"/>
<text x="100.0" y="216.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="normal">Power supply</text>
<text x="100.0" y="235.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="normal">from the wall</text>
<path d="M 170,220 L 205,220" fill="none" stroke="#64748b" stroke-width="2"/>
<polygon points="194.8,214 194.8,226 205,220" fill="#64748b"/>
<rect x="200" y="58" width="600" height="350" rx="10" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
<text x="220" y="86" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="start" font-weight="bold">Motherboard</text>
<rect x="240" y="108" width="155" height="92" rx="6" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
<text x="317.5" y="150.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">CPU</text>
<text x="317.5" y="169.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="normal">does the work</text>
<rect x="425" y="108" width="150" height="92" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="500.0" y="150.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">RAM</text>
<text x="500.0" y="169.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="normal">in use right now</text>
<rect x="605" y="108" width="155" height="92" rx="6" fill="#ede9fe" stroke="#334155" stroke-width="2"/>
<text x="682.5" y="150.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">GPU</text>
<text x="682.5" y="169.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="normal">draws the pixels</text>
<rect x="240" y="264" width="155" height="92" rx="6" fill="#fde68a" stroke="#334155" stroke-width="2"/>
<text x="317.5" y="306.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">SSD</text>
<text x="317.5" y="325.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="normal">fast, fits less</text>
<rect x="425" y="264" width="150" height="92" rx="6" fill="#fde68a" stroke="#334155" stroke-width="2"/>
<text x="500.0" y="306.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">HDD</text>
<text x="500.0" y="325.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="normal">slow, fits more</text>
<path d="M 395,154 L 425,154" fill="none" stroke="#334155" stroke-width="2"/>
<polygon points="414.8,148 414.8,160 425,154" fill="#334155"/>
<path d="M 575,154 L 605,154" fill="none" stroke="#334155" stroke-width="2"/>
<polygon points="594.8,148 594.8,160 605,154" fill="#334155"/>
<path d="M 317,200 L 317,264" fill="none" stroke="#334155" stroke-width="2"/>
<polygon points="311,253.8 323,253.8 317,264" fill="#334155"/>
<path d="M 500,264 L 500,200" fill="none" stroke="#334155" stroke-width="2"/>
<polygon points="494,210.2 506,210.2 500,200" fill="#334155"/>
<text x="690" y="288" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="normal">loading something means</text>
<text x="690" y="310" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="normal">the CPU pulls it off the</text>
<text x="690" y="332" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="normal">drive and puts it in RAM</text>
<text x="415.0" y="436" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="normal">every component talks to every other one through the motherboard</text>
</svg>
