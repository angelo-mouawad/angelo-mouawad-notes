<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" width="820" height="320" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="820" height="320" fill="#ffffff"/>
<text x="410" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">in and out are from the router's point of view</text>
<rect x="330" y="130" width="160" height="90" rx="6" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
<text x="410.0" y="180.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">Router</text>
<polyline points="120,155 322,155" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="322,155 314,148 314,162" fill="#0f766e"/>
<text x="220" y="138" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" fill="#0f766e" text-anchor="middle" font-weight="bold">in</text>
<text x="220" y="176" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal">arriving on the interface</text>
<polyline points="498,195 700,195" fill="none" stroke="#1d4ed8" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="700,195 692,188 692,202" fill="#1d4ed8"/>
<text x="600" y="178" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" fill="#1d4ed8" text-anchor="middle" font-weight="bold">out</text>
<text x="600" y="216" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal">leaving the interface</text>
<rect x="60" y="246" width="700" height="60" rx="8" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
<text x="410" y="270" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" fill="#0f766e" text-anchor="middle" font-weight="bold">ip access-group 10 in</text>
<text x="410" y="294" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">applied in interface configuration mode, one ACL per interface per direction</text>
</svg>
