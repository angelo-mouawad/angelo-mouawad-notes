<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 380" width="830" height="380" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="830" height="380" fill="#ffffff"/>
<text x="415.0" y="32" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#1f2933" text-anchor="middle" font-weight="bold">Pipes and redirection</text>
<rect x="50" y="70" width="160" height="54" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="130.0" y="102.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">ls -l</text>
<path d="M 210,97 L 238,97" fill="none" stroke="#64748b" stroke-width="2"/>
<polygon points="227.8,91 227.8,103 238,97" fill="#64748b"/>
<rect x="240" y="70" width="60" height="54" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="270.0" y="102.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="22" fill="#1f2933" text-anchor="middle" font-weight="bold">|</text>
<path d="M 300,97 L 328,97" fill="none" stroke="#64748b" stroke-width="2"/>
<polygon points="317.8,91 317.8,103 328,97" fill="#64748b"/>
<rect x="330" y="70" width="160" height="54" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="410.0" y="102.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">grep group</text>
<text x="520" y="92" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="start" font-weight="normal">takes the output of the left command</text>
<text x="520" y="114" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="start" font-weight="normal">and feeds it in as input on the right</text>
<rect x="50" y="170" width="160" height="54" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="130.0" y="202.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">echo 'hi'</text>
<path d="M 210,197 L 238,197" fill="none" stroke="#64748b" stroke-width="2"/>
<polygon points="227.8,191 227.8,203 238,197" fill="#64748b"/>
<rect x="240" y="170" width="60" height="54" rx="6" fill="#fde68a" stroke="#334155" stroke-width="2"/>
<text x="270.0" y="202.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="22" fill="#1f2933" text-anchor="middle" font-weight="bold">&gt;</text>
<path d="M 300,197 L 328,197" fill="none" stroke="#64748b" stroke-width="2"/>
<polygon points="317.8,191 317.8,203 328,197" fill="#64748b"/>
<rect x="330" y="170" width="160" height="54" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="410.0" y="202.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">file.txt</text>
<text x="520" y="192" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="start" font-weight="normal">writes into the file and throws away</text>
<text x="520" y="214" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="start" font-weight="normal">whatever was in it before</text>
<rect x="50" y="270" width="160" height="54" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="130.0" y="302.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">echo 'hi'</text>
<path d="M 210,297 L 238,297" fill="none" stroke="#64748b" stroke-width="2"/>
<polygon points="227.8,291 227.8,303 238,297" fill="#64748b"/>
<rect x="240" y="270" width="60" height="54" rx="6" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
<text x="270.0" y="302.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="22" fill="#1f2933" text-anchor="middle" font-weight="bold">&gt;&gt;</text>
<path d="M 300,297 L 328,297" fill="none" stroke="#64748b" stroke-width="2"/>
<polygon points="317.8,291 317.8,303 328,297" fill="#64748b"/>
<rect x="330" y="270" width="160" height="54" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="410.0" y="302.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">file.txt</text>
<text x="520" y="292" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="start" font-weight="normal">adds to the end of the file and</text>
<text x="520" y="314" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="start" font-weight="normal">leaves the existing contents alone</text>
<text x="415.0" y="362" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="normal">you can chain as many pipes as you like, and &amp;&amp; just runs the next command after the first one</text>
</svg>
