<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 330" width="850" height="330" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="850" height="330" fill="#ffffff"/>
<text x="425.0" y="32" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#1f2933" text-anchor="middle" font-weight="bold">Where to put each kind of ACL</text>
<rect x="30" y="140" width="140" height="62" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="100.0" y="176.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">Host A</text>
<path d="M 170,171 L 220,171" fill="none" stroke="#64748b" stroke-width="2"/>
<polygon points="209.8,165 209.8,177 220,171" fill="#64748b"/>
<rect x="195" y="140" width="140" height="62" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="265.0" y="176.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">R1</text>
<path d="M 335,171 L 385,171" fill="none" stroke="#64748b" stroke-width="2"/>
<polygon points="374.8,165 374.8,177 385,171" fill="#64748b"/>
<rect x="360" y="140" width="140" height="62" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="430.0" y="176.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">R2</text>
<path d="M 500,171 L 550,171" fill="none" stroke="#64748b" stroke-width="2"/>
<polygon points="539.8,165 539.8,177 550,171" fill="#64748b"/>
<rect x="525" y="140" width="140" height="62" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="595.0" y="176.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">R3</text>
<path d="M 665,171 L 715,171" fill="none" stroke="#64748b" stroke-width="2"/>
<polygon points="704.8,165 704.8,177 715,171" fill="#64748b"/>
<rect x="690" y="140" width="140" height="62" rx="6" fill="#fde68a" stroke="#334155" stroke-width="2"/>
<text x="760.0" y="176.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">Server</text>
<rect x="120" y="66" width="220" height="48" rx="6" fill="#fee2e2" stroke="#334155" stroke-width="2"/>
<text x="230" y="96" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#b91c1c" text-anchor="middle" font-weight="bold">Extended ACL</text>
<path d="M 230,114 L 230,138" fill="none" stroke="#b91c1c" stroke-width="2"/>
<polygon points="224,127.8 236,127.8 230,138" fill="#b91c1c"/>
<text x="230" y="240" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="normal">as close to the source as possible</text>
<text x="230" y="260" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="normal">so the traffic dies early</text>
<rect x="510" y="66" width="220" height="48" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="620" y="96" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#0f766e" text-anchor="middle" font-weight="bold">Standard ACL</text>
<path d="M 620,114 L 620,138" fill="none" stroke="#0f766e" stroke-width="2"/>
<polygon points="614,127.8 626,127.8 620,138" fill="#0f766e"/>
<text x="620" y="240" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="normal">as close to the destination as possible</text>
<text x="620" y="260" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="normal">because it only sees the source IP</text>
<text x="425.0" y="306" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="normal">a standard ACL filters on the source IPv4 address only, an extended one can use source, destination and ports</text>
</svg>
