<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="820" height="330" fill="#ffffff"/>
<text x="410.0" y="32" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#1f2933" text-anchor="middle" font-weight="bold">Which openssl key does which job</text>
<text x="524" y="74" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="normal">openssl rsa -pubout</text>
<rect x="50" y="86" width="200" height="52" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="150.0" y="117.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="normal">openssl genpkey</text>
<path d="M 250,112 L 296,112" fill="none" stroke="#64748b" stroke-width="2"/>
<polygon points="285.8,106 285.8,118 296,112" fill="#64748b"/>
<rect x="300" y="86" width="170" height="52" rx="6" fill="#fee2e2" stroke="#334155" stroke-width="2"/>
<text x="385.0" y="117.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">private.pem</text>
<path d="M 470,112 L 576,112" fill="none" stroke="#64748b" stroke-width="2"/>
<polygon points="565.8,106 565.8,118 576,112" fill="#64748b"/>
<rect x="580" y="86" width="170" height="52" rx="6" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
<text x="665.0" y="117.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">public.pem</text>
<rect x="275" y="166" width="220" height="96" rx="8" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 5"/>
<text x="385" y="192" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#b91c1c" text-anchor="middle" font-weight="bold">keep this one</text>
<text x="385" y="216" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">pkeyutl -decrypt</text>
<text x="385" y="240" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">dgst -sign</text>
<rect x="555" y="166" width="220" height="96" rx="8" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="6 5"/>
<text x="665" y="192" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1d4ed8" text-anchor="middle" font-weight="bold">hand this one out</text>
<text x="665" y="216" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">pkeyutl -encrypt</text>
<text x="665" y="240" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">dgst -verify</text>
<text x="410.0" y="296" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="normal">the public key locks and checks, the private key unlocks and proves it was you</text>
<text x="410.0" y="318" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="normal">symmetric work uses openssl enc instead, with one key file for both directions</text>
</svg>
