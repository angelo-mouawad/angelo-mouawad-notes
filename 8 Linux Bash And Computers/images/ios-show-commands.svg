<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="860" height="400" fill="#ffffff"/>
<text x="430" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">Where to look when something does not work</text>
<rect x="50" y="60" width="240" height="180" rx="10" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="170" y="88" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold">Layer 1 and 2</text>
<line x1="70" y1="100" x2="270" y2="100" stroke="#334155" stroke-width="1.5"/>
<text x="170" y="130" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">show ip interface brief</text>
<text x="170" y="164" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">show interfaces status</text>
<text x="170" y="198" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">show mac address-table</text>
<rect x="320" y="60" width="240" height="180" rx="10" fill="#fde68a" stroke="#334155" stroke-width="2"/>
<text x="440" y="88" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold">VLANs and trunks</text>
<line x1="340" y1="100" x2="540" y2="100" stroke="#334155" stroke-width="1.5"/>
<text x="440" y="130" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">show vlan brief</text>
<text x="440" y="164" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">show interfaces trunk</text>
<text x="440" y="198" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">show etherchannel summary</text>
<rect x="590" y="60" width="240" height="180" rx="10" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
<text x="710" y="88" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold">Layer 3</text>
<line x1="610" y1="100" x2="810" y2="100" stroke="#334155" stroke-width="1.5"/>
<text x="710" y="130" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">show ip route</text>
<text x="710" y="164" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">show ip ospf neighbor</text>
<text x="710" y="198" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">show ip nat translations</text>
<rect x="50" y="264" width="780" height="118" rx="8" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
<text x="70" y="290" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#0f766e" text-anchor="start" font-weight="normal">show running-config</text>
<text x="300" y="290" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">what is actually configured right now</text>
<text x="70" y="316" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#0f766e" text-anchor="start" font-weight="normal">show ip interface brief</text>
<text x="300" y="316" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">the fastest check, look for up and up</text>
<text x="70" y="344" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#b91c1c" text-anchor="start" font-weight="normal">administratively down means you forgot no shutdown</text>
<text x="70" y="366" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal">up, line protocol down usually means a layer 2 mismatch such as encapsulation</text>
</svg>
