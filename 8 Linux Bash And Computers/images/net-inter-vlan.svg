<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 410" width="850" height="410" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="850" height="410" fill="#ffffff"/>
<text x="425.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#1f2933" text-anchor="middle" font-weight="bold">Three ways to route between VLANs</text>
<rect x="20" y="50" width="250" height="322" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="145" y="78" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#0f766e" text-anchor="middle" font-weight="bold">Legacy routing</text>
<rect x="85" y="96" width="120" height="42" rx="6" fill="#fde68a" stroke="#334155" stroke-width="2"/>
<text x="145.0" y="122.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">Router</text>
<line x1="120" y1="138" x2="120" y2="178" stroke="#334155" stroke-width="2"/>
<line x1="170" y1="138" x2="170" y2="178" stroke="#334155" stroke-width="2"/>
<rect x="65" y="178" width="160" height="42" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="145.0" y="204.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">Switch</text>
<line x1="105" y1="220" x2="105" y2="250" stroke="#64748b" stroke-width="2"/>
<line x1="185" y1="220" x2="185" y2="250" stroke="#64748b" stroke-width="2"/>
<rect x="55" y="250" width="100" height="40" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="105.0" y="275.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">PC1</text>
<rect x="135" y="250" width="100" height="40" rx="6" fill="#fde68a" stroke="#334155" stroke-width="2"/>
<text x="185.0" y="275.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">PC2</text>
<text x="145" y="316" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="normal">one router interface</text>
<text x="145" y="335" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="normal">per VLAN, so it stops</text>
<text x="145" y="354" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="normal">at a handful</text>
<rect x="300" y="50" width="250" height="322" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="425" y="78" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#0f766e" text-anchor="middle" font-weight="bold">Router on a stick</text>
<rect x="365" y="96" width="120" height="42" rx="6" fill="#fde68a" stroke="#334155" stroke-width="2"/>
<text x="425.0" y="122.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">Router</text>
<line x1="425" y1="138" x2="425" y2="178" stroke="#334155" stroke-width="2"/>
<text x="468" y="162" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#0f766e" text-anchor="middle" font-weight="normal">trunk</text>
<rect x="345" y="178" width="160" height="42" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="425.0" y="204.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">Switch</text>
<line x1="385" y1="220" x2="385" y2="250" stroke="#64748b" stroke-width="2"/>
<line x1="465" y1="220" x2="465" y2="250" stroke="#64748b" stroke-width="2"/>
<rect x="335" y="250" width="100" height="40" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="385.0" y="275.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">PC1</text>
<rect x="415" y="250" width="100" height="40" rx="6" fill="#fde68a" stroke="#334155" stroke-width="2"/>
<text x="465.0" y="275.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">PC2</text>
<text x="425" y="316" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="normal">one trunked interface</text>
<text x="425" y="335" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="normal">with a subinterface</text>
<text x="425" y="354" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="normal">per VLAN</text>
<rect x="580" y="50" width="250" height="322" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="705" y="78" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#0f766e" text-anchor="middle" font-weight="bold">Layer 3 switch</text>
<rect x="625" y="130" width="160" height="90" rx="6" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
<text x="705.0" y="171.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">Layer 3 switch</text>
<text x="705.0" y="190.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal">SVI VLAN 10 and 20</text>
<line x1="665" y1="220" x2="665" y2="250" stroke="#64748b" stroke-width="2"/>
<line x1="745" y1="220" x2="745" y2="250" stroke="#64748b" stroke-width="2"/>
<rect x="615" y="250" width="100" height="40" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="665.0" y="275.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">PC1</text>
<rect x="695" y="250" width="100" height="40" rx="6" fill="#fde68a" stroke="#334155" stroke-width="2"/>
<text x="745.0" y="275.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">PC2</text>
<text x="705" y="316" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="normal">no router at all, an</text>
<text x="705" y="335" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="normal">SVI per VLAN on the</text>
<text x="705" y="354" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="normal">switch itself</text>
<text x="425.0" y="396" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="normal">legacy does not scale, router on a stick is fine for a small network, the layer 3 switch is the modern answer</text>
</svg>
