<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 370" width="820" height="370" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="820" height="370" fill="#ffffff"/>
<text x="410" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">What the port does when an unexpected MAC turns up</text>
<rect x="60" y="66" width="220" height="62" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="170" y="103" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">protect</text>
<text x="310" y="92" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">drops the offending frames</text>
<text x="310" y="114" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="start" font-weight="normal">no log, no counter, no warning</text>
<rect x="60" y="148" width="220" height="62" rx="8" fill="#fde68a" stroke="#334155" stroke-width="2"/>
<text x="170" y="185" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">restrict</text>
<text x="310" y="174" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">drops them and logs it</text>
<text x="310" y="196" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="start" font-weight="normal">syslog, SNMP trap, counter increments</text>
<rect x="60" y="230" width="220" height="62" rx="8" fill="#fee2e2" stroke="#334155" stroke-width="2"/>
<text x="170" y="267" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">shutdown</text>
<text x="310" y="256" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">err-disables the whole port</text>
<text x="310" y="278" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="start" font-weight="normal">the default, and it needs a manual reset</text>
<rect x="60" y="316" width="700" height="42" rx="8" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
<text x="410" y="342" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">a shut down port comes back with shutdown then no shutdown, nothing else clears it</text>
</svg>
