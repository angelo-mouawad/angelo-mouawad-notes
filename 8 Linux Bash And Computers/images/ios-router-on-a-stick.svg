<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" width="840" height="400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="840" height="400" fill="#ffffff"/>
<text x="420" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">One physical link, one subinterface per VLAN</text>
<rect x="60" y="150" width="160" height="80" rx="6" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
<text x="140.0" y="195.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">Router</text>
<line x1="220" y1="190" x2="380" y2="190" stroke="#0f766e" stroke-width="4"/>
<rect x="240" y="158" width="120" height="26" rx="13.0" fill="#ccfbf1" stroke="#334155" stroke-width="1.5"/>
<text x="300.0" y="175.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="normal">trunk</text>
<rect x="380" y="150" width="160" height="80" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="460.0" y="195.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">Switch</text>
<line x1="540" y1="190" x2="580" y2="190" stroke="#334155" stroke-width="1.8"/>
<line x1="580" y1="101" x2="580" y2="321" stroke="#334155" stroke-width="1.8"/>
<polyline points="580,101 616,101" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="616,101 608,94 608,108" fill="#334155"/>
<rect x="620" y="80" width="160" height="42" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="700.0" y="106.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">VLAN 10</text>
<polyline points="580,211 616,211" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="616,211 608,204 608,218" fill="#334155"/>
<rect x="620" y="190" width="160" height="42" rx="6" fill="#fde68a" stroke="#334155" stroke-width="2"/>
<text x="700.0" y="216.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">VLAN 20</text>
<polyline points="580,321 616,321" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="616,321 608,314 608,328" fill="#334155"/>
<rect x="620" y="300" width="160" height="42" rx="6" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
<text x="700.0" y="326.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">VLAN 30</text>
<rect x="60" y="250" width="460" height="128" rx="8" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
<text x="80" y="278" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">interface g0/0/1.10</text>
<text x="80" y="301" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#0f766e" text-anchor="start" font-weight="normal">  encapsulation dot1Q 10</text>
<text x="80" y="324" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#0f766e" text-anchor="start" font-weight="normal">  ip address 192.168.10.1 255.255.255.0</text>
<text x="80" y="347" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">interface g0/0/1</text>
<text x="80" y="370" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#0f766e" text-anchor="start" font-weight="normal">  no shutdown</text>
<text x="700" y="372" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal">each subinterface is the</text>
<text x="700" y="390" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal">gateway for its VLAN</text>
</svg>
