<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="900" height="400" fill="#ffffff"/>
<text x="450" y="34" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">Where an object sits relative to the persistence context</text>
<rect x="230" y="90" width="640" height="172" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2" stroke-dasharray="6 4"/>
<text x="550" y="114" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="bold">the persistence context, open for the length of the transaction</text>
<rect x="40" y="168" width="150" height="70" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="115.0" y="200.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">Transient</text>
<text x="115.0" y="219.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">a plain object</text>
<rect x="280" y="158" width="190" height="90" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="375.0" y="200.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="normal">Managed</text>
<text x="375.0" y="219.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">tracked, changes are saved</text>
<rect x="540" y="158" width="170" height="90" rx="6" fill="#fecaca" stroke="#334155" stroke-width="2"/>
<text x="625.0" y="200.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">Removed</text>
<text x="625.0" y="219.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">flagged for deletion</text>
<rect x="730" y="320" width="150" height="66" rx="6" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
<text x="805.0" y="350.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">Detached</text>
<text x="805.0" y="369.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">no longer tracked</text>
<path d="M 192,190 L 276,190" fill="none" stroke="#0f766e" stroke-width="2"/>
<polygon points="266.0,185.0 266.0,195.0 276,190" fill="#0f766e"/>
<text x="234" y="178" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#0f766e" text-anchor="middle" font-weight="normal">persist</text>
<path d="M 472,200 L 536,200" fill="none" stroke="#b91c1c" stroke-width="2"/>
<polygon points="526.0,195.0 526.0,205.0 536,200" fill="#b91c1c"/>
<text x="504" y="188" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="normal">remove</text>
<path d="M 660,250 L 660,288 L 770,288 L 770,316" fill="none" stroke="#64748b" stroke-width="2"/>
<polygon points="765.0,306.0 775.0,306.0 770,316" fill="#64748b"/>
<text x="688" y="306" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="end" font-weight="normal">flush and commit</text>
<path d="M 375,250 L 375,344 L 726,344" fill="none" stroke="#64748b" stroke-width="2"/>
<polygon points="716.0,339.0 716.0,349.0 726,344" fill="#64748b"/>
<text x="470" y="336" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal">the context closes</text>
<rect x="40" y="300" width="320" height="86" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<text x="200" y="324" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">dirty checking</text>
<text x="200" y="346" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">a managed entity that you change</text>
<text x="200" y="364" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">is written back with no save() call</text>
</svg>
