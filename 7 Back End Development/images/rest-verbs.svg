<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="880" height="360" fill="#ffffff"/>
<text x="440" y="34" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">The HTTP methods, and the annotation for each</text>
<rect x="40" y="62" width="130" height="42" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="105" y="89" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">GET</text>
<text x="200" y="89" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="start" font-weight="normal">read</text>
<rect x="320" y="62" width="210" height="42" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<text x="425" y="89" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#1d4ed8" text-anchor="middle" font-weight="normal">@GetMapping</text>
<text x="560" y="89" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="start" font-weight="normal">safe, changes nothing</text>
<rect x="40" y="114" width="130" height="42" rx="6" fill="#fde68a" stroke="#334155" stroke-width="2"/>
<text x="105" y="141" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">POST</text>
<text x="200" y="141" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="start" font-weight="normal">create</text>
<rect x="320" y="114" width="210" height="42" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<text x="425" y="141" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#1d4ed8" text-anchor="middle" font-weight="normal">@PostMapping</text>
<text x="560" y="141" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="start" font-weight="normal">run twice, two rows</text>
<rect x="40" y="166" width="130" height="42" rx="6" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
<text x="105" y="193" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">PUT</text>
<text x="200" y="193" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="start" font-weight="normal">replace</text>
<rect x="320" y="166" width="210" height="42" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<text x="425" y="193" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#1d4ed8" text-anchor="middle" font-weight="normal">@PutMapping</text>
<text x="560" y="193" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="start" font-weight="normal">run twice, same result</text>
<rect x="40" y="218" width="130" height="42" rx="6" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
<text x="105" y="245" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">PATCH</text>
<text x="200" y="245" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="start" font-weight="normal">update part</text>
<rect x="320" y="218" width="210" height="42" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<text x="425" y="245" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#1d4ed8" text-anchor="middle" font-weight="normal">@PatchMapping</text>
<text x="560" y="245" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="start" font-weight="normal">run twice, same result</text>
<rect x="40" y="270" width="130" height="42" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="105" y="297" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">DELETE</text>
<text x="200" y="297" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="start" font-weight="normal">remove</text>
<rect x="320" y="270" width="210" height="42" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<text x="425" y="297" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#1d4ed8" text-anchor="middle" font-weight="normal">@DeleteMapping</text>
<text x="560" y="297" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="start" font-weight="normal">run twice, same result</text>
<rect x="40" y="330" width="0" height="0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="0"/>
<text x="440" y="348" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">only POST is not idempotent, which is why a double click on a submit button matters</text>
</svg>
