<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="880" height="400" fill="#ffffff"/>
<text x="440" y="34" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">What actually travels over HTTP</text>
<rect x="40" y="58" width="390" height="310" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<text x="235" y="84" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#0f766e" text-anchor="middle" font-weight="bold">Request</text>
<rect x="64" y="98" width="340" height="76" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="234" y="122" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#0f766e" text-anchor="middle" font-weight="bold">start line</text>
<text x="234" y="148" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">POST /pony HTTP/1.1</text>
<rect x="64" y="184" width="340" height="84" rx="6" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
<text x="234" y="208" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#0f766e" text-anchor="middle" font-weight="bold">headers</text>
<text x="234" y="232" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">Content-Type: application/json</text>
<text x="234" y="252" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">Authorization: Bearer ...</text>
<rect x="64" y="278" width="340" height="76" rx="6" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="234" y="300" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#0f766e" text-anchor="middle" font-weight="bold">body</text>
<text x="234" y="324" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">{ "name": "Bella", "age": 4 }</text>
<text x="234" y="344" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#1d4ed8" text-anchor="middle" font-weight="normal">@RequestBody reads this</text>
<rect x="450" y="58" width="390" height="310" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<text x="645" y="84" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1d4ed8" text-anchor="middle" font-weight="bold">Response</text>
<rect x="474" y="98" width="340" height="76" rx="6" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
<text x="644" y="122" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1d4ed8" text-anchor="middle" font-weight="bold">status line</text>
<text x="644" y="148" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">HTTP/1.1 201 Created</text>
<rect x="474" y="184" width="340" height="84" rx="6" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
<text x="644" y="208" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1d4ed8" text-anchor="middle" font-weight="bold">headers</text>
<text x="644" y="232" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">Content-Type: application/json</text>
<text x="644" y="252" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">Set-Cookie: ...</text>
<rect x="474" y="278" width="340" height="76" rx="6" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="644" y="300" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1d4ed8" text-anchor="middle" font-weight="bold">body</text>
<text x="644" y="324" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">{ "id": 7, "name": "Bella" }</text>
<text x="644" y="344" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#1d4ed8" text-anchor="middle" font-weight="normal">what the method returned, as JSON</text>
</svg>
