<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="880" height="380" fill="#ffffff"/>
<text x="440" y="34" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">When the related entity is actually loaded</text>
<rect x="40" y="58" width="390" height="250" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<text x="235" y="84" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" fill="#0f766e" text-anchor="middle" font-weight="bold">EAGER</text>
<rect x="70" y="100" width="320" height="40" rx="6" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
<text x="230.0" y="125.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">findById(1L)</text>
<path d="M 230,140 L 230,158" fill="none" stroke="#0f766e" stroke-width="2"/>
<polygon points="225.0,148.0 235.0,148.0 230,158" fill="#0f766e"/>
<rect x="70" y="160" width="320" height="76" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="230" y="186" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">User and Profile, both loaded</text>
<text x="230" y="212" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">one query with a join</text>
<text x="235" y="262" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">simple, but you pay for data</text>
<text x="235" y="284" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">you may never use</text>
<rect x="450" y="58" width="390" height="250" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<text x="645" y="84" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" fill="#1d4ed8" text-anchor="middle" font-weight="bold">LAZY</text>
<rect x="480" y="100" width="320" height="40" rx="6" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
<text x="640.0" y="125.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">findById(1L)</text>
<path d="M 640,140 L 640,158" fill="none" stroke="#1d4ed8" stroke-width="2"/>
<polygon points="635.0,148.0 645.0,148.0 640,158" fill="#1d4ed8"/>
<rect x="480" y="160" width="320" height="76" rx="6" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
<text x="640" y="182" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">User only, Profile is a proxy</text>
<text x="640" y="206" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">a second query fires on</text>
<text x="640" y="222" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">user.getProfile()</text>
<text x="645" y="262" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">faster, but touching it outside</text>
<text x="645" y="284" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="normal">the transaction throws</text>
<rect x="140" y="326" width="600" height="40" rx="6" fill="#fde68a" stroke="#334155" stroke-width="2"/>
<text x="440" y="351" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">@OneToOne and @ManyToOne are EAGER by default, @OneToMany and @ManyToMany are LAZY</text>
</svg>
