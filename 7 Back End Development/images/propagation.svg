<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="880" height="340" fill="#ffffff"/>
<text x="440" y="34" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">What happens when a transaction calls a transaction</text>
<rect x="40" y="58" width="390" height="250" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<text x="235" y="84" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" fill="#0f766e" text-anchor="middle" font-weight="bold">REQUIRED</text>
<text x="235" y="104" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">the default</text>
<rect x="70" y="118" width="320" height="160" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
<text x="235" y="142" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="bold">transaction A</text>
<rect x="96" y="156" width="268" height="44" rx="6" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="230.0" y="183.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">method one</text>
<rect x="96" y="212" width="268" height="44" rx="6" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="230.0" y="239.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">method two joins it</text>
<text x="235" y="300" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">one transaction, one commit</text>
<rect x="450" y="58" width="390" height="250" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<text x="645" y="84" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" fill="#1d4ed8" text-anchor="middle" font-weight="bold">REQUIRES_NEW</text>
<text x="645" y="104" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">always its own</text>
<rect x="480" y="118" width="320" height="74" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
<text x="645" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="bold">transaction A, paused</text>
<rect x="506" y="150" width="268" height="34" rx="6" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="640.0" y="172.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">method one</text>
<rect x="480" y="200" width="320" height="78" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="645" y="222" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="bold">transaction B</text>
<rect x="506" y="232" width="268" height="34" rx="6" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="640.0" y="254.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">method two</text>
<text x="645" y="300" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">B can commit even if A rolls back</text>
</svg>
