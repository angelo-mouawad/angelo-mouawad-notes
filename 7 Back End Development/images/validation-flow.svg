<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="880" height="340" fill="#ffffff"/>
<text x="440" y="34" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">What @Valid does when the input is wrong</text>
<rect x="30" y="90" width="150" height="62" rx="6" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
<text x="105.0" y="118.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">the request</text>
<text x="105.0" y="137.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">JSON body</text>
<path d="M 182,121 L 208,121" fill="none" stroke="#334155" stroke-width="2"/>
<polygon points="198.0,116.0 198.0,126.0 208,121" fill="#334155"/>
<rect x="214" y="90" width="170" height="62" rx="6" fill="#fde68a" stroke="#334155" stroke-width="2"/>
<text x="299.0" y="118.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">@Valid</text>
<text x="299.0" y="137.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">checks the model</text>
<path d="M 302,152 L 302,182" fill="none" stroke="#0f766e" stroke-width="2"/>
<polygon points="297.0,172.0 307.0,172.0 302,182" fill="#0f766e"/>
<rect x="214" y="184" width="170" height="56" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="299.0" y="217.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="normal">it passes</text>
<path d="M 388,212 L 420,212" fill="none" stroke="#0f766e" stroke-width="2"/>
<polygon points="410.0,207.0 410.0,217.0 420,212" fill="#0f766e"/>
<rect x="426" y="184" width="200" height="56" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="526.0" y="217.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">the service runs</text>
<path d="M 388,121 L 414,121" fill="none" stroke="#b91c1c" stroke-width="2"/>
<polygon points="404.0,116.0 404.0,126.0 414,121" fill="#b91c1c"/>
<rect x="420" y="90" width="216" height="62" rx="6" fill="#fecaca" stroke="#334155" stroke-width="2"/>
<text x="528.0" y="118.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="normal">it fails</text>
<text x="528.0" y="137.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#1f2933" text-anchor="middle" font-weight="normal">MethodArgumentNotValidException</text>
<path d="M 640,121 L 662,121" fill="none" stroke="#b91c1c" stroke-width="2"/>
<polygon points="652.0,116.0 652.0,126.0 662,121" fill="#b91c1c"/>
<rect x="666" y="90" width="190" height="62" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
<text x="761.0" y="118.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">@ExceptionHandler</text>
<text x="761.0" y="137.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">catches it</text>
<path d="M 760,152 L 760,182" fill="none" stroke="#b91c1c" stroke-width="2"/>
<polygon points="755.0,172.0 765.0,172.0 760,182" fill="#b91c1c"/>
<rect x="666" y="184" width="190" height="56" rx="6" fill="#fecaca" stroke="#334155" stroke-width="2"/>
<text x="761.0" y="209.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">400 Bad Request</text>
<text x="761.0" y="228.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">with the field messages</text>
<rect x="30" y="268" width="826" height="56" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<text x="443" y="292" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">without a handler the exception escapes and the client gets 500 Internal Server Error</text>
<text x="443" y="312" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">which tells them your server broke, when really their input was wrong</text>
</svg>
