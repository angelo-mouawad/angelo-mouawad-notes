<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="880" height="300" fill="#ffffff"/>
<text x="440" y="34" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">The three parts of a JWT</text>
<rect x="40" y="62" width="250" height="130" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="165.0" y="92" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">Header</text>
<text x="165.0" y="120" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">which algorithm</text>
<rect x="60" y="136" width="210" height="38" rx="4" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="165.0" y="160" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">HS256</text>
<text x="305" y="134" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#1f2933" text-anchor="middle" font-weight="bold">.</text>
<rect x="320" y="62" width="250" height="130" rx="6" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
<text x="445.0" y="92" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">Payload</text>
<text x="445.0" y="120" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">the claims</text>
<rect x="340" y="136" width="210" height="38" rx="4" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="445.0" y="160" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">username, role, expiry</text>
<text x="585" y="134" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#1f2933" text-anchor="middle" font-weight="bold">.</text>
<rect x="600" y="62" width="240" height="130" rx="6" fill="#fde68a" stroke="#334155" stroke-width="2"/>
<text x="720.0" y="92" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">Signature</text>
<text x="720.0" y="120" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">proves it was not edited</text>
<rect x="620" y="136" width="200" height="38" rx="4" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="720.0" y="160" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">signed with the server key</text>
<rect x="40" y="210" width="800" height="32" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<text x="440" y="232" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJhbGkiLCJyb2xlIjoiQURNSU4ifQ.3xK_signature</text>
<text x="440" y="268" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="bold">the payload is encoded, not encrypted, so anyone can read it</text>
<text x="440" y="290" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">the signature is what stops them changing their role to ADMIN</text>
</svg>
