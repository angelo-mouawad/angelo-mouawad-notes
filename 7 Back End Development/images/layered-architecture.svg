<rect x="220" y="320" width="650" height="66" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<text x="545" y="344" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">each layer only talks to the one next to it</text>
<text x="545" y="366" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">the controller never touches the repository, and the repository knows nothing about HTTP</text>
