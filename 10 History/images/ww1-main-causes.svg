<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="850" height="420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="850" height="420" fill="#ffffff"/>
<text x="425.0" y="32" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#1f2933" text-anchor="middle" font-weight="bold">Why Europe was ready to fight</text>
<rect x="55" y="62" width="740" height="52" rx="6" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
<text x="425" y="94" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">Europe in 1914</text>
<rect x="55" y="114" width="160" height="160" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="135" y="152" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#0f766e" text-anchor="middle" font-weight="bold">M</text>
<text x="135" y="178" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">Militarism</text>
<text x="135" y="204" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal">an arms race, huge</text>
<text x="135" y="224" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal">standing armies, and</text>
<text x="135" y="244" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal">war plans on the shelf</text>
<rect x="245" y="114" width="160" height="160" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="325" y="152" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#0f766e" text-anchor="middle" font-weight="bold">A</text>
<text x="325" y="178" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">Alliances</text>
<text x="325" y="204" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal">two blocs that had</text>
<text x="325" y="224" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal">promised to turn up</text>
<text x="325" y="244" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal">for each other</text>
<rect x="435" y="114" width="160" height="160" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="515" y="152" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#0f766e" text-anchor="middle" font-weight="bold">I</text>
<text x="515" y="178" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">Imperialism</text>
<text x="515" y="204" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal">competition for colonies,</text>
<text x="515" y="224" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal">markets and prestige</text>
<text x="515" y="244" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal">outside Europe</text>
<rect x="625" y="114" width="160" height="160" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="705" y="152" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#0f766e" text-anchor="middle" font-weight="bold">N</text>
<text x="705" y="178" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">Nationalism</text>
<text x="705" y="204" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal">above all in the Balkans,</text>
<text x="705" y="224" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal">where Serbia wanted the</text>
<text x="705" y="244" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal">Slavs out of Austria</text>
<rect x="120" y="306" width="610" height="56" rx="6" fill="#fee2e2" stroke="#334155" stroke-width="2"/>
<text x="425" y="330" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#b91c1c" text-anchor="middle" font-weight="bold">28 June 1914, Sarajevo</text>
<text x="425" y="352" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">Archduke Franz Ferdinand is shot by Gavrilo Princip</text>
<text x="425.0" y="396" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="normal">none of the four causes started the war on its own, they made a local killing into a continental one</text>
</svg>
