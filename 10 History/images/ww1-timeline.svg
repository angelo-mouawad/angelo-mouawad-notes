<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 734" width="880" height="734" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="880" height="734" fill="#ffffff"/>
<text x="440.0" y="32" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#1f2933" text-anchor="middle" font-weight="bold">The war year by year</text>
<rect x="40" y="62" width="90" height="90" rx="4" fill="#fee2e2" stroke="#334155" stroke-width="2"/>
<text x="85" y="113.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">1914</text>
<text x="155" y="82" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">•  June, the assassination in Sarajevo</text>
<text x="155" y="112" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">•  August, the war begins and Germany invades Belgium</text>
<text x="155" y="142" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">•  September, the Marne halts the German advance and the trenches are dug</text>
<rect x="40" y="166" width="90" height="90" rx="4" fill="#fde68a" stroke="#334155" stroke-width="2"/>
<text x="85" y="217.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">1915</text>
<text x="155" y="186" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">•  April, poison gas is first used at Ypres</text>
<text x="155" y="216" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">•  Gallipoli, an Allied attempt on the Ottomans that fails</text>
<text x="155" y="246" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">•  Italy joins the Allies</text>
<rect x="40" y="270" width="90" height="120" rx="4" fill="#fde68a" stroke="#334155" stroke-width="2"/>
<text x="85" y="336.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">1916</text>
<text x="155" y="290" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">•  February to December, Verdun</text>
<text x="155" y="320" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">•  July to November, the Somme</text>
<text x="155" y="350" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">•  May, Jutland, the only full fleet battle of the war</text>
<text x="155" y="380" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">•  June, the Brusilov offensive on the Eastern Front</text>
<rect x="40" y="404" width="90" height="90" rx="4" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="85" y="455.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">1917</text>
<text x="155" y="424" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">•  February, unrestricted submarine warfare resumes</text>
<text x="155" y="454" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">•  April, the United States declares war</text>
<text x="155" y="484" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">•  October, the Bolsheviks take power in Russia</text>
<rect x="40" y="508" width="90" height="120" rx="4" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
<text x="85" y="574.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">1918</text>
<text x="155" y="528" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">•  March, Brest-Litovsk takes Russia out of the war</text>
<text x="155" y="558" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">•  March to July, the German Spring Offensive, and it fails</text>
<text x="155" y="588" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">•  August onward, the Hundred Days push Germany back</text>
<text x="155" y="618" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">•  11 November, the armistice</text>
<rect x="40" y="642" width="90" height="30" rx="4" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
<text x="85" y="663.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">1919</text>
<text x="155" y="662" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">•  28 June, the Treaty of Versailles is signed</text>
<text x="440.0" y="714" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="normal">around 9 to 10 million soldiers died, and a similar number of civilians</text>
</svg>
