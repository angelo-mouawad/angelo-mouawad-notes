<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 430" width="850" height="430" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="850" height="430" fill="#ffffff"/>
<text x="425.0" y="32" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#1f2933" text-anchor="middle" font-weight="bold">What the Taif Agreement changed in 1989</text>
<rect x="30" y="60" width="380" height="250" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<rect x="30" y="60" width="380" height="46" rx="0" fill="#fee2e2" stroke="#334155" stroke-width="2"/>
<text x="220" y="90" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">Before, under the National Pact</text>
<text x="50" y="138" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">•  the president held real executive power</text>
<text x="50" y="180" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">•  the president appointed the prime minister</text>
<text x="50" y="222" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">•  parliament was 6 Christian to 5 Muslim</text>
<text x="50" y="264" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">•  the pact was unwritten and easy to argue about</text>
<rect x="440" y="60" width="380" height="250" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<rect x="440" y="60" width="380" height="46" rx="0" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="630" y="90" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">After, under Taif</text>
<text x="460" y="138" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">•  executive power moves to the cabinet</text>
<text x="460" y="180" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">•  parliament chooses the prime minister</text>
<text x="460" y="222" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">•  parliament is 50 Christian to 50 Muslim</text>
<text x="460" y="264" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">•  the terms are written into the constitution</text>
<text x="425.0" y="348" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="normal">Taif also let Syrian forces stay for a transitional period, and every militia</text>
<text x="425.0" y="372" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="normal">handed in its weapons except Hezbollah, which argued it was resisting an occupation</text>
<text x="425.0" y="404" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="normal">brokered by Saudi Arabia, backed by the United States and Syria, signed 22 October 1989</text>
</svg>
