<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 794" width="900" height="794" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="900" height="794" fill="#ffffff"/>
<text x="450.0" y="32" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#1f2933" text-anchor="middle" font-weight="bold">Lebanon from the Ottomans to 2006</text>
<line x1="140" y1="58" x2="140" y2="722" stroke="#64748b" stroke-width="2"/>
<text x="118" y="71" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="end" font-weight="bold">1516</text>
<circle cx="140" cy="66" r="6" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
<text x="166" y="71" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">The Ottomans take the Levant, and Mount Lebanon is ruled from Istanbul for four centuries</text>
<text x="118" y="107" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="end" font-weight="bold">1920</text>
<circle cx="140" cy="102" r="6" fill="#ede9fe" stroke="#334155" stroke-width="2"/>
<text x="166" y="107" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">France proclaims Greater Lebanon after the Ottoman collapse, the Mandate follows in 1923</text>
<text x="118" y="143" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="end" font-weight="bold">1932</text>
<circle cx="140" cy="138" r="6" fill="#ede9fe" stroke="#334155" stroke-width="2"/>
<text x="166" y="143" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">The census puts Christians at a narrow majority, and it is never repeated</text>
<text x="118" y="179" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="end" font-weight="bold">1943</text>
<circle cx="140" cy="174" r="6" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="166" y="179" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">Independence, and the unwritten National Pact divides the top three offices</text>
<text x="118" y="215" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="end" font-weight="bold">1948</text>
<circle cx="140" cy="210" r="6" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="166" y="215" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">Lebanon joins the Arab war against the new state of Israel, refugees arrive</text>
<text x="118" y="251" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="end" font-weight="bold">1952</text>
<circle cx="140" cy="246" r="6" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="166" y="251" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">Camille Chamoun becomes president and leans towards the West</text>
<text x="118" y="287" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="end" font-weight="bold">1958</text>
<circle cx="140" cy="282" r="6" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="166" y="287" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">A short civil conflict, US marines land, and Fouad Chehab takes over</text>
<text x="118" y="323" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="end" font-weight="bold">1969</text>
<circle cx="140" cy="318" r="6" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="166" y="323" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">The Cairo Agreement hands the PLO control of the camps and the right to strike Israel</text>
<text x="118" y="359" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="end" font-weight="bold">1970</text>
<circle cx="140" cy="354" r="6" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="166" y="359" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">Jordan expels the PLO after Black September, and its leadership moves to Beirut</text>
<text x="118" y="395" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="end" font-weight="bold">1975</text>
<circle cx="140" cy="390" r="6" fill="#fee2e2" stroke="#334155" stroke-width="2"/>
<text x="166" y="395" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">13 April, the Ain el-Remmaneh incidents, and the civil war begins</text>
<text x="118" y="431" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="end" font-weight="bold">1976</text>
<circle cx="140" cy="426" r="6" fill="#fee2e2" stroke="#334155" stroke-width="2"/>
<text x="166" y="431" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">Syria intervenes, at first on the side of the Christian militias</text>
<text x="118" y="467" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="end" font-weight="bold">1978</text>
<circle cx="140" cy="462" r="6" fill="#fee2e2" stroke="#334155" stroke-width="2"/>
<text x="166" y="467" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">Israel's Operation Litani, and the UN sends UNIFIL to the south</text>
<text x="118" y="503" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="end" font-weight="bold">1982</text>
<circle cx="140" cy="498" r="6" fill="#fee2e2" stroke="#334155" stroke-width="2"/>
<text x="166" y="503" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">Israel invades, Bachir Gemayel is killed, Sabra and Shatila, Hezbollah forms</text>
<text x="118" y="539" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="end" font-weight="bold">1989</text>
<circle cx="140" cy="534" r="6" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
<text x="166" y="539" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">The Taif Agreement is signed in Saudi Arabia and rebalances the state</text>
<text x="118" y="575" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="end" font-weight="bold">1990</text>
<circle cx="140" cy="570" r="6" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
<text x="166" y="575" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">13 October, the fighting finally stops after fifteen years</text>
<text x="118" y="611" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="end" font-weight="bold">1991</text>
<circle cx="140" cy="606" r="6" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
<text x="166" y="611" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">A general amnesty law pardons almost every crime of the war</text>
<text x="118" y="647" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="end" font-weight="bold">2000</text>
<circle cx="140" cy="642" r="6" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
<text x="166" y="647" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">Israel withdraws from the south, Hezbollah keeps its weapons</text>
<text x="118" y="683" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="end" font-weight="bold">2005</text>
<circle cx="140" cy="678" r="6" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
<text x="166" y="683" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">Rafik Hariri is assassinated, and Syrian troops leave two months later</text>
<text x="118" y="719" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="end" font-weight="bold">2006</text>
<circle cx="140" cy="714" r="6" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
<text x="166" y="719" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">The July War, thirty four days between Israel and Hezbollah</text>
<text x="450.0" y="768" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="normal">grey is Ottoman, purple is the French Mandate, green is the independent republic, red is the civil war, blue is what came after</text>
</svg>
