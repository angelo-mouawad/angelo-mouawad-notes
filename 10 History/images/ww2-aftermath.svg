<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="920" height="440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="920" height="440" fill="#ffffff"/>
<text x="460.0" y="32" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#1f2933" text-anchor="middle" font-weight="bold">What the war left behind</text>
<text x="215" y="66" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold">Germany split into four zones</text>
<rect x="60" y="82" width="150" height="84" rx="6" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
<text x="135.0" y="129.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="normal">American</text>
<rect x="215" y="82" width="150" height="84" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="290.0" y="129.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="normal">British</text>
<rect x="60" y="172" width="150" height="84" rx="6" fill="#ede9fe" stroke="#334155" stroke-width="2"/>
<text x="135.0" y="219.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="normal">French</text>
<rect x="215" y="172" width="150" height="84" rx="6" fill="#fee2e2" stroke="#334155" stroke-width="2"/>
<text x="290.0" y="219.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="normal">Soviet</text>
<rect x="75" y="268" width="280" height="60" rx="6" fill="#fde68a" stroke="#334155" stroke-width="2"/>
<text x="215" y="292" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">Berlin, deep inside the Soviet zone,</text>
<text x="215" y="312" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">was itself divided into the same four</text>
<text x="420" y="66" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="start" font-weight="bold">and everything else</text>
<text x="420" y="96" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">•  between 70 and 85 million people died, most of them civilians</text>
<text x="420" y="126" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">•  six million Jews were murdered in the Holocaust, along with Roma,</text>
<text x="420" y="156" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">•  disabled people, Soviet prisoners and political prisoners</text>
<text x="420" y="186" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">•  the United Nations was founded in 1945 to replace the League</text>
<text x="420" y="216" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">•  the Nuremberg trials created the idea of crimes against humanity</text>
<text x="420" y="246" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">•  Europe split into a western and an eastern bloc, and the Cold War began</text>
<text x="420" y="276" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">•  the colonial empires started to come apart within a decade</text>
<text x="460.0" y="400" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="normal">the United States and the Soviet Union came out of it as the only two powers that mattered,</text>
<text x="460.0" y="424" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="normal">which is the single fact that shaped the next forty five years</text>
</svg>
