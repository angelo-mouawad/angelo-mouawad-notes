<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 564" width="900" height="564" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="900" height="564" fill="#ffffff"/>
<text x="450.0" y="32" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#1f2933" text-anchor="middle" font-weight="bold">The road to war, 1931 to 1939</text>
<line x1="140" y1="58" x2="140" y2="492" stroke="#64748b" stroke-width="2"/>
<text x="118" y="71" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="end" font-weight="bold">1931</text>
<circle cx="140" cy="66" r="6" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
<text x="166" y="71" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">Japan invades Manchuria, and the League of Nations does nothing that matters</text>
<text x="118" y="109" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="end" font-weight="bold">1933</text>
<circle cx="140" cy="104" r="6" fill="#fee2e2" stroke="#334155" stroke-width="2"/>
<text x="166" y="109" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">Hitler becomes Chancellor in January, and Germany leaves the League</text>
<text x="118" y="147" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="end" font-weight="bold">1935</text>
<circle cx="140" cy="142" r="6" fill="#fee2e2" stroke="#334155" stroke-width="2"/>
<text x="166" y="147" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">Italy invades Abyssinia, and Germany announces it is rearming openly</text>
<text x="118" y="185" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="end" font-weight="bold">1936</text>
<circle cx="140" cy="180" r="6" fill="#fee2e2" stroke="#334155" stroke-width="2"/>
<text x="166" y="185" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">German troops walk back into the demilitarised Rhineland, unopposed</text>
<text x="118" y="223" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="end" font-weight="bold">1936</text>
<circle cx="140" cy="218" r="6" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
<text x="166" y="223" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">The Spanish Civil War begins, and becomes a testing ground for German weapons</text>
<text x="118" y="261" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="end" font-weight="bold">1937</text>
<circle cx="140" cy="256" r="6" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
<text x="166" y="261" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">Japan launches a full war against China</text>
<text x="118" y="299" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="end" font-weight="bold">1938</text>
<circle cx="140" cy="294" r="6" fill="#fee2e2" stroke="#334155" stroke-width="2"/>
<text x="166" y="299" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">March, the Anschluss, Austria is absorbed into Germany</text>
<text x="118" y="337" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="end" font-weight="bold">1938</text>
<circle cx="140" cy="332" r="6" fill="#fde68a" stroke="#334155" stroke-width="2"/>
<text x="166" y="337" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">September, Munich hands Germany the Sudetenland to keep the peace</text>
<text x="118" y="375" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="end" font-weight="bold">1939</text>
<circle cx="140" cy="370" r="6" fill="#fee2e2" stroke="#334155" stroke-width="2"/>
<text x="166" y="375" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">March, Germany takes the rest of Czechoslovakia, and appeasement is over</text>
<text x="118" y="413" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="end" font-weight="bold">1939</text>
<circle cx="140" cy="408" r="6" fill="#fee2e2" stroke="#334155" stroke-width="2"/>
<text x="166" y="413" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">23 August, the Nazi-Soviet Pact secretly divides Poland</text>
<text x="118" y="451" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="end" font-weight="bold">1939</text>
<circle cx="140" cy="446" r="6" fill="#b91c1c" stroke="#334155" stroke-width="2"/>
<text x="166" y="451" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">1 September, Germany invades Poland</text>
<text x="118" y="489" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="end" font-weight="bold">1939</text>
<circle cx="140" cy="484" r="6" fill="#b91c1c" stroke="#334155" stroke-width="2"/>
<text x="166" y="489" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">3 September, Britain and France declare war on Germany</text>
<text x="450.0" y="538" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="normal">each step was allowed to pass, and each one made the next step cheaper to take</text>
</svg>
