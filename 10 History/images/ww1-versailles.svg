<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 470" width="870" height="470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="870" height="470" fill="#ffffff"/>
<text x="435.0" y="32" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#1f2933" text-anchor="middle" font-weight="bold">The Treaty of Versailles, June 1919</text>
<rect x="30" y="62" width="390" height="150" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<rect x="30" y="62" width="390" height="40" rx="0" fill="#fee2e2" stroke="#334155" stroke-width="2"/>
<text x="225" y="89" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">Guilt</text>
<text x="225" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">Article 231 put the blame for the</text>
<text x="225" y="156" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">whole war on Germany and its allies,</text>
<text x="225" y="180" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">and it was the legal basis for the rest</text>
<rect x="450" y="62" width="390" height="150" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<rect x="450" y="62" width="390" height="40" rx="0" fill="#fee2e2" stroke="#334155" stroke-width="2"/>
<text x="645" y="89" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">Reparations</text>
<text x="645" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">132 billion gold marks, set in 1921,</text>
<text x="645" y="156" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">on an economy already wrecked</text>
<text x="645" y="180" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">by four years of war</text>
<rect x="30" y="232" width="390" height="150" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<rect x="30" y="232" width="390" height="40" rx="0" fill="#fde68a" stroke="#334155" stroke-width="2"/>
<text x="225" y="259" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">Territory</text>
<text x="225" y="302" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">Alsace-Lorraine back to France,</text>
<text x="225" y="326" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">land to Poland, Belgium and Denmark,</text>
<text x="225" y="350" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">and every colony gone</text>
<rect x="450" y="232" width="390" height="150" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<rect x="450" y="232" width="390" height="40" rx="0" fill="#fde68a" stroke="#334155" stroke-width="2"/>
<text x="645" y="259" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">Military</text>
<text x="645" y="302" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">army capped at 100,000 men,</text>
<text x="645" y="326" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">no tanks, submarines or air force,</text>
<text x="645" y="350" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">and the Rhineland demilitarised</text>
<rect x="30" y="400" width="810" height="46" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="435" y="429" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="normal">and the League of Nations, which the United States never joined</text>
<text x="435.0" y="464" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="normal">four empires were gone by the end, the German, Austro-Hungarian, Russian and Ottoman</text>
</svg>
