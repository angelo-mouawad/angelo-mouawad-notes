<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 672" width="900" height="672" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="900" height="672" fill="#ffffff"/>
<text x="450.0" y="32" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#1f2933" text-anchor="middle" font-weight="bold">The war in the Pacific</text>
<rect x="40" y="62" width="90" height="30" rx="4" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
<text x="85" y="83.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">1931</text>
<text x="155" y="82" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">•  Japan takes Manchuria and sets up a puppet state</text>
<rect x="40" y="106" width="90" height="30" rx="4" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
<text x="85" y="127.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">1937</text>
<text x="155" y="126" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">•  full scale war with China begins</text>
<rect x="40" y="150" width="90" height="60" rx="4" fill="#fde68a" stroke="#334155" stroke-width="2"/>
<text x="85" y="186.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">1940</text>
<text x="155" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">•  Japan moves into French Indochina</text>
<text x="155" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">•  the United States answers with an oil and scrap metal embargo</text>
<rect x="40" y="224" width="90" height="30" rx="4" fill="#fee2e2" stroke="#334155" stroke-width="2"/>
<text x="85" y="245.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">1941</text>
<text x="155" y="244" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">•  7 December, Pearl Harbor, and the United States enters the war</text>
<rect x="40" y="268" width="90" height="90" rx="4" fill="#fde68a" stroke="#334155" stroke-width="2"/>
<text x="85" y="319.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">1942</text>
<text x="155" y="288" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">•  Japanese expansion peaks across South East Asia and the Pacific</text>
<text x="155" y="318" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">•  May, Coral Sea, the first carrier battle</text>
<text x="155" y="348" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">•  June, Midway, and the tide turns</text>
<rect x="40" y="372" width="90" height="30" rx="4" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="85" y="393.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">1943</text>
<text x="155" y="392" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">•  island hopping begins, bypassing strongholds instead of taking them</text>
<rect x="40" y="416" width="90" height="30" rx="4" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="85" y="437.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">1944</text>
<text x="155" y="436" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">•  October, Leyte Gulf, the largest naval battle in history</text>
<rect x="40" y="460" width="90" height="150" rx="4" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
<text x="85" y="541.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">1945</text>
<text x="155" y="480" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">•  February to March, Iwo Jima</text>
<text x="155" y="510" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">•  April to June, Okinawa</text>
<text x="155" y="540" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">•  6 and 9 August, atomic bombs on Hiroshima and Nagasaki</text>
<text x="155" y="570" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">•  9 August, the Soviet Union invades Manchuria</text>
<text x="155" y="600" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">•  15 August, Japan announces surrender, signed 2 September</text>
<text x="450.0" y="652" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="normal">the Pacific war started earlier than the European one and ended a few months later</text>
</svg>
