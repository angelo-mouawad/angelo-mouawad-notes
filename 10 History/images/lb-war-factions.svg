<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="880" height="520" fill="#ffffff"/>
<text x="440.0" y="32" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#1f2933" text-anchor="middle" font-weight="bold">Who was fighting, and who was behind them</text>
<rect x="35" y="60" width="300" height="44" rx="0" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
<text x="185.0" y="87.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">Militia or group</text>
<rect x="335" y="60" width="210" height="44" rx="0" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
<text x="440.0" y="87.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">Mainly</text>
<rect x="545" y="60" width="300" height="44" rx="0" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
<text x="695.0" y="87.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">Backed at some point by</text>
<rect x="35" y="104" width="300" height="44" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="185.0" y="131.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">Kataeb and the Lebanese Forces</text>
<rect x="335" y="104" width="210" height="44" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="440.0" y="131.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">Maronite Christian</text>
<rect x="545" y="104" width="300" height="44" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="695.0" y="131.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">Syria 1976, then Israel from 1982</text>
<rect x="35" y="148" width="300" height="44" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="185.0" y="175.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">National Liberal Party, the Tigers</text>
<rect x="335" y="148" width="210" height="44" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="440.0" y="175.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">Maronite Christian</text>
<rect x="545" y="148" width="300" height="44" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="695.0" y="175.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">largely on its own</text>
<rect x="35" y="192" width="300" height="44" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="185.0" y="219.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">Lebanese National Movement</text>
<rect x="335" y="192" width="210" height="44" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="440.0" y="219.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">Sunni, Druze and leftist</text>
<rect x="545" y="192" width="300" height="44" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="695.0" y="219.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">Libya, Iraq, the Soviet bloc</text>
<rect x="35" y="236" width="300" height="44" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="185.0" y="263.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">Progressive Socialist Party</text>
<rect x="335" y="236" width="210" height="44" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="440.0" y="263.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">Druze</text>
<rect x="545" y="236" width="300" height="44" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="695.0" y="263.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">the Soviet bloc, later Syria</text>
<rect x="35" y="280" width="300" height="44" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="185.0" y="307.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">Amal Movement</text>
<rect x="335" y="280" width="210" height="44" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="440.0" y="307.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">Shia</text>
<rect x="545" y="280" width="300" height="44" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="695.0" y="307.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">Syria</text>
<rect x="35" y="324" width="300" height="44" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="185.0" y="351.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">Hezbollah, formed 1982</text>
<rect x="335" y="324" width="210" height="44" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="440.0" y="351.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">Shia</text>
<rect x="545" y="324" width="300" height="44" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="695.0" y="351.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">Iran, and Syria as the route in</text>
<rect x="35" y="368" width="300" height="44" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="185.0" y="395.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">Palestine Liberation Organisation</text>
<rect x="335" y="368" width="210" height="44" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="440.0" y="395.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">Palestinian</text>
<rect x="545" y="368" width="300" height="44" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="695.0" y="395.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">Arab states, until it was expelled</text>
<rect x="35" y="412" width="300" height="44" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="185.0" y="439.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">South Lebanon Army</text>
<rect x="335" y="412" width="210" height="44" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="440.0" y="439.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">mixed, Christian led</text>
<rect x="545" y="412" width="300" height="44" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="695.0" y="439.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">Israel</text>
<text x="440.0" y="472" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="normal">Syria changed sides more than once. The aim was never that one faction should win,</text>
<text x="440.0" y="496" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="normal">it was that nobody else should end up with more influence over Lebanon than Syria had</text>
</svg>
