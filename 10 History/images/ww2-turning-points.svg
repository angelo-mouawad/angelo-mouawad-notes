<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="860" height="430" fill="#ffffff"/>
<text x="430.0" y="32" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#1f2933" text-anchor="middle" font-weight="bold">The five battles that turned it</text>
<rect x="15" y="62" width="270" height="150" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<rect x="15" y="62" width="270" height="40" rx="0" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="150" y="89" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">Battle of Britain</text>
<text x="150" y="124" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="normal">Jul to Oct 1940</text>
<text x="150" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal">the RAF holds, so there is no</text>
<text x="150" y="169" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal">invasion of Britain and no</text>
<text x="150" y="188" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal">quick end in the west</text>
<rect x="295" y="62" width="270" height="150" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<rect x="295" y="62" width="270" height="40" rx="0" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="430" y="89" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">Midway</text>
<text x="430" y="124" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="normal">June 1942</text>
<text x="430" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal">four Japanese carriers lost in</text>
<text x="430" y="169" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal">a day, and Japan never regains</text>
<text x="430" y="188" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal">the initiative</text>
<rect x="575" y="62" width="270" height="150" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<rect x="575" y="62" width="270" height="40" rx="0" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="710" y="89" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">El Alamein</text>
<text x="710" y="124" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="normal">Oct to Nov 1942</text>
<text x="710" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal">the Axis advance on Egypt and</text>
<text x="710" y="169" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal">the Suez Canal is stopped for</text>
<text x="710" y="188" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal">good</text>
<rect x="155" y="230" width="270" height="150" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<rect x="155" y="230" width="270" height="40" rx="0" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="290" y="257" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">Stalingrad</text>
<text x="290" y="292" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="normal">Aug 1942 to Feb 1943</text>
<text x="290" y="318" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal">an entire German army</text>
<text x="290" y="337" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal">destroyed, and the Eastern</text>
<text x="290" y="356" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal">Front never swings back</text>
<rect x="435" y="230" width="270" height="150" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<rect x="435" y="230" width="270" height="40" rx="0" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="570" y="257" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">Kursk</text>
<text x="570" y="292" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="normal">July 1943</text>
<text x="570" y="318" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal">the last German offensive in</text>
<text x="570" y="337" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal">the east fails, and from here</text>
<text x="570" y="356" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal">they only retreat</text>
<text x="430.0" y="412" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="normal">after 1942 the question stopped being who would win and became how long it would take</text>
</svg>
