<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 525" width="850" height="525" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="850" height="525" fill="#ffffff"/>
<text x="425.0" y="32" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#1f2933" text-anchor="middle" font-weight="bold">The two wars side by side</text>
<rect x="30" y="58" width="230" height="39" rx="0" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
<text x="145.0" y="82.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold"></text>
<rect x="260" y="58" width="280" height="39" rx="0" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
<text x="400.0" y="82.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">First World War</text>
<rect x="540" y="58" width="280" height="39" rx="0" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
<text x="680.0" y="82.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">Second World War</text>
<rect x="30" y="97" width="230" height="39" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="145.0" y="121.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">Dates</text>
<rect x="260" y="97" width="280" height="39" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="400.0" y="121.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">1914 to 1918</text>
<rect x="540" y="97" width="280" height="39" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="680.0" y="121.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">1939 to 1945</text>
<rect x="30" y="136" width="230" height="39" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="145.0" y="160.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">Trigger</text>
<rect x="260" y="136" width="280" height="39" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="400.0" y="160.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">an assassination in Sarajevo</text>
<rect x="540" y="136" width="280" height="39" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="680.0" y="160.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">the invasion of Poland</text>
<rect x="30" y="175" width="230" height="39" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="145.0" y="199.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">Root cause</text>
<rect x="260" y="175" width="280" height="39" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="400.0" y="199.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">alliances and rivalry</text>
<rect x="540" y="175" width="280" height="39" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="680.0" y="199.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">the unfinished business of the first</text>
<rect x="30" y="214" width="230" height="39" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="145.0" y="238.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">How it was fought</text>
<rect x="260" y="214" width="280" height="39" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="400.0" y="238.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">static, trenches, attrition</text>
<rect x="540" y="214" width="280" height="39" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="680.0" y="238.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">mobile, armour and aircraft</text>
<rect x="30" y="253" width="230" height="39" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="145.0" y="277.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">Main theatres</text>
<rect x="260" y="253" width="280" height="39" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="400.0" y="277.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">Europe and the Middle East</text>
<rect x="540" y="253" width="280" height="39" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="680.0" y="277.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">Europe, Africa, Asia and the Pacific</text>
<rect x="30" y="292" width="230" height="39" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="145.0" y="316.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">Deaths</text>
<rect x="260" y="292" width="280" height="39" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="400.0" y="316.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">around 20 million</text>
<rect x="540" y="292" width="280" height="39" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="680.0" y="316.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">70 to 85 million</text>
<rect x="30" y="331" width="230" height="39" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="145.0" y="355.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">Civilian share</text>
<rect x="260" y="331" width="280" height="39" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="400.0" y="355.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">roughly half</text>
<rect x="540" y="331" width="280" height="39" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="680.0" y="355.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">the clear majority</text>
<rect x="30" y="370" width="230" height="39" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="145.0" y="394.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">New weapons</text>
<rect x="260" y="370" width="280" height="39" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="400.0" y="394.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">machine gun, gas, tank, aircraft</text>
<rect x="540" y="370" width="280" height="39" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="680.0" y="394.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">radar, rockets, nuclear weapons</text>
<rect x="30" y="409" width="230" height="39" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="145.0" y="433.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">How it ended</text>
<rect x="260" y="409" width="280" height="39" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="400.0" y="433.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">an armistice, no occupation</text>
<rect x="540" y="409" width="280" height="39" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="680.0" y="433.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">unconditional surrender</text>
<rect x="30" y="448" width="230" height="39" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="145.0" y="472.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">What followed</text>
<rect x="260" y="448" width="280" height="39" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="400.0" y="472.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">Versailles and the League</text>
<rect x="540" y="448" width="280" height="39" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="680.0" y="472.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">the United Nations and the Cold War</text>
<text x="425.0" y="510" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="normal">the first war ended with a treaty the losers never accepted, the second ended with the losers occupied</text>
</svg>
