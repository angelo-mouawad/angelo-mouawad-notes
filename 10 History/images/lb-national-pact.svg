<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 400" width="830" height="400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="830" height="400" fill="#ffffff"/>
<text x="415.0" y="32" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#1f2933" text-anchor="middle" font-weight="bold">The National Pact of 1943</text>
<text x="415.0" y="56" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="normal">an unwritten agreement, never a law, and it is still how the state is staffed</text>
<rect x="25" y="80" width="240" height="100" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="145.0" y="126.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">President</text>
<text x="145.0" y="145.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="normal">Maronite Christian</text>
<rect x="290" y="80" width="240" height="100" rx="6" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
<text x="410.0" y="126.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">Prime Minister</text>
<text x="410.0" y="145.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="normal">Sunni Muslim</text>
<rect x="555" y="80" width="240" height="100" rx="6" fill="#fde68a" stroke="#334155" stroke-width="2"/>
<text x="675.0" y="126.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">Speaker of Parliament</text>
<text x="675.0" y="145.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="normal">Shia Muslim</text>
<text x="415.0" y="216" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="normal">and parliament was split 6 to 5 in favour of Christians</text>
<rect x="110" y="232" width="50" height="44" rx="4" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<rect x="165" y="232" width="50" height="44" rx="4" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<rect x="220" y="232" width="50" height="44" rx="4" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<rect x="275" y="232" width="50" height="44" rx="4" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<rect x="330" y="232" width="50" height="44" rx="4" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<rect x="385" y="232" width="50" height="44" rx="4" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<rect x="440" y="232" width="50" height="44" rx="4" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
<rect x="495" y="232" width="50" height="44" rx="4" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
<rect x="550" y="232" width="50" height="44" rx="4" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
<rect x="605" y="232" width="50" height="44" rx="4" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
<rect x="660" y="232" width="50" height="44" rx="4" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
<text x="275" y="300" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="normal">6 Christian</text>
<text x="605" y="300" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1d4ed8" text-anchor="middle" font-weight="normal">5 Muslim</text>
<text x="415.0" y="344" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="normal">the ratio came from the 1932 census, the only one Lebanon has ever completed</text>
<text x="415.0" y="368" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="normal">Taif changed it to 50 and 50 in 1989, but the three offices stayed exactly as they were</text>
</svg>
