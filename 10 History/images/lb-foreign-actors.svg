<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="880" height="470" fill="#ffffff"/>
<text x="440.0" y="32" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#1f2933" text-anchor="middle" font-weight="bold">Everyone with a stake in Lebanon</text>
<circle cx="440" cy="240" r="82" fill="#fde68a" stroke="#334155" stroke-width="2"/>
<text x="440" y="246" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#1f2933" text-anchor="middle" font-weight="bold">Lebanon</text>
<rect x="40" y="56" width="250" height="84" rx="6" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
<text x="165.0" y="84" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">Syria</text>
<text x="165.0" y="106" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal">next door, and never willing</text>
<text x="165.0" y="124" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal">to let anyone else lead</text>
<path d="M 165.0,140 L 359.17776557999446,210.61009657454343" fill="none" stroke="#64748b" stroke-width="2"/>
<rect x="590" y="56" width="250" height="84" rx="6" fill="#fee2e2" stroke="#334155" stroke-width="2"/>
<text x="715.0" y="84" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">Israel</text>
<text x="715.0" y="106" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal">invaded in 1978 and 1982,</text>
<text x="715.0" y="124" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal">occupied the south until 2000</text>
<path d="M 715.0,140 L 520.8222344200055,210.61009657454343" fill="none" stroke="#64748b" stroke-width="2"/>
<rect x="620" y="198" width="250" height="84" rx="6" fill="#fee2e2" stroke="#334155" stroke-width="2"/>
<text x="745.0" y="226" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">Iran</text>
<text x="745.0" y="248" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal">built and funded Hezbollah</text>
<text x="745.0" y="266" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal">from 1982 onward</text>
<path d="M 620,240.0 L 526.0,240.0" fill="none" stroke="#64748b" stroke-width="2"/>
<rect x="590" y="340" width="250" height="84" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="715.0" y="368" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">Saudi Arabia</text>
<text x="715.0" y="390" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal">brokered Taif and paid</text>
<text x="715.0" y="408" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal">for the reconstruction</text>
<path d="M 715.0,340 L 520.8222344200055,269.38990342545657" fill="none" stroke="#64748b" stroke-width="2"/>
<rect x="40" y="340" width="250" height="84" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="165.0" y="368" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">United States</text>
<text x="165.0" y="390" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal">backed Chamoun, landed</text>
<text x="165.0" y="408" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal">marines in 1958 and 1982</text>
<path d="M 165.0,340 L 359.17776557999446,269.38990342545657" fill="none" stroke="#64748b" stroke-width="2"/>
<rect x="10" y="198" width="250" height="84" rx="6" fill="#ede9fe" stroke="#334155" stroke-width="2"/>
<text x="135.0" y="226" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">The PLO</text>
<text x="135.0" y="248" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal">a state within a state until</text>
<text x="135.0" y="266" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal">it was expelled in 1982</text>
<path d="M 260,240.0 L 354.0,240.0" fill="none" stroke="#64748b" stroke-width="2"/>
<text x="440.0" y="452" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="normal">the civil war was Lebanese, but almost every faction had a sponsor outside the country</text>
</svg>
