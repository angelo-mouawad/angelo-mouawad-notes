<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" width="940" height="300" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect x="0" y="0" width="940" height="300" fill="#ffffff"/>
<text x="470.0" y="34" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#0f766e" text-anchor="middle" font-weight="bold">Picking the right reactive tool</text>
<rect x="40" y="60" width="860" height="40" rx="0" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
<text x="52" y="85.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="start" font-weight="bold">Function</text>
<text x="252" y="85.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="start" font-weight="bold">Returns value</text>
<text x="392" y="85.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="start" font-weight="bold">Runs</text>
<text x="492" y="85.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="start" font-weight="bold">Re-runs when</text>
<text x="692" y="85.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="start" font-weight="bold">Use it to</text>
<rect x="40" y="100" width="860" height="40" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/>
<text x="52" y="125.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" fill="#0f766e" text-anchor="start" font-weight="normal">reactive()</text>
<text x="252" y="125.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="start" font-weight="normal">yes</text>
<text x="392" y="125.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="start" font-weight="normal">lazy</text>
<text x="492" y="125.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="start" font-weight="normal">any input it reads</text>
<text x="692" y="125.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="start" font-weight="normal">derive a value</text>
<rect x="40" y="140" width="860" height="40" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="1"/>
<text x="52" y="165.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" fill="#0f766e" text-anchor="start" font-weight="normal">eventReactive()</text>
<text x="252" y="165.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="start" font-weight="normal">yes</text>
<text x="392" y="165.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="start" font-weight="normal">lazy</text>
<text x="492" y="165.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="start" font-weight="normal">only the event</text>
<text x="692" y="165.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="start" font-weight="normal">derive on a click</text>
<rect x="40" y="180" width="860" height="40" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/>
<text x="52" y="205.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" fill="#0f766e" text-anchor="start" font-weight="normal">observe()</text>
<text x="252" y="205.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="start" font-weight="normal">no</text>
<text x="392" y="205.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="start" font-weight="normal">eager</text>
<text x="492" y="205.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="start" font-weight="normal">any input it reads</text>
<text x="692" y="205.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="start" font-weight="normal">side effects</text>
<rect x="40" y="220" width="860" height="40" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="1"/>
<text x="52" y="245.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" fill="#0f766e" text-anchor="start" font-weight="normal">observeEvent()</text>
<text x="252" y="245.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="start" font-weight="normal">no</text>
<text x="392" y="245.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="start" font-weight="normal">eager</text>
<text x="492" y="245.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="start" font-weight="normal">only the event</text>
<text x="692" y="245.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="start" font-weight="normal">side effect on a click</text>
<line x1="240" y1="60" x2="240" y2="260" stroke="#334155" stroke-width="1"/>
<line x1="380" y1="60" x2="380" y2="260" stroke="#334155" stroke-width="1"/>
<line x1="480" y1="60" x2="480" y2="260" stroke="#334155" stroke-width="1"/>
<line x1="680" y1="60" x2="680" y2="260" stroke="#334155" stroke-width="1"/>
<text x="470" y="280" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="normal">Rule of thumb: if you need the result, use reactive(). If you need something to HAPPEN, use an observer.</text>
</svg>
