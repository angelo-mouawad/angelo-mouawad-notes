<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 230" width="880" height="230" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="880" height="230" fill="#ffffff"/>
<text x="440" y="32" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">A validation pipeline, one job per component</text>
<rect x="30" y="70" width="180" height="90" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="120" y="104" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">Reader</text>
<text x="120" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">reads raw files like CSVs</text>
<path d="M 210,115 L 236,115" fill="none" stroke="#334155" stroke-width="2"/>
<polygon points="226,110 226,120 236,115" fill="#334155"/>
<rect x="245" y="70" width="180" height="90" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="335" y="104" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">Validator</text>
<text x="335" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">applies the validation rules</text>
<path d="M 425,115 L 451,115" fill="none" stroke="#334155" stroke-width="2"/>
<polygon points="441,110 441,120 451,115" fill="#334155"/>
<rect x="460" y="70" width="180" height="90" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="550" y="104" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">Processor</text>
<text x="550" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">cleans and transforms columns</text>
<path d="M 640,115 L 666,115" fill="none" stroke="#334155" stroke-width="2"/>
<polygon points="656,110 656,120 666,115" fill="#334155"/>
<rect x="675" y="70" width="180" height="90" rx="6" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
<text x="765" y="104" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">Writer</text>
<text x="765" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">writes the clean data out</text>
<path d="M 295,160 L 295,186 L 200,186 L 200,200" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="4 3"/>
<polygon points="195,190 205,190 200,200" fill="#b91c1c"/>
<text x="200" y="218" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="normal">rejected rows</text>
</svg>
