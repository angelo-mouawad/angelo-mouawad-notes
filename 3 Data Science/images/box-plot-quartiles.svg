<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" width="840" height="300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="840" height="300" fill="#ffffff"/>
<line x1="130" y1="130.0" x2="260" y2="130.0" stroke="#334155" stroke-width="2"/>
<line x1="520" y1="130.0" x2="690" y2="130.0" stroke="#334155" stroke-width="2"/>
<line x1="130" y1="108" x2="130" y2="152" stroke="#334155" stroke-width="2"/>
<line x1="690" y1="108" x2="690" y2="152" stroke="#334155" stroke-width="2"/>
<rect x="260" y="90" width="260" height="80" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<line x1="380" y1="90" x2="380" y2="170" stroke="#0f766e" stroke-width="4"/>
<circle cx="760" cy="130.0" r="6" fill="#b91c1c"/>
<text x="760" y="78" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#b91c1c" text-anchor="middle" font-weight="normal">outlier</text>
<text x="260" y="78" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">Q1</text>
<text x="380" y="78" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">Q2</text>
<text x="520" y="78" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">Q3</text>
<text x="260" y="196" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">25%</text>
<text x="380" y="196" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">50%, the median</text>
<text x="520" y="196" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">75%</text>
<line x1="260" y1="215" x2="520" y2="215" stroke="#0f766e" stroke-width="2"/>
<polygon points="270,210 270,220 260,215" fill="#0f766e"/>
<polygon points="510,210 510,220 520,215" fill="#0f766e"/>
<text x="380" y="238" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="normal">IQR = Q3 - Q1, the middle 50% of the data</text>
<text x="130" y="196" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="normal">Q1 - 1.5 x IQR</text>
<text x="690" y="196" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="normal">Q3 + 1.5 x IQR</text>
<text x="420" y="262" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">anything past those two cut offs counts as an outlier</text>
</svg>
