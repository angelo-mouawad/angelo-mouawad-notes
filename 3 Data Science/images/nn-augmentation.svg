<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360" width="980" height="360" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be123c"/></marker>
</defs>
<rect x="0" y="0" width="980" height="360" fill="#ffffff"/>
<text x="24" y="38" font-size="20" text-anchor="start" font-weight="700" fill="#0f766e">Data Augmentation on Digits</text>
<rect x="24" y="60" width="222" height="236" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="135" y="86" font-size="13" text-anchor="middle" font-weight="700" fill="#0f766e">Original</text>
<rect x="80" y="104" width="110" height="110" rx="6" fill="#0f172a" stroke="#0f172a" stroke-width="1.5"/>
<g transform="translate(135 150) rotate(0) scale(1 1)"><text x="0" y="28" font-size="84" text-anchor="middle" font-weight="700" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif">7</text></g>
<text x="135" y="244" font-size="12" text-anchor="middle" font-weight="400" fill="#64748b">label 7</text>
<rect x="262" y="60" width="222" height="236" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="373" y="86" font-size="13" text-anchor="middle" font-weight="700" fill="#0f766e" font-family="Consolas, Menlo, Courier New, monospace">RandomRotation(0.05)</text>
<rect x="318" y="104" width="110" height="110" rx="6" fill="#0f172a" stroke="#0f172a" stroke-width="1.5"/>
<g transform="translate(373 150) rotate(14) scale(1 1)"><text x="0" y="28" font-size="84" text-anchor="middle" font-weight="700" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif">7</text></g>
<text x="373" y="244" font-size="12" text-anchor="middle" font-weight="400" fill="#64748b">up to ±18°, still a 7</text>
<text x="373" y="270" font-size="12" text-anchor="middle" font-weight="700" fill="#0f766e">keeps the label correct</text>
<rect x="500" y="60" width="222" height="236" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="611" y="86" font-size="13" text-anchor="middle" font-weight="700" fill="#be123c" font-family="Consolas, Menlo, Courier New, monospace">RandomFlip(&quot;horizontal&quot;)</text>
<rect x="556" y="104" width="110" height="110" rx="6" fill="#0f172a" stroke="#0f172a" stroke-width="1.5"/>
<g transform="translate(611 150) rotate(0) scale(-1 1)"><text x="0" y="28" font-size="84" text-anchor="middle" font-weight="700" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif">7</text></g>
<text x="611" y="244" font-size="12" text-anchor="middle" font-weight="400" fill="#64748b">mirrored, no longer a 7</text>
<text x="611" y="270" font-size="12" text-anchor="middle" font-weight="700" fill="#be123c">label is now wrong</text>
<rect x="738" y="60" width="222" height="236" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="849" y="86" font-size="13" text-anchor="middle" font-weight="700" fill="#be123c">Mirrored 2 and 5</text>
<rect x="794" y="104" width="110" height="110" rx="6" fill="#0f172a" stroke="#0f172a" stroke-width="1.5"/>
<g transform="translate(849 150) rotate(0) scale(-1 1)"><text x="0" y="28" font-size="84" text-anchor="middle" font-weight="700" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif">2</text></g>
<text x="849" y="244" font-size="12" text-anchor="middle" font-weight="400" fill="#64748b">a flipped 2 starts to look like a 5</text>
<text x="849" y="270" font-size="12" text-anchor="middle" font-weight="700" fill="#be123c">label is now wrong</text>
<text x="849" y="34" font-size="1" text-anchor="start" font-weight="400" fill="#0f172a"></text>
<text x="490" y="330" font-size="13" text-anchor="middle" font-weight="400" fill="#64748b" font-style="italic">Augmentation only helps if the transformed image would still get the same label from a human.</text>
</svg>
