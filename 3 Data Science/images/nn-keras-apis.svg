<rect x="0" y="0" width="990" height="400" fill="#ffffff"/>
<text x="24" y="38" font-size="20" text-anchor="start" font-weight="700" fill="#0f766e">Three Ways to Build a Keras Model</text>
<rect x="24" y="60" width="302" height="300" rx="10" fill="#d1fae5" stroke="#475569" stroke-width="1.5"/>
<text x="175" y="90" font-size="17" text-anchor="middle" font-weight="700" fill="#0f766e">Sequential</text>
<text x="175" y="110" font-size="13" text-anchor="middle" font-weight="400" fill="#64748b" font-style="italic">a straight stack</text>
<rect x="40" y="124" width="270" height="132" rx="8" fill="#0f172a" stroke="#0f172a" stroke-width="1.5"/>
<text x="54" y="148" font-size="13" text-anchor="start" font-weight="400" fill="#e2e8f0" font-family="Consolas, Menlo, Courier New, monospace">Sequential([</text>
<text x="54" y="168" font-size="13" text-anchor="start" font-weight="400" fill="#e2e8f0" font-family="Consolas, Menlo, Courier New, monospace">  Input((28,28)),</text>
<text x="54" y="188" font-size="13" text-anchor="start" font-weight="400" fill="#e2e8f0" font-family="Consolas, Menlo, Courier New, monospace">  Flatten(),</text>
<text x="54" y="208" font-size="13" text-anchor="start" font-weight="400" fill="#e2e8f0" font-family="Consolas, Menlo, Courier New, monospace">  Dense(64),</text>
<text x="54" y="228" font-size="13" text-anchor="start" font-weight="400" fill="#e2e8f0" font-family="Consolas, Menlo, Courier New, monospace">  Dense(10),</text>
<text x="54" y="248" font-size="13" text-anchor="start" font-weight="400" fill="#e2e8f0" font-family="Consolas, Menlo, Courier New, monospace">])</text>
<rect x="140" y="266" width="70" height="18" rx="4" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<line x1="175" y1="284" x2="175" y2="295" stroke="#475569" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="140" y="296" width="70" height="18" rx="4" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<line x1="175" y1="314" x2="175" y2="325" stroke="#475569" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="140" y="326" width="70" height="18" rx="4" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<rect x="346" y="60" width="302" height="300" rx="10" fill="#dbeafe" stroke="#475569" stroke-width="1.5"/>
<text x="497" y="90" font-size="17" text-anchor="middle" font-weight="700" fill="#0f766e">Functional</text>
<text x="497" y="110" font-size="13" text-anchor="middle" font-weight="400" fill="#64748b" font-style="italic">a graph of layers</text>
<rect x="362" y="124" width="270" height="132" rx="8" fill="#0f172a" stroke="#0f172a" stroke-width="1.5"/>
<text x="376" y="148" font-size="13" text-anchor="start" font-weight="400" fill="#e2e8f0" font-family="Consolas, Menlo, Courier New, monospace">x = Flatten()(inp)</text>
<text x="376" y="168" font-size="13" text-anchor="start" font-weight="400" fill="#e2e8f0" font-family="Consolas, Menlo, Courier New, monospace">x = Dense(64)(x)</text>
<text x="376" y="188" font-size="13" text-anchor="start" font-weight="400" fill="#e2e8f0" font-family="Consolas, Menlo, Courier New, monospace">out = Dense(10)(x)</text>
<text x="376" y="208" font-size="13" text-anchor="start" font-weight="400" fill="#e2e8f0" font-family="Consolas, Menlo, Courier New, monospace">Model(inp, out)</text>
<rect x="416" y="270" width="54" height="20" rx="4" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<rect x="526" y="270" width="54" height="20" rx="4" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<rect x="470" y="320" width="54" height="20" rx="4" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<line x1="443" y1="290" x2="486" y2="318" stroke="#475569" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="553" y1="290" x2="508" y2="318" stroke="#475569" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="497" y="284" font-size="11" text-anchor="middle" font-weight="400" fill="#64748b">2 inputs</text>
<rect x="668" y="60" width="302" height="300" rx="10" fill="#ede9fe" stroke="#475569" stroke-width="1.5"/>
<text x="819" y="90" font-size="17" text-anchor="middle" font-weight="700" fill="#0f766e">Subclassing</text>
<text x="819" y="110" font-size="13" text-anchor="middle" font-weight="400" fill="#64748b" font-style="italic">a Python class</text>
<rect x="684" y="124" width="270" height="132" rx="8" fill="#0f172a" stroke="#0f172a" stroke-width="1.5"/>
<text x="698" y="148" font-size="13" text-anchor="start" font-weight="400" fill="#e2e8f0" font-family="Consolas, Menlo, Courier New, monospace">class M(keras.Model):</text>
<text x="698" y="168" font-size="13" text-anchor="start" font-weight="400" fill="#e2e8f0" font-family="Consolas, Menlo, Courier New, monospace">  def __init__(self):</text>
<text x="698" y="188" font-size="13" text-anchor="start" font-weight="400" fill="#e2e8f0" font-family="Consolas, Menlo, Courier New, monospace">    ...</text>
<text x="698" y="208" font-size="13" text-anchor="start" font-weight="400" fill="#e2e8f0" font-family="Consolas, Menlo, Courier New, monospace">  def call(self, x):</text>
<text x="698" y="228" font-size="13" text-anchor="start" font-weight="400" fill="#e2e8f0" font-family="Consolas, Menlo, Courier New, monospace">    ...</text>
<text x="819" y="290" font-size="12" text-anchor="middle" font-weight="400" fill="#0f172a">full control of the</text>
<text x="819" y="308" font-size="12" text-anchor="middle" font-weight="400" fill="#0f172a">forward pass, custom</text>
<text x="819" y="326" font-size="12" text-anchor="middle" font-weight="400" fill="#0f172a">layers and logic</text>
<text x="495" y="386" font-size="13" text-anchor="middle" font-weight="400" fill="#64748b" font-style="italic">Left to right: easier to read, more flexible. All three compile, fit and predict in exactly the same way.</text>
</svg>
