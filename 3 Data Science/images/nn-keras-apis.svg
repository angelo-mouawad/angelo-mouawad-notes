<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 400" width="990" height="400" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
