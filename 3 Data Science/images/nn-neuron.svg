<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be123c"/></marker>
</defs>
<rect x="0" y="0" width="960" height="400" fill="#ffffff"/>
<text x="24" y="38" font-size="20" text-anchor="start" font-weight="700" fill="#0f766e">One Artificial Neuron</text>
<circle cx="90" cy="110" r="26" fill="#dbeafe" stroke="#475569" stroke-width="2"/>
<text x="90" y="115" font-size="14" text-anchor="middle" font-weight="700" fill="#0f172a" font-family="Consolas, Menlo, Courier New, monospace">x1</text>
<text x="50" y="115" font-size="13" text-anchor="end" font-weight="400" fill="#64748b" font-family="Consolas, Menlo, Courier New, monospace">0.0</text>
<line x1="116" y1="110" x2="418" y2="170.0" stroke="#475569" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="240" y="122.63576158940398" font-size="13" text-anchor="middle" font-weight="600" fill="#0f766e" font-family="Consolas, Menlo, Courier New, monospace">w1 = 0.4</text>
<circle cx="90" cy="190" r="26" fill="#dbeafe" stroke="#475569" stroke-width="2"/>
<text x="90" y="195" font-size="14" text-anchor="middle" font-weight="700" fill="#0f172a" font-family="Consolas, Menlo, Courier New, monospace">x2</text>
<text x="50" y="195" font-size="13" text-anchor="end" font-weight="400" fill="#64748b" font-family="Consolas, Menlo, Courier New, monospace">0.8</text>
<line x1="116" y1="190" x2="418" y2="190.0" stroke="#475569" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="240" y="178.0" font-size="13" text-anchor="middle" font-weight="600" fill="#0f766e" font-family="Consolas, Menlo, Courier New, monospace">w2 = -0.2</text>
<circle cx="90" cy="270" r="26" fill="#dbeafe" stroke="#475569" stroke-width="2"/>
<text x="90" y="275" font-size="14" text-anchor="middle" font-weight="700" fill="#0f172a" font-family="Consolas, Menlo, Courier New, monospace">x3</text>
<text x="50" y="275" font-size="13" text-anchor="end" font-weight="400" fill="#64748b" font-family="Consolas, Menlo, Courier New, monospace">1.0</text>
<line x1="116" y1="270" x2="418" y2="210.0" stroke="#475569" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="240" y="233.36423841059602" font-size="13" text-anchor="middle" font-weight="600" fill="#0f766e" font-family="Consolas, Menlo, Courier New, monospace">w3 = 0.9</text>
<circle cx="470" cy="190" r="50" fill="#d1fae5" stroke="#475569" stroke-width="2"/>
<text x="470" y="186" font-size="20" text-anchor="middle" font-weight="700" fill="#0f172a">Σ + b</text>
<text x="470" y="210" font-size="12" text-anchor="middle" font-weight="400" fill="#64748b" font-family="Consolas, Menlo, Courier New, monospace">b = 0.1</text>
<line x1="520" y1="190" x2="618" y2="190" stroke="#475569" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="620" y="150" width="120" height="80" rx="10" fill="#fef3c7" stroke="#475569" stroke-width="1.5"/>
<text x="680.0" y="183.70000000000002" font-size="18" text-anchor="middle" font-weight="700" fill="#0f172a" font-family="Consolas, Menlo, Courier New, monospace">f(z)</text>
<text x="680.0" y="208.9" font-size="17" text-anchor="middle" font-weight="400" fill="#0f172a">activation</text>
<line x1="740" y1="190" x2="806" y2="190" stroke="#475569" stroke-width="1.8" marker-end="url(#ah)"/>
<circle cx="840" cy="190" r="32" fill="#ede9fe" stroke="#475569" stroke-width="2"/>
<text x="840" y="195" font-size="14" text-anchor="middle" font-weight="700" fill="#0f172a" font-family="Consolas, Menlo, Courier New, monospace">0.84</text>
<text x="840" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#64748b">output</text>
<text x="90" y="316" font-size="13" text-anchor="middle" font-weight="400" fill="#64748b">inputs</text>
<text x="240" y="80" font-size="13" text-anchor="middle" font-weight="600" fill="#0f766e">weights (learned)</text>
<text x="480" y="350" font-size="14" text-anchor="middle" font-weight="400" fill="#0f172a" font-family="Consolas, Menlo, Courier New, monospace">z = 0.4·0.0 + (-0.2)·0.8 + 0.9·1.0 + 0.1 = 0.84</text>
<text x="680" y="262" font-size="12" text-anchor="middle" font-weight="400" fill="#64748b" font-family="Consolas, Menlo, Courier New, monospace">ReLU(0.84) = 0.84</text>
<text x="480" y="384" font-size="13" text-anchor="middle" font-weight="400" fill="#64748b" font-style="italic">A neuron is a weighted sum plus a bias, pushed through an activation function. Training only changes w and b.</text>
</svg>
