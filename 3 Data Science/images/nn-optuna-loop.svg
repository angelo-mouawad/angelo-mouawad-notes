<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be123c"/></marker>
</defs>
<rect x="0" y="0" width="960" height="400" fill="#ffffff"/>
<text x="24" y="38" font-size="20" text-anchor="start" font-weight="700" fill="#0f766e">How an Optuna Study Works</text>
<rect x="24" y="150" width="170" height="80" rx="10" fill="#dbeafe" stroke="#475569" stroke-width="1.5"/>
<text x="109.0" y="175.3" font-size="14" text-anchor="middle" font-weight="700" fill="#0f172a">study</text>
<text x="109.0" y="194.9" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">create_study(</text>
<text x="109.0" y="214.5" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">direction=&#x27;maximize&#x27;)</text>
<rect x="260" y="70" width="230" height="88" rx="10" fill="#fef3c7" stroke="#475569" stroke-width="1.5"/>
<text x="375.0" y="98.9" font-size="14" text-anchor="middle" font-weight="700" fill="#0f172a">trial.suggest_*</text>
<text x="375.0" y="118.9" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">nb_layers = 3</text>
<text x="375.0" y="138.9" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">sizes = [128, 64, 128]</text>
<rect x="560" y="70" width="230" height="88" rx="10" fill="#d1fae5" stroke="#475569" stroke-width="1.5"/>
<text x="675.0" y="98.9" font-size="14" text-anchor="middle" font-weight="700" fill="#0f172a">build + train</text>
<text x="675.0" y="118.9" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">make_model(...)</text>
<text x="675.0" y="138.9" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">fit with early stopping</text>
<rect x="560" y="250" width="230" height="88" rx="10" fill="#d1fae5" stroke="#475569" stroke-width="1.5"/>
<text x="675.0" y="278.9" font-size="14" text-anchor="middle" font-weight="700" fill="#0f172a">score</text>
<text x="675.0" y="298.9" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">objective returns</text>
<text x="675.0" y="318.9" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">e.g. test F1 0.97</text>
<rect x="260" y="250" width="230" height="88" rx="10" fill="#ede9fe" stroke="#475569" stroke-width="1.5"/>
<text x="375.0" y="278.9" font-size="14" text-anchor="middle" font-weight="700" fill="#0f172a">sampler learns</text>
<text x="375.0" y="298.9" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">which regions of the</text>
<text x="375.0" y="318.9" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">search space score well</text>
<line x1="490" y1="114" x2="558" y2="114" stroke="#0f766e" stroke-width="1.8" marker-end="url(#aht)"/>
<line x1="675" y1="158" x2="675" y2="248" stroke="#0f766e" stroke-width="1.8" marker-end="url(#aht)"/>
<line x1="558" y1="294" x2="492" y2="294" stroke="#0f766e" stroke-width="1.8" marker-end="url(#aht)"/>
<line x1="375" y1="250" x2="375" y2="160" stroke="#0f766e" stroke-width="1.8" marker-end="url(#aht)"/>
<line x1="194" y1="190" x2="258" y2="120" stroke="#475569" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="375" y="210" font-size="13" text-anchor="middle" font-weight="700" fill="#0f766e">repeat n_trials times</text>
<rect x="820" y="150" width="120" height="80" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/>
<text x="880.0" y="185.1" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff">best_params</text>
<text x="880.0" y="204.7" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff">highest score</text>
<line x1="790" y1="294" x2="870" y2="232" stroke="#475569" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="480" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#64748b" font-style="italic">Unlike a grid search, each new trial uses the results of the previous ones to pick promising values (TPE sampler by default).</text>
</svg>
