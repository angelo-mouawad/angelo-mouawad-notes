<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be123c"/></marker>
</defs>
<rect x="0" y="0" width="900" height="420" fill="#ffffff"/>
<text x="24" y="38" font-size="20" text-anchor="start" font-weight="700" fill="#0f766e">Early Stopping With patience=3</text>
<rect x="391.11111111111114" y="90" width="186.66666666666669" height="240" fill="#ffe4e6" fill-opacity="0.6"/>
<line x1="80" y1="330" x2="640" y2="330" stroke="#0f172a" stroke-width="1.5"/>
<line x1="80" y1="330" x2="80" y2="90" stroke="#0f172a" stroke-width="1.5"/>
<text x="360.0" y="356" font-size="12" text-anchor="middle" font-weight="600" fill="#0f172a">epoch</text>
<text x="46" y="210.0" font-size="12" text-anchor="middle" font-weight="600" fill="#0f172a" transform="rotate(-90 46 210.0)">val_loss</text>
<polyline points="80.0,104.1 142.2,238.2 204.4,277.1 266.7,294.7 328.9,303.2 391.1,307.4 453.3,303.9 515.6,301.1 577.8,297.5" fill="none" stroke="#b45309" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="80.0" cy="104.11764705882354" r="5" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
<text x="80.0" y="346" font-size="11" text-anchor="middle" font-weight="400" fill="#64748b">1</text>
<circle cx="142.22222222222223" cy="238.23529411764707" r="5" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
<text x="142.22222222222223" y="346" font-size="11" text-anchor="middle" font-weight="400" fill="#64748b">2</text>
<circle cx="204.44444444444446" cy="277.05882352941177" r="5" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
<text x="204.44444444444446" y="346" font-size="11" text-anchor="middle" font-weight="400" fill="#64748b">3</text>
<circle cx="266.66666666666663" cy="294.70588235294116" r="5" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
<text x="266.66666666666663" y="346" font-size="11" text-anchor="middle" font-weight="400" fill="#64748b">4</text>
<circle cx="328.8888888888889" cy="303.1764705882353" r="5" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
<text x="328.8888888888889" y="346" font-size="11" text-anchor="middle" font-weight="400" fill="#64748b">5</text>
<circle cx="391.11111111111114" cy="307.4117647058824" r="7" fill="#0f766e" stroke="#0f766e" stroke-width="2"/>
<text x="391.11111111111114" y="346" font-size="11" text-anchor="middle" font-weight="400" fill="#64748b">6</text>
<circle cx="453.3333333333333" cy="303.88235294117646" r="5" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
<text x="453.3333333333333" y="346" font-size="11" text-anchor="middle" font-weight="400" fill="#64748b">7</text>
<circle cx="515.5555555555555" cy="301.05882352941177" r="5" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
<text x="515.5555555555555" y="346" font-size="11" text-anchor="middle" font-weight="400" fill="#64748b">8</text>
<circle cx="577.7777777777778" cy="297.52941176470586" r="5" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
<text x="577.7777777777778" y="346" font-size="11" text-anchor="middle" font-weight="400" fill="#64748b">9</text>
<text x="379.11111111111114" y="289.4117647058824" font-size="12" text-anchor="end" font-weight="700" fill="#0f766e">best: 0.112</text>
<text x="453.3333333333333" y="289.88235294117646" font-size="11" text-anchor="middle" font-weight="400" fill="#be123c">worse 1</text>
<text x="515.5555555555555" y="287.05882352941177" font-size="11" text-anchor="middle" font-weight="400" fill="#be123c">worse 2</text>
<text x="577.7777777777778" y="283.52941176470586" font-size="11" text-anchor="middle" font-weight="400" fill="#be123c">worse 3</text>
<text x="484.44444444444446" y="110" font-size="12" text-anchor="middle" font-weight="700" fill="#be123c">patience window</text>
<line x1="577.7777777777778" y1="330" x2="577.7777777777778" y2="90" stroke="#be123c" stroke-width="2" stroke-dasharray="6 5"/>
<text x="583.7777777777778" y="130" font-size="13" text-anchor="start" font-weight="700" fill="#be123c">STOP</text>
<rect x="676" y="70" width="206" height="220" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="688" y="104" font-size="12" text-anchor="start" font-weight="400" fill="#0f766e" font-family="Consolas, Menlo, Courier New, monospace">monitor=&#x27;val_loss&#x27;</text>
<text x="688" y="124" font-size="12" text-anchor="start" font-weight="400" fill="#64748b">the number to watch</text>
<text x="688" y="168" font-size="12" text-anchor="start" font-weight="400" fill="#0f766e" font-family="Consolas, Menlo, Courier New, monospace">patience=3</text>
<text x="688" y="188" font-size="12" text-anchor="start" font-weight="400" fill="#64748b">bad epochs allowed in a row</text>
<text x="688" y="232" font-size="12" text-anchor="start" font-weight="400" fill="#0f766e" font-family="Consolas, Menlo, Courier New, monospace">restore_best_weights</text>
<text x="688" y="252" font-size="12" text-anchor="start" font-weight="400" fill="#64748b">=True: jump back to epoch 6</text>
<text x="450" y="378" font-size="13" text-anchor="middle" font-weight="400" fill="#64748b" font-style="italic">Training asked for 25 epochs but stopped after 9. Without restore_best_weights you would keep</text>
<text x="450" y="398" font-size="13" text-anchor="middle" font-weight="400" fill="#64748b" font-style="italic">the slightly overfitted weights of epoch 9 instead of the best ones.</text>
</svg>
