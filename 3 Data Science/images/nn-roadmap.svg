<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 420" width="990" height="420" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be123c"/></marker>
</defs>
<rect x="0" y="0" width="990" height="420" fill="#ffffff"/>
<text x="24" y="38" font-size="20" text-anchor="start" font-weight="700" fill="#0f766e">The Workshop&#x27;s Fight Against Overfitting</text>
<rect x="24" y="70" width="146" height="196" rx="10" fill="#ffe4e6" stroke="#475569" stroke-width="1.5"/>
<rect x="24" y="70" width="146" height="8" rx="4" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/>
<text x="97" y="104" font-size="13" text-anchor="middle" font-weight="700" fill="#64748b">Try 1</text>
<text x="97" y="128" font-size="15" text-anchor="middle" font-weight="700" fill="#0f766e">Baseline</text>
<text x="97" y="166" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">128-128-10</text>
<text x="97" y="188" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">1000 images</text>
<text x="97" y="210" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">overfits</text>
<line x1="170" y1="168" x2="184" y2="168" stroke="#475569" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="186" y="70" width="146" height="196" rx="10" fill="#fef3c7" stroke="#475569" stroke-width="1.5"/>
<rect x="186" y="70" width="146" height="8" rx="4" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/>
<text x="259" y="104" font-size="13" text-anchor="middle" font-weight="700" fill="#64748b">Try 2</text>
<text x="259" y="128" font-size="15" text-anchor="middle" font-weight="700" fill="#0f766e">More data</text>
<text x="259" y="166" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">48,000 images</text>
<text x="259" y="188" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">+ augmentation</text>
<text x="259" y="210" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">experiment</text>
<line x1="332" y1="168" x2="346" y2="168" stroke="#475569" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="348" y="70" width="146" height="196" rx="10" fill="#fef3c7" stroke="#475569" stroke-width="1.5"/>
<rect x="348" y="70" width="146" height="8" rx="4" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/>
<text x="421" y="104" font-size="13" text-anchor="middle" font-weight="700" fill="#64748b">Try 3</text>
<text x="421" y="128" font-size="15" text-anchor="middle" font-weight="700" fill="#0f766e">Smaller model</text>
<text x="421" y="166" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">64-32-10</text>
<text x="421" y="188" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">fewer</text>
<text x="421" y="210" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">parameters</text>
<line x1="494" y1="168" x2="508" y2="168" stroke="#475569" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="510" y="70" width="146" height="196" rx="10" fill="#d1fae5" stroke="#475569" stroke-width="1.5"/>
<rect x="510" y="70" width="146" height="8" rx="4" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/>
<text x="583" y="104" font-size="13" text-anchor="middle" font-weight="700" fill="#64748b">Try 4</text>
<text x="583" y="128" font-size="15" text-anchor="middle" font-weight="700" fill="#0f766e">Early stopping</text>
<text x="583" y="166" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">stop when</text>
<text x="583" y="188" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">val_loss stops</text>
<text x="583" y="210" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">improving</text>
<line x1="656" y1="168" x2="670" y2="168" stroke="#475569" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="672" y="70" width="146" height="196" rx="10" fill="#d1fae5" stroke="#475569" stroke-width="1.5"/>
<rect x="672" y="70" width="146" height="8" rx="4" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/>
<text x="745" y="104" font-size="13" text-anchor="middle" font-weight="700" fill="#64748b">Try 5</text>
<text x="745" y="128" font-size="15" text-anchor="middle" font-weight="700" fill="#0f766e">Dropout</text>
<text x="745" y="166" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">128-128-10</text>
<text x="745" y="188" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">Dropout 0.2</text>
<text x="745" y="210" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">then 0.5</text>
<line x1="818" y1="168" x2="832" y2="168" stroke="#475569" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="834" y="70" width="146" height="196" rx="10" fill="#dbeafe" stroke="#475569" stroke-width="1.5"/>
<rect x="834" y="70" width="146" height="8" rx="4" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/>
<text x="907" y="104" font-size="13" text-anchor="middle" font-weight="700" fill="#64748b">Try 6</text>
<text x="907" y="128" font-size="15" text-anchor="middle" font-weight="700" fill="#0f766e">Rescaling layer</text>
<text x="907" y="166" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">preprocessing</text>
<text x="907" y="188" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">inside the</text>
<text x="907" y="210" font-size="13" text-anchor="middle" font-weight="400" fill="#0f172a">model</text>
<line x1="28" y1="286" x2="166" y2="286" stroke="#be123c" stroke-width="3"/>
<text x="97.0" y="308" font-size="12" text-anchor="middle" font-weight="600" fill="#be123c">the problem</text>
<line x1="190" y1="286" x2="490" y2="286" stroke="#b45309" stroke-width="3"/>
<text x="340.0" y="308" font-size="12" text-anchor="middle" font-weight="600" fill="#b45309">less room to memorise</text>
<line x1="514" y1="286" x2="814" y2="286" stroke="#0f766e" stroke-width="3"/>
<text x="664.0" y="308" font-size="12" text-anchor="middle" font-weight="600" fill="#0f766e">regularise the training</text>
<line x1="838" y1="286" x2="976" y2="286" stroke="#2563eb" stroke-width="3"/>
<text x="907.0" y="308" font-size="12" text-anchor="middle" font-weight="600" fill="#2563eb">deployment</text>
<text x="495" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#64748b" font-style="italic">Change one thing at a time and compare the training history and test F1 each time.</text>
<text x="495" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#64748b" font-style="italic">That is how you learn which change actually helped.</text>
</svg>
