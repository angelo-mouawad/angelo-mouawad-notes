<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" width="940" height="300" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be123c"/></marker>
</defs>
<rect x="0" y="0" width="940" height="300" fill="#ffffff"/>
<text x="24" y="38" font-size="20" text-anchor="start" font-weight="700" fill="#0f766e">How the MNIST Data Is Split</text>
<text x="40" y="80" font-size="13" text-anchor="start" font-weight="400" fill="#64748b" font-family="Consolas, Menlo, Courier New, monospace">mnist.load_data()</text>
<rect x="40" y="92" width="737.1428571428571" height="50" rx="6" fill="#dbeafe" stroke="#475569" stroke-width="1.5"/>
<text x="408.57142857142856" y="123" font-size="15" text-anchor="middle" font-weight="700" fill="#0f172a">train: 60,000 images</text>
<rect x="777.1428571428571" y="92" width="122.85714285714286" height="50" rx="6" fill="#ffe4e6" stroke="#475569" stroke-width="1.5"/>
<text x="838.5714285714286" y="123" font-size="14" text-anchor="middle" font-weight="700" fill="#0f172a">test: 10,000</text>
<line x1="408.57142857142856" y1="144" x2="408.57142857142856" y2="178" stroke="#475569" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="418.57142857142856" y="168" font-size="12" text-anchor="start" font-weight="400" fill="#64748b" font-family="Consolas, Menlo, Courier New, monospace">train_test_split(test_size=0.2)</text>
<rect x="40" y="182" width="589.7142857142857" height="50" rx="6" fill="#d1fae5" stroke="#475569" stroke-width="1.5"/>
<text x="334.85714285714283" y="213" font-size="15" text-anchor="middle" font-weight="700" fill="#0f172a">train: 48,000</text>
<rect x="629.7142857142857" y="182" width="147.42857142857142" height="50" rx="6" fill="#fef3c7" stroke="#475569" stroke-width="1.5"/>
<text x="703.4285714285714" y="213" font-size="14" text-anchor="middle" font-weight="700" fill="#0f172a">val: 12,000</text>
<rect x="777.1428571428571" y="182" width="122.85714285714286" height="50" rx="6" fill="#ffe4e6" stroke="#475569" stroke-width="1.5"/>
<text x="838.5714285714286" y="213" font-size="14" text-anchor="middle" font-weight="700" fill="#0f172a">test: 10,000</text>
<text x="334.85714285714283" y="254" font-size="12" text-anchor="middle" font-weight="400" fill="#64748b">learn the weights</text>
<text x="703.4285714285714" y="254" font-size="12" text-anchor="middle" font-weight="400" fill="#64748b">check after every epoch</text>
<text x="838.5714285714286" y="254" font-size="12" text-anchor="middle" font-weight="400" fill="#64748b">final score, once</text>
<text x="470" y="286" font-size="13" text-anchor="middle" font-weight="400" fill="#64748b" font-style="italic">The validation set steers your choices, so only the untouched test set gives an honest final number.</text>
</svg>
