<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" width="940" height="420" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect x="0" y="0" width="940" height="420" fill="#ffffff"/>
<text x="470.0" y="34" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#0f766e" text-anchor="middle" font-weight="bold">Every output has a UI half and a server half</text>
<rect x="40" y="60" width="860" height="34" rx="0" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
<text x="52" y="82.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="bold">In ui (placeholder)</text>
<text x="352" y="82.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="bold">In server (fills it)</text>
<text x="682" y="82.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="bold">What appears</text>
<rect x="40" y="94" width="860" height="34" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/>
<text x="52" y="116.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#0f766e" text-anchor="start" font-weight="normal">plotOutput("p")</text>
<text x="352" y="116.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#0f766e" text-anchor="start" font-weight="normal">output$p &lt;- renderPlot()</text>
<text x="682" y="116.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">a plot (base or ggplot2)</text>
<rect x="40" y="128" width="860" height="34" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="1"/>
<text x="52" y="150.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#0f766e" text-anchor="start" font-weight="normal">tableOutput("t")</text>
<text x="352" y="150.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#0f766e" text-anchor="start" font-weight="normal">output$t &lt;- renderTable()</text>
<text x="682" y="150.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">a static HTML table</text>
<rect x="40" y="162" width="860" height="34" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/>
<text x="52" y="184.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#0f766e" text-anchor="start" font-weight="normal">DT::DTOutput("d")</text>
<text x="352" y="184.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#0f766e" text-anchor="start" font-weight="normal">output$d &lt;- DT::renderDT()</text>
<text x="682" y="184.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">searchable, paged table</text>
<rect x="40" y="196" width="860" height="34" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="1"/>
<text x="52" y="218.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#0f766e" text-anchor="start" font-weight="normal">textOutput("x")</text>
<text x="352" y="218.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#0f766e" text-anchor="start" font-weight="normal">output$x &lt;- renderText()</text>
<text x="682" y="218.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">a line of text</text>
<rect x="40" y="230" width="860" height="34" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/>
<text x="52" y="252.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#0f766e" text-anchor="start" font-weight="normal">verbatimTextOutput("v")</text>
<text x="352" y="252.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#0f766e" text-anchor="start" font-weight="normal">output$v &lt;- renderPrint()</text>
<text x="682" y="252.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">console style output</text>
<rect x="40" y="264" width="860" height="34" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="1"/>
<text x="52" y="286.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#0f766e" text-anchor="start" font-weight="normal">uiOutput("u")</text>
<text x="352" y="286.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#0f766e" text-anchor="start" font-weight="normal">output$u &lt;- renderUI()</text>
<text x="682" y="286.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">UI built at runtime</text>
<rect x="40" y="298" width="860" height="34" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/>
<text x="52" y="320.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#0f766e" text-anchor="start" font-weight="normal">imageOutput("i")</text>
<text x="352" y="320.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#0f766e" text-anchor="start" font-weight="normal">output$i &lt;- renderImage()</text>
<text x="682" y="320.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">an image file</text>
<rect x="40" y="332" width="860" height="34" rx="0" fill="#f1f5f9" stroke="#334155" stroke-width="1"/>
<text x="52" y="354.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#0f766e" text-anchor="start" font-weight="normal">downloadButton("dl")</text>
<text x="352" y="354.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#0f766e" text-anchor="start" font-weight="normal">output$dl &lt;- downloadHandler()</text>
<text x="682" y="354.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">a file to download</text>
<line x1="340" y1="60" x2="340" y2="366" stroke="#334155" stroke-width="1"/>
<line x1="670" y1="60" x2="670" y2="366" stroke="#334155" stroke-width="1"/>
<text x="470" y="400" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#b91c1c" text-anchor="middle" font-weight="bold">The string id in the UI and the name after output$ must match exactly.</text>
</svg>
