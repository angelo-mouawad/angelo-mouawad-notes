<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="800" height="320" fill="#ffffff"/>
<text x="400" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">The same result, two very different costs</text>
<rect x="40" y="56" width="350" height="220" rx="10" fill="#fee2e2" stroke="#334155" stroke-width="2"/>
<text x="215" y="82" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#b91c1c" text-anchor="middle" font-weight="bold">Row by row</text>
<text x="215" y="104" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">FOR rec IN SELECT id FROM accounts</text>
<rect x="90" y="122" width="250" height="24" rx="6" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="215.0" y="139.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">UPDATE ... WHERE id = 1</text>
<rect x="90" y="152" width="250" height="24" rx="6" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="215.0" y="169.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">UPDATE ... WHERE id = 2</text>
<rect x="90" y="182" width="250" height="24" rx="6" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="215.0" y="199.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">UPDATE ... WHERE id = 3</text>
<rect x="90" y="212" width="250" height="24" rx="6" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="215.0" y="229.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">UPDATE ... WHERE id = 4</text>
<text x="215" y="258" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="normal">one statement per row, planned each time</text>
<rect x="410" y="56" width="350" height="220" rx="10" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="585" y="82" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#0f766e" text-anchor="middle" font-weight="bold">Set based</text>
<text x="585" y="104" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">one declarative statement</text>
<rect x="450" y="150" width="270" height="44" rx="6" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="585.0" y="177.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">UPDATE accounts SET ...</text>
<text x="585" y="258" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="normal">the database was built to do this</text>
<text x="400" y="306" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">the set based form is routinely hundreds of times faster</text>
</svg>
