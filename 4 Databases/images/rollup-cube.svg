<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="800" height="320" fill="#ffffff"/>
<text x="400" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">Which groupings each keyword generates</text>
<rect x="30" y="56" width="230" height="216" rx="10" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="145" y="82" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">ROLLUP (region, product)</text>
<line x1="48" y1="94" x2="242" y2="94" stroke="#334155" stroke-width="1.5"/>
<text x="145" y="118" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">(region, product)</text>
<text x="145" y="142" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">(region)</text>
<text x="145" y="166" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">()</text>
<text x="145" y="232" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="bold">n + 1 groupings</text>
<text x="145" y="256" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal">columns form a hierarchy</text>
<rect x="290" y="56" width="230" height="216" rx="10" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
<text x="405" y="82" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">CUBE (region, product)</text>
<line x1="308" y1="94" x2="502" y2="94" stroke="#334155" stroke-width="1.5"/>
<text x="405" y="118" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">(region, product)</text>
<text x="405" y="142" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">(region)</text>
<text x="405" y="166" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">(product)</text>
<text x="405" y="190" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">()</text>
<text x="405" y="232" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="bold">2 to the n groupings</text>
<text x="405" y="256" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal">columns are independent dimensions</text>
<rect x="550" y="56" width="230" height="216" rx="10" fill="#fde68a" stroke="#334155" stroke-width="2"/>
<text x="665" y="82" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">GROUPING SETS (...)</text>
<line x1="568" y1="94" x2="762" y2="94" stroke="#334155" stroke-width="1.5"/>
<text x="665" y="118" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">exactly</text>
<text x="665" y="142" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">what you</text>
<text x="665" y="166" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">list</text>
<text x="665" y="232" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="bold">as many as you list</text>
<text x="665" y="256" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal">the general form, the others are shorthands</text>
<text x="400" y="300" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">NULL marks a column that was aggregated away, GROUPING(col) tells it apart from a real NULL</text>
</svg>
