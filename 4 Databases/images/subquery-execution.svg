<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" width="820" height="340" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="820" height="340" fill="#ffffff"/>
<text x="410" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">The one difference: does the inner query mention an outer column</text>
<rect x="40" y="56" width="360" height="250" rx="10" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="220" y="84" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">Non correlated</text>
<rect x="90" y="100" width="260" height="40" rx="6" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="220.0" y="125.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">inner query</text>
<polyline points="220,140 220,166" fill="none" stroke="#0f766e" stroke-width="2" stroke-linejoin="round"/>
<polygon points="220,166 213,158 227,158" fill="#0f766e"/>
<text x="292" y="158" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal">once</text>
<rect x="90" y="170" width="260" height="40" rx="6" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="220.0" y="195.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">one fixed value</text>
<polyline points="220,210 220,236" fill="none" stroke="#0f766e" stroke-width="2" stroke-linejoin="round"/>
<polygon points="220,236 213,228 227,228" fill="#0f766e"/>
<rect x="90" y="240" width="260" height="40" rx="6" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="220.0" y="265.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">outer query runs</text>
<rect x="420" y="56" width="360" height="250" rx="10" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
<text x="600" y="84" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">Correlated</text>
<rect x="470" y="100" width="260" height="40" rx="6" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="600.0" y="125.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">outer query</text>
<rect x="500" y="152" width="200" height="32" rx="6" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="600.0" y="173.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">row 1, inner runs</text>
<polyline points="600,140 600,150" fill="none" stroke="#1d4ed8" stroke-width="1.6" stroke-linejoin="round"/>
<polygon points="600,150 593,142 607,142" fill="#1d4ed8"/>
<rect x="500" y="194" width="200" height="32" rx="6" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="600.0" y="215.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">row 2, inner runs</text>
<polyline points="600,182 600,192" fill="none" stroke="#1d4ed8" stroke-width="1.6" stroke-linejoin="round"/>
<polygon points="600,192 593,184 607,184" fill="#1d4ed8"/>
<rect x="500" y="236" width="200" height="32" rx="6" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="600.0" y="257.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">row 3, inner runs</text>
<polyline points="600,224 600,234" fill="none" stroke="#1d4ed8" stroke-width="1.6" stroke-linejoin="round"/>
<polygon points="600,234 593,226 607,226" fill="#1d4ed8"/>
<text x="600" y="292" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1d4ed8" text-anchor="middle" font-weight="bold">once per outer row</text>
<text x="410" y="328" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="normal">PostgreSQL often rewrites a correlated subquery into a join, so this is the logical model</text>
</svg>
