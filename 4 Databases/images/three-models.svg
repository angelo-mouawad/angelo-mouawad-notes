<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="900" height="300" fill="#ffffff"/>
<text x="450" y="34" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">The same database, described three times</text>
<rect x="40" y="60" width="250" height="200" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="165" y="92" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#1f2933" text-anchor="middle" font-weight="bold">Conceptual</text>
<text x="165" y="114" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-style="italic">what the users mean</text>
<line x1="70" y1="128" x2="260" y2="128" stroke="#334155" stroke-width="1.5"/>
<text x="165" y="152" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">entity types</text>
<text x="165" y="176" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">attributes</text>
<text x="165" y="200" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">relationships</text>
<text x="165" y="240" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="normal">drawn as an ERD</text>
<path d="M 290,160 L 326,160" fill="none" stroke="#334155" stroke-width="2"/>
<polygon points="316,155 316,165 326,160" fill="#334155"/>
<rect x="330" y="60" width="250" height="200" rx="6" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
<text x="455" y="92" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#1f2933" text-anchor="middle" font-weight="bold">Logical</text>
<text x="455" y="114" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-style="italic">how it becomes tables</text>
<line x1="360" y1="128" x2="550" y2="128" stroke="#334155" stroke-width="1.5"/>
<text x="455" y="152" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">tables</text>
<text x="455" y="176" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">primary keys</text>
<text x="455" y="200" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">foreign keys</text>
<text x="455" y="240" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="normal">no DBMS chosen yet</text>
<path d="M 580,160 L 616,160" fill="none" stroke="#334155" stroke-width="2"/>
<polygon points="606,155 606,165 616,160" fill="#334155"/>
<rect x="620" y="60" width="250" height="200" rx="6" fill="#fde68a" stroke="#334155" stroke-width="2"/>
<text x="745" y="92" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#1f2933" text-anchor="middle" font-weight="bold">Physical</text>
<text x="745" y="114" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal" font-style="italic">how this DBMS stores it</text>
<line x1="650" y1="128" x2="840" y2="128" stroke="#334155" stroke-width="1.5"/>
<text x="745" y="152" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">data types</text>
<text x="745" y="176" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">lengths</text>
<text x="745" y="200" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">nullable or not</text>
<text x="745" y="240" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="normal">ready to be created</text>
<text x="450" y="288" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">each step adds detail, none of them throws detail away</text>
</svg>
