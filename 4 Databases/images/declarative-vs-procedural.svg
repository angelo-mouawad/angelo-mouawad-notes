<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="820" height="330" fill="#ffffff"/>
<text x="410" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">Two different ways of telling the database what to do</text>
<rect x="40" y="56" width="350" height="240" rx="10" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="215" y="84" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">Declarative</text>
<text x="215" y="106" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="normal">you describe what you want</text>
<rect x="80" y="122" width="270" height="40" rx="6" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="215.0" y="147.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">SELECT ... WHERE ... ORDER BY</text>
<polyline points="215,162 215,186" fill="none" stroke="#0f766e" stroke-width="2" stroke-linejoin="round"/>
<polygon points="215,186 208,178 222,178" fill="#0f766e"/>
<rect x="80" y="190" width="270" height="40" rx="6" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="215.0" y="215.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">the planner decides how</text>
<text x="215" y="254" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="normal">reordered and optimised freely</text>
<text x="215" y="276" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">no variables, no loops, no IF</text>
<rect x="430" y="56" width="350" height="240" rx="10" fill="#fde68a" stroke="#334155" stroke-width="2"/>
<text x="605" y="84" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">Procedural</text>
<text x="605" y="106" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="normal">you write the steps yourself</text>
<rect x="470" y="122" width="270" height="40" rx="6" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="605.0" y="147.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">IF ... LOOP ... := ...</text>
<polyline points="605,162 605,186" fill="none" stroke="#b45309" stroke-width="2" stroke-linejoin="round"/>
<polygon points="605,186 598,178 612,178" fill="#b45309"/>
<rect x="470" y="190" width="270" height="40" rx="6" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="605.0" y="215.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">executed exactly as written</text>
<text x="605" y="254" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#b45309" text-anchor="middle" font-weight="normal">nothing is reordered for you</text>
<text x="605" y="276" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">PL/pgSQL, functions, triggers</text>
<text x="410" y="320" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">you gave up the optimiser in exchange for control over the how</text>
</svg>
