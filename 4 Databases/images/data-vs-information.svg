<text x="112" y="127" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">'23'</text>
<rect x="164" y="106" width="80" height="32" rx="4" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="204" y="127" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">'1912'</text>
