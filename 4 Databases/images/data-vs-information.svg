<text x="204" y="171" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">'June'</text>
<text x="210" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">specific facts, no meaning</text>
<path d="M 378,135 L 444,135" fill="none" stroke="#0f766e" stroke-width="2"/>
<polygon points="434,130 434,140 444,135" fill="#0f766e"/>
<text x="411" y="122" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#0f766e" text-anchor="middle" font-weight="normal">connect</text>
<rect x="452" y="60" width="320" height="150" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="612" y="88" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#0f766e" text-anchor="middle" font-weight="bold">Information</text>
<rect x="474" y="112" width="276" height="56" rx="4" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="612" y="136" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">On June 23, 1912, Alan was</text>
<text x="612" y="156" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">born in London</text>
<text x="612" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">the meaning users attach to the facts</text>
