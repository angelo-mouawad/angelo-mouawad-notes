<text x="760.0" y="268.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">one session per open tab</text>
<text x="760" y="330" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="normal">keeps state while the tab is open</text>
<line x1="605" y1="135" x2="344.0" y2="135.0" stroke="#0f766e" stroke-width="2"/>
<polygon points="335,135 344.0,130.5 344.0,139.5" fill="#0f766e"/>
