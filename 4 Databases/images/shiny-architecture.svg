<text x="760" y="100" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">R process (the server)</text>
<rect x="635" y="120" width="250" height="46" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="760.0" y="148.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">server(input, output, session)</text>
<rect x="635" y="180" width="250" height="46" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="760.0" y="208.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">your R code: dplyr, ggplot2</text>
