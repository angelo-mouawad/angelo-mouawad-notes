<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect x="0" y="0" width="940" height="400" fill="#ffffff"/>
<text x="470.0" y="34" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#0f766e" text-anchor="middle" font-weight="bold">How a Shiny app talks to R</text>
<rect x="30" y="70" width="300" height="290" rx="8" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
<text x="180" y="100" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">Browser (the user)</text>
<rect x="55" y="120" width="250" height="46" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="180.0" y="148.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="normal">HTML, CSS, JavaScript</text>
<rect x="55" y="180" width="250" height="46" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="180.0" y="208.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">sliderInput, selectInput ...</text>
<rect x="55" y="240" width="250" height="46" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="180.0" y="268.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">plotOutput, tableOutput ...</text>
<text x="180" y="330" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="normal">built from your ui object</text>
