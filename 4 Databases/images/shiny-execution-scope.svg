<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect x="0" y="0" width="940" height="400" fill="#ffffff"/>
<text x="470.0" y="34" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#0f766e" text-anchor="middle" font-weight="bold">Where code runs, and how often</text>
<rect x="40" y="60" width="860" height="315" rx="8" fill="#fef3c7" stroke="#334155" stroke-width="2"/>
<text x="60" y="88" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold">Top level of app.R (outside server)</text>
<text x="880" y="88" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#92400e" text-anchor="end" font-weight="bold">runs ONCE per R process</text>
<text x="60" y="110" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="start" font-weight="normal">library(), read.csv(), helper functions: shared by every user</text>
<rect x="80" y="130" width="780" height="225" rx="8" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="100" y="158" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold">Inside server &lt;- function(input, output, session)</text>
<text x="840" y="158" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#0f766e" text-anchor="end" font-weight="bold">runs ONCE per user session</text>
<text x="100" y="180" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="start" font-weight="normal">per user state: reactiveVal(), counters, user specific objects</text>
<rect x="120" y="200" width="700" height="135" rx="8" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
<text x="140" y="228" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold">Inside reactive(), render*(), observe()</text>
<text x="800" y="228" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1d4ed8" text-anchor="end" font-weight="bold">runs on EVERY change</text>
<text x="140" y="252" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="start" font-weight="normal">keep this part as light as possible:</text>
<text x="140" y="274" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="start" font-weight="normal">filtering and plotting yes, reading a 2 GB file no</text>
<rect x="140" y="295" width="190" height="24" rx="12.0" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
<text x="235.0" y="310" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="bold">move slow work outward</text>
</svg>
