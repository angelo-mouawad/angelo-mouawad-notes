<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="800" height="330" fill="#ffffff"/>
<text x="400" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">One decisive difference: who owns the transaction</text>
<rect x="70" y="66" width="330" height="30" rx="0" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
<text x="235.0" y="85.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">Function</text>
<rect x="400" y="66" width="330" height="30" rx="0" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
<text x="565.0" y="85.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">Procedure</text>
<rect x="70" y="96" width="330" height="30" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="235.0" y="115.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">CREATE FUNCTION</text>
<rect x="400" y="96" width="330" height="30" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="565.0" y="115.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">CREATE PROCEDURE</text>
<rect x="70" y="126" width="330" height="30" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="235.0" y="145.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">SELECT f(x)</text>
<rect x="400" y="126" width="330" height="30" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="565.0" y="145.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">CALL p(x)</text>
<rect x="70" y="156" width="330" height="30" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="235.0" y="175.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">RETURNS is mandatory</text>
<rect x="400" y="156" width="330" height="30" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="565.0" y="175.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">no RETURNS clause</text>
<rect x="70" y="186" width="330" height="30" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="235.0" y="205.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">usable inside a query</text>
<rect x="400" y="186" width="330" height="30" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="565.0" y="205.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">never inside a query</text>
<rect x="70" y="216" width="330" height="30" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="235.0" y="235.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">cannot COMMIT</text>
<rect x="400" y="216" width="330" height="30" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="565.0" y="235.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">can COMMIT and ROLLBACK</text>
<rect x="70" y="246" width="660" height="62" rx="8" fill="#fde68a" stroke="#334155" stroke-width="2"/>
<text x="400" y="272" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">a function always runs inside the caller's transaction and cannot end it</text>
<text x="400" y="294" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#b45309" text-anchor="middle" font-weight="normal">which is why batch jobs that commit incrementally have to be procedures</text>
</svg>
