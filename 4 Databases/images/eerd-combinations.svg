<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="880" height="440" fill="#ffffff"/>
<text x="440" y="34" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">The four combinations, and what each one allows</text>
<rect x="40" y="60" width="380" height="168" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="230" y="94" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">Total disjoint</text>
<text x="230" y="118" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">exactly one subtype, never zero, never both</text>
<line x1="78" y1="142" x2="122" y2="142" stroke="#334155" stroke-width="2"/>
<line x1="78" y1="148" x2="122" y2="148" stroke="#334155" stroke-width="2"/>
<line x1="100" y1="148" x2="100" y2="160" stroke="#334155" stroke-width="2"/>
<circle cx="100" cy="176" r="16" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="100" y="182" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold">D</text>
<circle cx="256" cy="160" r="30" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
<circle cx="324" cy="160" r="30" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
<text x="290" y="214" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">no overlap</text>
<rect x="460" y="60" width="380" height="168" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="650" y="94" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">Total overlapping</text>
<text x="650" y="118" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">at least one subtype, possibly both</text>
<line x1="498" y1="142" x2="542" y2="142" stroke="#334155" stroke-width="2"/>
<line x1="498" y1="148" x2="542" y2="148" stroke="#334155" stroke-width="2"/>
<line x1="520" y1="148" x2="520" y2="160" stroke="#334155" stroke-width="2"/>
<circle cx="520" cy="176" r="16" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="520" y="182" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold">O</text>
<circle cx="690" cy="160" r="30" fill="#0f766e" opacity="0.18" stroke="#0f766e" stroke-width="2"/>
<circle cx="730" cy="160" r="30" fill="#0f766e" opacity="0.18" stroke="#0f766e" stroke-width="2"/>
<text x="710" y="214" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">overlap allowed</text>
<rect x="40" y="248" width="380" height="168" rx="6" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
<text x="230" y="282" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">Optional disjoint</text>
<text x="230" y="306" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">at most one subtype, possibly neither</text>
<line x1="78" y1="333" x2="122" y2="333" stroke="#334155" stroke-width="2"/>
<line x1="100" y1="336" x2="100" y2="348" stroke="#334155" stroke-width="2"/>
<circle cx="100" cy="364" r="16" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="100" y="370" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold">D</text>
<circle cx="256" cy="348" r="30" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
<circle cx="324" cy="348" r="30" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
<text x="290" y="402" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">no overlap</text>
<rect x="460" y="248" width="380" height="168" rx="6" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
<text x="650" y="282" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">Optional overlapping</text>
<text x="650" y="306" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">any combination, including neither</text>
<line x1="498" y1="333" x2="542" y2="333" stroke="#334155" stroke-width="2"/>
<line x1="520" y1="336" x2="520" y2="348" stroke="#334155" stroke-width="2"/>
<circle cx="520" cy="364" r="16" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="520" y="370" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold">O</text>
<circle cx="690" cy="348" r="30" fill="#0f766e" opacity="0.18" stroke="#0f766e" stroke-width="2"/>
<circle cx="730" cy="348" r="30" fill="#0f766e" opacity="0.18" stroke="#0f766e" stroke-width="2"/>
<text x="710" y="402" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">overlap allowed</text>
</svg>
