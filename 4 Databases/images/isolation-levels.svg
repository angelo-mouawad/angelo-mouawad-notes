<rect x="675" y="60" width="195" height="200" rx="8" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="772" y="88" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">Serializable</text>
