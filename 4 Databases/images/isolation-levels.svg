<text x="557" y="88" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">Repeatable Read</text>
<line x1="476" y1="100" x2="639" y2="100" stroke="#334155" stroke-width="1.5"/>
<text x="557" y="122" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal">still allows</text>
