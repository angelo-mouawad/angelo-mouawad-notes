<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="840" height="330" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="840" height="330" fill="#ffffff"/>
<text x="420" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">Four loop forms, and the last one is the one you actually use</text>
<rect x="25" y="60" width="190" height="150" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="120" y="88" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold">LOOP</text>
<line x1="41" y1="100" x2="199" y2="100" stroke="#334155" stroke-width="1.5"/>
<text x="120" y="126" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">runs forever until EXIT</text>
<text x="120" y="172" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="normal">EXIT WHEN i &gt;= 5;</text>
<rect x="225" y="60" width="190" height="150" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="320" y="88" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold">WHILE</text>
<line x1="241" y1="100" x2="399" y2="100" stroke="#334155" stroke-width="1.5"/>
<text x="320" y="126" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">condition checked first</text>
<text x="320" y="172" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="normal">WHILE i &lt; 5 LOOP</text>
<rect x="425" y="60" width="190" height="150" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="520" y="88" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold">FOR i IN 1..5</text>
<line x1="441" y1="100" x2="599" y2="100" stroke="#334155" stroke-width="1.5"/>
<text x="520" y="126" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">over a range of integers</text>
<text x="520" y="172" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="normal">i is created for you</text>
<rect x="625" y="60" width="190" height="150" rx="10" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="720" y="88" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold">FOR rec IN SELECT</text>
<line x1="641" y1="100" x2="799" y2="100" stroke="#334155" stroke-width="1.5"/>
<text x="720" y="126" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">over the rows of a query</text>
<text x="720" y="172" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="normal">rec.id, rec.name</text>
<rect x="25" y="234" width="790" height="76" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="420" y="262" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#b91c1c" text-anchor="middle" font-weight="bold">but if a single statement can do the job, do not loop at all</text>
<text x="420" y="288" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">row by row is called RBAR, and it costs one planning and execution cycle per row</text>
</svg>
