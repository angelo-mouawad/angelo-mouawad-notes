<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="900" height="300" fill="#ffffff"/>
<text x="450" y="34" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">What each join keeps</text>
<rect x="25" y="60" width="190" height="190" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<defs><clipPath id="clip0"><circle cx="92" cy="140" r="46"/></clipPath></defs>
<circle cx="148" cy="140" r="46" fill="#0f766e" opacity="0.55" clip-path="url(#clip0)"/>
<circle cx="92" cy="140" r="46" fill="none" stroke="#334155" stroke-width="2"/>
<circle cx="148" cy="140" r="46" fill="none" stroke="#334155" stroke-width="2"/>
<text x="58" y="145" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">A</text>
<text x="182" y="145" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">B</text>
<text x="120" y="212" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" fill="#0f766e" text-anchor="middle" font-weight="bold">INNER JOIN</text>
<text x="120" y="236" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">only the matching rows</text>
<rect x="245" y="60" width="190" height="190" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<defs><clipPath id="clip1"><circle cx="312" cy="140" r="46"/></clipPath></defs>
<circle cx="312" cy="140" r="46" fill="#0f766e" opacity="0.35"/>
<circle cx="312" cy="140" r="46" fill="none" stroke="#334155" stroke-width="2"/>
<circle cx="368" cy="140" r="46" fill="none" stroke="#334155" stroke-width="2"/>
<text x="278" y="145" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">A</text>
<text x="402" y="145" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">B</text>
<text x="340" y="212" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" fill="#0f766e" text-anchor="middle" font-weight="bold">LEFT JOIN</text>
<text x="340" y="236" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">all of A, matches from B</text>
<rect x="465" y="60" width="190" height="190" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<defs><clipPath id="clip2"><circle cx="532" cy="140" r="46"/></clipPath></defs>
<circle cx="588" cy="140" r="46" fill="#0f766e" opacity="0.35"/>
<circle cx="532" cy="140" r="46" fill="none" stroke="#334155" stroke-width="2"/>
<circle cx="588" cy="140" r="46" fill="none" stroke="#334155" stroke-width="2"/>
<text x="498" y="145" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">A</text>
<text x="622" y="145" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">B</text>
<text x="560" y="212" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" fill="#0f766e" text-anchor="middle" font-weight="bold">RIGHT JOIN</text>
<text x="560" y="236" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">all of B, matches from A</text>
<rect x="685" y="60" width="190" height="190" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<defs><clipPath id="clip3"><circle cx="752" cy="140" r="46"/></clipPath></defs>
<circle cx="752" cy="140" r="46" fill="#0f766e" opacity="0.35"/>
<circle cx="808" cy="140" r="46" fill="#0f766e" opacity="0.35"/>
<circle cx="752" cy="140" r="46" fill="none" stroke="#334155" stroke-width="2"/>
<circle cx="808" cy="140" r="46" fill="none" stroke="#334155" stroke-width="2"/>
<text x="718" y="145" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">A</text>
<text x="842" y="145" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">B</text>
<text x="780" y="212" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" fill="#0f766e" text-anchor="middle" font-weight="bold">FULL JOIN</text>
<text x="780" y="236" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="normal">everything from both</text>
<text x="450" y="284" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">unmatched columns on the missing side come back as NULL</text>
</svg>
