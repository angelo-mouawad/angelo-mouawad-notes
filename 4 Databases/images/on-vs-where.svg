<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" width="840" height="400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="840" height="400" fill="#ffffff"/>
<text x="420" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">The same condition, two very different results</text>
<rect x="40" y="56" width="360" height="314" rx="10" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="60" y="84" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">LEFT JOIN enrolments e</text>
<text x="60" y="104" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">  ON s.id = e.student_id</text>
<text x="60" y="124" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal"> AND e.course = 'Maths'</text>
<rect x="100" y="156" width="120" height="26" rx="0" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
<text x="160.0" y="173.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold">name</text>
<rect x="220" y="156" width="120" height="26" rx="0" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
<text x="280.0" y="173.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold">course</text>
<rect x="100" y="182" width="120" height="26" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="160.0" y="199.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">Ana</text>
<rect x="220" y="182" width="120" height="26" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="280.0" y="199.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">Maths</text>
<rect x="100" y="208" width="120" height="26" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="160.0" y="225.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">Ben</text>
<rect x="220" y="208" width="120" height="26" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="280.0" y="225.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">NULL</text>
<rect x="100" y="234" width="120" height="26" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="160.0" y="251.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">Cleo</text>
<rect x="220" y="234" width="120" height="26" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="280.0" y="251.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">NULL</text>
<text x="220" y="302" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="normal">ON narrows what counts as a match,</text>
<text x="220" y="322" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="normal">unmatched left rows still get NULLs</text>
<rect x="440" y="56" width="360" height="314" rx="10" fill="#fee2e2" stroke="#334155" stroke-width="2"/>
<text x="460" y="84" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">LEFT JOIN enrolments e</text>
<text x="460" y="104" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">  ON s.id = e.student_id</text>
<text x="460" y="124" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">WHERE e.course = 'Maths'</text>
<rect x="500" y="156" width="120" height="26" rx="0" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
<text x="560.0" y="173.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold">name</text>
<rect x="620" y="156" width="120" height="26" rx="0" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
<text x="680.0" y="173.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold">course</text>
<rect x="500" y="182" width="120" height="26" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="560.0" y="199.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">Ana</text>
<rect x="620" y="182" width="120" height="26" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="680.0" y="199.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">Maths</text>
<text x="620" y="302" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="normal">WHERE filters after the join, and the</text>
<text x="620" y="322" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="normal">NULL rows fail it, so this is an inner join</text>
</svg>
