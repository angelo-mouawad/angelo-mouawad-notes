<text x="240" y="330" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">startup cost .. total cost, in arbitrary planner units</text>
<text x="70" y="356" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">a parent's cost already includes its children, so never add the numbers up</text>
