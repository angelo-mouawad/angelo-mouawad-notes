<text x="355.0" y="177.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle">step A</text>
<rect x="490" y="150" width="110" height="44" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="545.0" y="177.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle">step B</text>
<path d="M 355,194 L 355,234 L 389,234" fill="none" stroke="#334155" stroke-width="2"/>
<polygon points="379,229 379,239 389,234" fill="#334155"/>
<path d="M 545,194 L 545,234 L 511,234" fill="none" stroke="#334155" stroke-width="2"/>
<polygon points="521,229 521,239 511,234" fill="#334155"/>
<rect x="395" y="212" width="110" height="44" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
