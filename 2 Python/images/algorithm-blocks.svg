<text x="818" y="220" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="normal">False</text>
<rect x="715" y="240" width="150" height="44" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="790.0" y="267.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle">exit the loop</text>
</svg>
