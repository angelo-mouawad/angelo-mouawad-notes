<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="800" height="300" fill="#ffffff"/>
<text x="200" y="40" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">List, everything is stored</text>
<rect x="60" y="70" width="60" height="50" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="90.0" y="100.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="normal">1</text>
<rect x="130" y="70" width="60" height="50" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="160.0" y="100.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="normal">4</text>
<rect x="200" y="70" width="60" height="50" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="230.0" y="100.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="normal">9</text>
<rect x="270" y="70" width="60" height="50" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="300.0" y="100.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="normal">16</text>
<text x="200" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">all four values sit in memory</text>
<text x="200" y="172" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">at the same time</text>
<line x1="400" y1="30" x2="400" y2="270" stroke="#334155" stroke-width="1" stroke-dasharray="5 5"/>
<text x="600" y="40" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">Generator, one at a time</text>
<rect x="470" y="70" width="130" height="50" rx="6" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
<text x="535.0" y="100.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">yield i * i</text>
<path d="M 600,95 L 660,95" fill="none" stroke="#0f766e" stroke-width="2"/>
<polygon points="650,90 650,100 660,95" fill="#0f766e"/>
<rect x="665" y="70" width="60" height="50" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<text x="695.0" y="100.0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="normal">1</text>
<text x="600" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">next() asks for the following value</text>
<text x="600" y="172" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="normal">nothing is kept behind it</text>
<rect x="470" y="200" width="255" height="46" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="597.5" y="228.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="normal">less memory, and only once</text>
<rect x="60" y="200" width="280" height="46" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
<text x="200.0" y="228.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="normal">you can loop over it again</text>
</svg>
