<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="780" height="400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="780" height="400" fill="#ffffff"/>
<rect x="255" y="20" width="270" height="96" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="2" stroke-dasharray="7 5"/>
