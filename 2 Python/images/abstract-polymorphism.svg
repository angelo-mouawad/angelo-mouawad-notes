<text x="390.0" y="43" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">Shape(ABC)</text>
<text x="269" y="78" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">@abstractmethod</text>
<text x="269" y="102" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">calculate_area()</text>
<text x="645" y="78" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">abstract, so no object</text>
<text x="645" y="98" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">can be made from it</text>
<rect x="50" y="210" width="250" height="96" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<line x1="50" y1="244" x2="300" y2="244" stroke="#334155" stroke-width="2"/>
<text x="175.0" y="233" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">Circle</text>
<text x="64" y="268" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">calculate_area()</text>
<text x="64" y="292" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">3.14 * r ** 2</text>
<rect x="460" y="210" width="250" height="96" rx="6" fill="#ccfbf1" stroke="#334155" stroke-width="2"/>
<line x1="460" y1="244" x2="710" y2="244" stroke="#334155" stroke-width="2"/>
<text x="585.0" y="233" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">Square</text>
<text x="474" y="268" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">calculate_area()</text>
<text x="474" y="292" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">side * side</text>
<path d="M 175,210 L 175,175 L 330,175 L 330,120" fill="none" stroke="#0f766e" stroke-width="2"/>
<polygon points="325,130 335,130 330,120" fill="#0f766e"/>
<path d="M 585,210 L 585,175 L 450,175 L 450,120" fill="none" stroke="#0f766e" stroke-width="2"/>
<polygon points="445,130 455,130 450,120" fill="#0f766e"/>
<text x="390" y="340" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">for shape in shapes: shape.calculate_area()</text>
<text x="390" y="366" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="normal">the version that runs is picked at runtime from the actual object</text>
</svg>
